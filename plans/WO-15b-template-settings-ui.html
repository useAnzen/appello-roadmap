# WO-15b: Work Order Templates · Settings UI — Implementation Plan

## Overview

Admin desktop UI for managing the templates introduced by WO-15a. Two surfaces: a **templates list** that lands inside Property Settings → Work Orders as a new "Templates" sub-tab, and a **per-template detail page** at `/settings/work-orders/templates/[id]` with six child collection editors. Permission gate is `InstanceSetting.edit` per CLAUDE.md helper.

WO-15a already added every GraphQL query / mutation this UI needs. **One backend addition lives in this spec:** a `WorkOrderTemplateCounts` aggregate field on `WorkOrderTemplate` for the list page's content pills (so we don't N+1 child fetches per row).

**Estimated effort:** 4-5 days (matches spec)
**Risk:** Medium — touches Property Settings shell (used across the platform), adds an `extraTabs` prop to the generic `DataModelSettingsTabs` (small surface, every existing call site unaffected), forks WO-14's checklist editor for template-mode (PR #7155 is still OPEN — sequencing matters).
**Spec:** `tm-work-orders-uis/wo-15b-template-settings-ui.html`
**Requires:** WO-15a (schema + GraphQL surface, all CRUD already shipped), WO-14 / PR #7155 (`WorkOrderChecklistSection` source we partially reuse — must be merged before the checklist tab can be built, or the checklist tab ships with a forked component)
**Enables:** WO-15c (admins must be able to build templates worth applying)

---

## Decided — design calls that fall out of the codebase audit

**Templates is a new tab inside the existing Work Orders settings tab strip — inserted between "Manage Forms" and "Custom Properties".** Property Settings (`apps/frontend/src/components/Settings/PropertySettings.tsx`) renders `<DataModelSettingsTabs referenceModel="Job" subModel="WorkOrder" />` for the Work Orders top-level tab. `DataModelSettingsTabs` (`apps/frontend/src/components/Settings/PropertySettingTabs/DataModelSettingsTabs.tsx`) is the generic tabbed shell that surfaces Detail View Layout, Settings View Layout, Manage Forms, Custom Properties, Default Properties, and Default Folder Structure. We extend it with an optional `extraTabs?: Array<{ tab: ITabGroupData; insertAfter: string }>` prop so the Work Orders mount can splice in a "Templates" tab `insertAfter: "manageForms"`. Generic, doesn't duplicate the tab definitions, and other DataModel surfaces inherit the hook if they grow their own surface-specific tabs later. **No nested-wrapper component needed — `DataModelSettingsTabs` stays the source of truth.**

**Edit / create opens a full-size vertical flyout — the `EquipmentCategoryAddEditForm` pattern is the Settings full-edit convention.** Every full-detail Settings entity uses a **full-size vertical flyout** with a 12-col grid inside: basic fields stacked in a left `col-span-3` panel, complex / tabbed interfaces in a right `col-span-9` panel, and `<SaveCancelButtons>` at the bottom. `apps/frontend/src/components/Forms/EquipmentCategory/index.tsx` is the canonical model — Card-wrapped, left panel for FormStacks (name, description, prefixCUID, account, meter type, can-be-attachment, inspection frequency), right panel for a `TabGroup` with 4+ tabs (Edit Layout, Form Visibility, Edit Rates, Maintenance Thresholds). The detail view IS the edit form — clicking a row in the list opens the flyout pre-loaded with the template; clicking the "+ New Template" button opens an empty version. Match the existing `openFlyout(<EquipmentCategoryAddEditForm .../>)` call site for the exact size + orientation options. **No separate Pages Router route, no separate detail-view component.** This corrects the earlier misread of Settings conventions.

**Checklist editor — fork the outer wrapper, reuse the inner row.** WO-14's `<WorkOrderChecklistSection>` (PR #7155) is hardcoded to `jobId` in its queries and mutations (`GET_WO_CHECKLIST_ITEMS`, `CREATE_WO_CHECKLIST_ITEM`, `UPSERT_WO_CHECKLIST_ITEMS` — all take `jobId: ID!`). It cannot be mounted as-is for templates. The **`<ChecklistItemRow>` and `<SortableChecklistItem>` sub-components, however, are GraphQL-agnostic** — they take callbacks (`onTick`, `onArchive`, `onLabelChange`, `onDescriptionChange`, `onPhotoRequiredChange`) and no GraphQL refs. So we **fork the outer `<WorkOrderChecklistSection>` into `<WorkOrderTemplateChecklistSection>`** with template-targeted GraphQL operations (which WO-15a already provides) and **reuse `<ChecklistItemRow>` + `<SortableChecklistItem>` directly**. This avoids waiting on a refactor of PR #7155 and keeps the row UI identical between Settings (job-side) and Settings (template-side). Optional follow-up: refactor toward a shared `<ChecklistEditor>` inner component once both surfaces have shipped; not in this spec's scope.

**No existing pickers for TradeLevel / EquipmentCategory / FormWrapper / DAA — we build them with `CustomCombobox`.** The audit confirmed `CustomCombobox` (from `@useanzen/ui`) is the standard searchable picker. It's already used for Material (`packages/ui/.../MaterialItemEditor.tsx:272-294`) and Equipment (`packages/ui/.../EquipmentItemEditor.tsx:307-331`) via the `useSearchCore` flag (Solr-backed). For models that aren't Solr-indexed (TradeLevel, EquipmentCategory, FormWrapper, DAA), we pass a custom `query` prop with a `tableData` query (per CLAUDE.md "TableFeed Queries (Preferred for Data Fetching)") so permission scoping is enforced. Each picker is a small wrapper component built once and reused across the relevant editor tab + the apply UI (WO-15c).

**One backend addition: `WorkOrderTemplateCounts`.** The list page's content pills (e.g. "12 checks · 2 forms · 3 mat · 2 plans") need per-row counts. Resolving them via the existing child resolvers means N+1 fetches per list row. Add a `counts` field on `WorkOrderTemplate` that returns a small aggregate type. Spec called this out under §5.1; we ship it as part of WO-15b, not as a tail end of WO-15a, because it's UI-driven.

## Step 1: Backend Additions — Counts Aggregate, Upsert Mutation, Delete Mutation

**File:** `apps/api/src/graphql/models/WorkOrderTemplate.ts` (the file added by WO-15a Step 6)

Three backend additions live in this spec, all landing as a small WO-15a addendum in WO-15b's PR:

1. **`WorkOrderTemplate.counts` aggregate** — for the list page's content pills (no N+1 fan-out per row).
2. **`upsertWorkOrderTemplate` mutation** — the single endpoint the AddEdit flyout form (Step 4) calls on Save. Accepts the full template payload + every child collection's survivor list + every child collection's archive list, performs create/edit/archive across all of them in one go.
3. **`deleteWorkOrderTemplate` mutation** — the entry point for `ListTableViews`'s built-in delete-with-impact-count flow (Step 3c).

### 1.1 — `counts` aggregate

Adds a `counts: WorkOrderTemplateCounts!` resolver field that aggregates each child collection's active-row count in one query, so the list page renders `N items · M forms · …` per row without N+1 fan-out.

### 1.1a. New GraphQL type + resolver

```graphql
type WorkOrderTemplateCounts {
    checklistItems: Int!
    materialItems:  Int!
    laborPlans:     Int!
    equipmentPlans: Int!
    formWrappers:   Int!
    fieldDefaults:  Int!
}

extend type WorkOrderTemplate {
    counts: WorkOrderTemplateCounts!
}
```

The field resolver on `WorkOrderTemplate.counts` runs six `count()` queries against the child models in parallel. Each filters on `workOrderTemplateId = parent.id`, `isDeleted: false`, `isArchived: false`. No new mutation, no list query change — the existing `workOrderTemplates(options)` query picks `counts` up via the field resolver.

```typescript
// Inside the resolvers object exported from apps/api/src/graphql/models/WorkOrderTemplate.ts:
WorkOrderTemplate: {
    counts: async (parent) => {
        const where = {
            workOrderTemplateId: parent.id,
            isDeleted: false,
            isArchived: false
        };
        const [
            checklistItems,
            materialItems,
            laborPlans,
            equipmentPlans,
            formWrappers,
            fieldDefaults
        ] = await Promise.all([
            prisma.workOrderTemplateChecklistItem.count({ where }),
            prisma.workOrderTemplateMaterialItem.count({ where }),
            prisma.workOrderTemplateLaborPlan.count({ where }),
            prisma.workOrderTemplateEquipmentPlan.count({ where }),
            prisma.workOrderTemplateFormWrapper.count({ where }),
            prisma.workOrderTemplateFieldDefault.count({ where })
        ]);
        return { checklistItems, materialItems, laborPlans, equipmentPlans, formWrappers, fieldDefaults };
    }
}
```

`prisma.xxx.count()` is fine here — it's a pure aggregate, no row writes, no audit, no permission-scoping concern (the parent template was already permission-checked by the `workOrderTemplates` / `workOrderTemplate` resolver that returned it). Per CLAUDE.md the "no raw prisma" rule applies to **list / read / write of records**, not aggregate counts.

### 1.1b. TypeScript type

Add to `apps/api/src/types/WorkOrderTemplate.types.ts` (the single-file home from WO-15a Step 4):

```typescript
export interface IWorkOrderTemplateCounts {
    checklistItems: number;
    materialItems: number;
    laborPlans: number;
    equipmentPlans: number;
    formWrappers: number;
    fieldDefaults: number;
}
```

### 1.1c. No counts-side mutation, no schema, no migration

Schema unchanged. Migration unchanged. This is a read-only computed field.

### 1.2 — `upsertWorkOrderTemplate` mutation — single endpoint, full payload

The detail flyout form (Step 4) calls **one** mutation on Save: `upsertWorkOrderTemplate`. It takes the template header + every child collection's full survivor list (rows with id-or-null) + every child collection's archive list (ids to soft-delete). The resolver branches create-vs-edit on whether the `templateId` is present, then runs all the child writes in parallel per the WO-15a §8c BaseModel-method pattern. **Atomic from the user's perspective** — either the entire upsert succeeds or none of it does (compensating soft-delete on the parent template if the resolver throws partway, per WO-15a §8e).

Mirrors the existing `useUpsertEquipmentCategoryMutation` pattern (`apps/frontend/src/components/Forms/EquipmentCategory/index.tsx:177-186` — `upsertData({ variables: { category, equipmentSections, sectionsToDelete, sectionAttributesToDelete, publiclyVisibleFormIds } })`).

#### 1.2a GraphQL types

```graphql
input UpsertWorkOrderTemplateInput {
    """ Null = create; set = edit. """
    id: String

    # Header fields
    name: String!
    description: String
    estimatedDuration: Int
    isActive: Boolean

    # Survivors per child collection. Each row's id is null for create, set for edit.
    # Anything in the existing collection NOT covered by an `archiveIds` entry that ALSO
    # isn't in the survivor list will be ignored (no orphan writes — see 1.2b).
    checklistItems:  [UpsertWorkOrderTemplateChecklistItemInput!]
    materialItems:   [UpsertWorkOrderTemplateMaterialItemInput!]
    laborPlans:      [UpsertWorkOrderTemplateLaborPlanInput!]
    equipmentPlans:  [UpsertWorkOrderTemplateEquipmentPlanInput!]
    formWrappers:    [UpsertWorkOrderTemplateFormWrapperInput!]
    fieldDefaults:   [UpsertWorkOrderTemplateFieldDefaultInput!]

    # Archives — ids the user removed during this session.
    archivedChecklistItemIds:  [String!]
    archivedMaterialItemIds:   [String!]
    archivedLaborPlanIds:      [String!]
    archivedEquipmentPlanIds:  [String!]
    archivedFormWrapperIds:    [String!]
    archivedFieldDefaultIds:   [String!]
}

input UpsertWorkOrderTemplateChecklistItemInput {
    id: String                  # null = create
    label: String!
    description: String
    orderNo: Int
    photoRequired: Boolean
}

# ...analogous Upsert inputs for the other five collections. Mirrors the
# per-collection Create/Edit inputs from WO-15a Step 6c, merged into a single
# upsert shape per row.

extend type Mutation {
    upsertWorkOrderTemplate(data: UpsertWorkOrderTemplateInput!): WorkOrderTemplate!
}
```

The mutation **always returns the fully-resolved template** (with `counts` and the six child collection arrays) so Apollo updates the flyout's local cache without a refetch. The list-page query also picks up the change because `workOrderTemplates(options)` and `workOrderTemplate(id)` share Apollo cache normalization on the `WorkOrderTemplate` type.

#### 1.2b Resolver

Per CLAUDE.md "GraphQL Resolvers Must Stay Thin" — body is a one-liner delegating to a new `upsertItem` method on the `WorkOrderTemplate` model:

```typescript
// apps/api/src/graphql/models/WorkOrderTemplate.ts
upsertWorkOrderTemplate: (_, args, context) =>
    new WorkOrderTemplateModel().upsertItem(args.data, context.userId())
```

The model method does the orchestration:

```typescript
// apps/api/src/models/WorkOrderTemplate.ts
public async upsertItem(
    data: IUpsertWorkOrderTemplateInput,
    currentUserId: string
): Promise<FullModel<IWorkOrderTemplate>> {
    // 1. Create or edit the parent
    const { id, checklistItems, materialItems, laborPlans, equipmentPlans,
            formWrappers, fieldDefaults, archivedChecklistItemIds,
            archivedMaterialItemIds, archivedLaborPlanIds, archivedEquipmentPlanIds,
            archivedFormWrapperIds, archivedFieldDefaultIds, ...header } = data;

    const template = id
        ? await this.editItem(id, header, currentUserId)
        : await this.createItem(header, currentUserId);

    try {
        // 2. Six survivor passes, each in Promise.all per WO-15a §8c.
        //    Each editor's "upsert one row" goes through the per-row model's
        //    createItem (when row.id is null) or editItem (when row.id is set) —
        //    so audits, permission checks, customCreateItem hooks all run.
        await Promise.all([
            ...checklistItemModel_upsertAll(template.id, checklistItems, currentUserId),
            ...materialItemModel_upsertAll(template.id, materialItems, currentUserId),
            ...laborPlanModel_upsertAll(template.id, laborPlans, currentUserId),
            ...equipmentPlanModel_upsertAll(template.id, equipmentPlans, currentUserId),
            ...formWrapperModel_upsertAll(template.id, formWrappers, currentUserId),
            ...fieldDefaultModel_upsertAll(template.id, fieldDefaults, currentUserId)
        ]);

        // 3. Six archive passes in Promise.all — archived ids get soft-deleted.
        //    Routes through BaseModel.deleteItem so audits + cascade hooks fire.
        await Promise.all([
            ...archivedChecklistItemIds.map((i) => new WorkOrderTemplateChecklistItemModel().deleteItem(i, currentUserId)),
            ...archivedMaterialItemIds.map((i) => new WorkOrderTemplateMaterialItemModel().deleteItem(i, currentUserId)),
            ...archivedLaborPlanIds.map((i) => new WorkOrderTemplateLaborPlanModel().deleteItem(i, currentUserId)),
            ...archivedEquipmentPlanIds.map((i) => new WorkOrderTemplateEquipmentPlanModel().deleteItem(i, currentUserId)),
            ...archivedFormWrapperIds.map((i) => new WorkOrderTemplateFormWrapperModel().deleteItem(i, currentUserId)),
            ...archivedFieldDefaultIds.map((i) => new WorkOrderTemplateFieldDefaultModel().deleteItem(i, currentUserId))
        ]);
    } catch (err) {
        // Compensating delete — same pattern as WO-15a §8e. If this was a create,
        // the just-created template is rolled back. If this was an edit, the
        // parent stays but the half-applied children are flagged for review.
        if (!id) {
            await this.deleteItem(template.id, currentUserId);
        }
        throw err;
    }

    return template;
}

// Each `xxxModel_upsertAll` is a small helper that maps the survivor array to
// per-row createItem (id null) or editItem (id set) calls — all going through
// BaseModel methods so the no-raw-prisma rule from CLAUDE.md is preserved.
function checklistItemModel_upsertAll(
    workOrderTemplateId: string,
    rows: IUpsertWorkOrderTemplateChecklistItemInput[],
    currentUserId: string
): Array<Promise<unknown>> {
    const model = new WorkOrderTemplateChecklistItemModel();
    return (rows ?? []).map((row) =>
        row.id
            ? model.editItem(row.id, { /* row fields minus id */ }, currentUserId)
            : model.createItem({ workOrderTemplateId, /* row fields minus id */ }, currentUserId)
    );
}
```

#### 1.2c Why one big mutation, not per-collection saveRefs

- **Atomic from the user's perspective.** One Save click either fully succeeds or fully fails. No "header saved but materials failed; reopen the form" half-state.
- **One round-trip.** The flyout has six child collections; six independent mutations is six API calls; the upsert is one.
- **Matches the precedent.** `useUpsertEquipmentCategoryMutation` is exactly this shape for EquipmentCategory.
- **Cache normalization is cleaner.** The mutation returns the fully-resolved `WorkOrderTemplate`, so Apollo updates the list page cache automatically without a refetch.

### 1.3 — `deleteWorkOrderTemplate` mutation

Required by `ListTableViews`'s built-in delete-with-impact-count flow (Step 3c). One-line resolver:

```typescript
// apps/api/src/graphql/models/WorkOrderTemplate.ts
deleteWorkOrderTemplate: (_, args, context) =>
    new WorkOrderTemplateModel().deleteItem(args.id, context.userId())
```

`BaseModel.deleteItem` sets `isDeleted = true` and cascades soft-deletes through the model's `deleteChildren` hook. `WorkOrderTemplateModel.deleteChildren` needs an override that soft-deletes every `WorkOrderTemplate*` child collection — confirm at implementation whether `BaseModel` does this generically already; if not, add a small override. `Job.appliedWorkOrderTemplateId` SetNulls on referencing Jobs per WO-15a Step 2a.

## Step 2: Insert "Templates" Tab Between Manage Forms and Custom Properties

**Files:**
- `apps/frontend/src/components/Settings/PropertySettingTabs/DataModelSettingsTabs.tsx` — add `extraTabs` prop + insertion logic
- `apps/frontend/src/components/Settings/PropertySettings.tsx` — Work Orders tab mount passes the new `extraTabs` arg

### 2a. Extend `DataModelSettingsTabs` with optional `extraTabs`

`DataModelSettingsTabs` is generic and used by multiple top-level settings (Job, Project, Company, RFI, etc.) — we can't hardcode Templates inside it. The smallest generic enhancement: an `extraTabs?` prop that lets the caller splice extra tabs at named positions.

```typescript
// In DataModelSettingsTabs.tsx props interface (lines 13-20):
interface IUserSettingsTabsProps {
    className?: string | ClassNames;
    allowEdit?: boolean;
    referenceModel: GqlTableDataName;
    supportedTypes?: GqlDataModelFormType[];
    subModel?: string;
    propertyNameFilter?: Array<string>;
    extraTabs?: Array<{
        /** The id of an existing tab. The extra tab is inserted immediately after it. */
        insertAfter: string;
        /** Standard ITabGroupData shape — id, label, content, permission, className. */
        tab: ITabGroupData;
    }>;
}
```

In the component body, build the base `groups` array as today, then run a single splice pass over `extraTabs` (ordered, idempotent):

```typescript
const groups = [
    { id: "detailViewLayout", label: "Detail View Layout", ... },
    { id: "settingsViewLayout", label: "Settings View Layout", ... },
    { id: "manageForms", label: "Manage Forms", ... },
    { id: "documentAttributes", label: "Custom Properties", ... },
    { id: "propertyValues", label: "Default Properties", ... },
    // ...optional default-folder-structure
];

for (const extra of extraTabs ?? []) {
    const idx = groups.findIndex((g) => g.id === extra.insertAfter);
    if (idx >= 0) groups.splice(idx + 1, 0, extra.tab);
    else groups.push(extra.tab);     // fallback: append if anchor not found
}
```

No behavior change when `extraTabs` is omitted — every existing call to `DataModelSettingsTabs` is unaffected.

## Step 3: Templates List Tab — `WorkOrderTemplatesListTab.tsx`

**File:** `apps/frontend/src/components/Settings/PropertySettingTabs/WorkOrderTemplatesListTab.tsx` (NEW)

The tab content. Renders `<ListTableViews>` (the existing app-wide list shell at `apps/frontend/src/components/ListTableViews/ListTableViews.tsx`) over the `workOrderTemplates` query, with create / edit / archive flowing through a flyout that mounts `<WorkOrderTemplateAddEditForm>` (Step 4).

### 3a. GraphQL — list query

Standard `workOrderTemplates(options)` from WO-15a Step 6b. Each row pulls `counts` (Step 1) for the content pills.

```graphql
query GetWorkOrderTemplates($options: GetListOptions) {
    workOrderTemplates(options: $options) {
        data {
            ... on WorkOrderTemplate {

                description

                lastUsedAt

                counts {
                    checklistItems
                    materialItems
                    laborPlans
                    equipmentPlans
                    formWrappers
                    fieldDefaults
                }
            }
        }
        total
    }
}
```

### 4b. Save shape — controlled state lifted to the form, ONE upsert mutation on Save

Per Step 1.2 the form fires a **single** `upsertWorkOrderTemplate` mutation with all six child collection survivor lists + archive lists in one payload. This matches the `useUpsertEquipmentCategoryMutation` precedent and gives us atomic save behavior.

To build that payload, **all child state lives in the parent form** as controlled state — no `saveRef.current()` flush pattern, no per-tab buffered state hidden behind a ref. Each editor (Checklist, Material, Labor, Equipment, Forms, Field Defaults) is a **controlled component** that takes:

- `items: TRow[]` — current survivor rows
- `onItemsChange: (items: TRow[]) => void` — fires on add / edit / reorder
- `archivedIds: string[]` — ids the user removed in this session
- `onArchivedIdsChange: (ids: string[]) => void` — fires on row delete

…and renders the per-row UI. Editor internals (drag-reorder, dual-mode toggles, etc.) are still encapsulated; only the **state** is lifted.

The form holds six pairs of state + one `useForm` for the header:

```typescript
// Header — buffered with useForm validation

    {
        name: template?.name ?? "",
        description: template?.description ?? "",
        estimatedDuration: template?.estimatedDuration ?? null,
        isActive: template?.isActive ?? true
    },
    { name: { required: true, label: "Template Name" } }
);

// Each child collection: items + archive list
const [checklistItems, setChecklistItems] = useState<IChecklistDraft[]>(template?.ChecklistItems ?? []);
const [archivedChecklistIds, setArchivedChecklistIds] = useState<string[]>([]);

const [materialItems, setMaterialItems] = useState<IMaterialDraft[]>(template?.MaterialItems ?? []);
const [archivedMaterialIds, setArchivedMaterialIds] = useState<string[]>([]);

const [laborPlans, setLaborPlans] = useState<ILaborDraft[]>(template?.LaborPlans ?? []);
const [archivedLaborPlanIds, setArchivedLaborPlanIds] = useState<string[]>([]);

const [equipmentPlans, setEquipmentPlans] = useState<IEquipmentDraft[]>(template?.EquipmentPlans ?? []);
const [archivedEquipmentPlanIds, setArchivedEquipmentPlanIds] = useState<string[]>([]);

const [formWrappers, setFormWrappers] = useState<IFormWrapperDraft[]>(template?.FormWrappers ?? []);
const [archivedFormWrapperIds, setArchivedFormWrapperIds] = useState<string[]>([]);

const [fieldDefaults, setFieldDefaults] = useState<IFieldDefaultDraft[]>(template?.FieldDefaults ?? []);
const [archivedFieldDefaultIds, setArchivedFieldDefaultIds] = useState<string[]>([]);
```

When the existing-template GraphQL load resolves, each `useEffect` syncs the matching state from `template.<Collection>`. After that, the editors are the only mutators.

**Row ids:** rows loaded from the server keep their server id. Rows added in this session get a local placeholder id (`temp~<nanoid>`) so React keys are stable; the upsert mapper strips it (`row.id?.startsWith("temp~") ? null : row.id`) before sending.

**Why lift state up:** EquipmentCategory's onSubmit at lines 103-218 reads all the buffered state directly from React state (`attListValues`, `selectedFormWrappers`, `toDeleteSections`, `toDeleteFields`) to build the upsert variables. Templates do the exact same thing — only difference is six collections instead of two-ish.

### 4c. Create mode — all tabs are fully usable from the start

**No save-and-reopen gate.** Admins fill out everything (header + checklist + LEM defaults + forms + field defaults) in one sitting and click Save once. The single `upsertWorkOrderTemplate` mutation (Step 1.2) handles create-vs-edit branching server-side, so the form code is the same in both modes:

- In create mode, every row the user adds is in state with a `temp~<nanoid>` placeholder id. On Save, the upsert payload sends those rows with `id: null` and the server creates them against the just-created `workOrderTemplateId` — all in one transaction.
- In edit mode, rows loaded from the server keep their server id. Rows added in this session get `temp~<nanoid>` placeholders (same shape). On Save, the upsert payload includes survivors with the appropriate id + archive lists.

**No per-tab flush plumbing**, no `saveRef`, no banner gate. The Save click → one mutation call → done.

**Description-side TipTap inline assets** are the only minor wrinkle. `AdvancedTipTapEditor` accepts `referenceModel: "WorkOrderTemplate"` + `referenceId: templateId` for the asset-attachment path. In create mode, `referenceId` is undefined until the upsert returns — assets uploaded inline before Save can't attach properly. Two options:

- **A (recommended):** disable inline asset uploads on description in create mode; show a small "Save the template to attach inline images / files" hint inside the TipTap toolbar area. The user can still type rich text; only inline media is gated.
- **B:** allow the upload, buffer the asset locally, attach after the upsert returns the id. Requires `AdvancedTipTapEditor` to support a deferred attach mode — unclear if it does. Out of scope to validate; default to A.

The same `AdvancedTipTapEditor` usage on Checklist row descriptions and rich-text Field Defaults has the same trade-off; same recommendation applies.

### 4e. `onSubmit` — single `upsertWorkOrderTemplate` call

```typescript
const onSubmit = async () => {
    const errs = validateForm();
    if (errs && Object.keys(errs).length > 0) return;

    setIsSubmitting(true);

    // Strip temp ids — server treats null id as "create this row".
    const stripTempId = <T extends { id?: string }>(row: T): T =>
        row.id?.startsWith("temp~") ? { ...row, id: null } : row;

    try {
        const result = await upsertWorkOrderTemplate({
            variables: {
                data: {
                    // null id in create mode → server creates the template
                    id: templateId ?? null,
                    name: formValues.name,
                    description: formValues.description,
                    estimatedDuration: formValues.estimatedDuration,
                    isActive: formValues.isActive,

                    checklistItems: checklistItems.map(stripTempId),
                    materialItems:  materialItems.map(stripTempId),
                    laborPlans:     laborPlans.map(stripTempId),
                    equipmentPlans: equipmentPlans.map(stripTempId),
                    formWrappers:   formWrappers.map(stripTempId),
                    fieldDefaults:  fieldDefaults.map(stripTempId),

                    archivedChecklistItemIds:  archivedChecklistIds,
                    archivedMaterialItemIds:   archivedMaterialIds,
                    archivedLaborPlanIds:      archivedLaborPlanIds,
                    archivedEquipmentPlanIds:  archivedEquipmentPlanIds,
                    archivedFormWrapperIds:    archivedFormWrapperIds,
                    archivedFieldDefaultIds:   archivedFieldDefaultIds
                }
            }
        });

        notify.success(`Template ${templateId ? "saved" : "created"}.`);
        onSaved?.();
    } catch (err) {
        notify.error(`Failed to save template: ${(err as Error).message}`);
    } finally {
        setIsSubmitting(false);
    }
};
```

**One round-trip.** Header create-or-edit + every child collection survivor + every archive list, all in one mutation. The resolver (Step 1.2b) handles fan-out via `Promise.all` of BaseModel methods server-side. On the wire it's a single GraphQL request. The flyout closes when the success notification fires; the list page's Apollo cache updates automatically because the mutation returns the fully-resolved `WorkOrderTemplate`.

## Step 5: Checklist Editor — Fork the Outer, Reuse the Inner Row

**Files:**
- `apps/frontend/src/components/WorkOrder/Checklist/WorkOrderTemplateChecklistSection.tsx` (NEW)

### 5a. Fork the outer wrapper

Copy `WorkOrderChecklistSection.tsx` to `WorkOrderTemplateChecklistSection.tsx`. Replace these:

- Prop `jobId: string` → `templateId: string`
- Query `GET_WO_CHECKLIST_ITEMS(jobId)` → calls into `workOrderTemplate(id)` to read `ChecklistItems` (already in WO-15a's GraphQL surface), OR a dedicated `workOrderTemplateChecklistItems(workOrderTemplateId)` query if cleaner (WO-15a allows either; adding the dedicated query is a small line in WO-15a Step 6c if not already there)
- `createWorkOrderChecklistItem({ jobId, ... })` → `createWorkOrderTemplateChecklistItem({ workOrderTemplateId, ... })`

- `setWorkOrderChecklistItemDone` mutation — **removed entirely** in template mode (templates have no `isDone`, `completedByUserId`, `completedAt`)

### 5b. Strip the modes that don't apply

The original component has four modes: `settings`, `overview`, `form`, `form-readonly`. For templates, **only one mode is meaningful — settings.** Templates aren't filled out (no completion tracking), so there's no overview/form/form-readonly equivalent. Hardcode `mode = "settings"` inside `<WorkOrderTemplateChecklistSection>` and remove the prop. Also drop:

- `draftItems` / `onDraftItemsChange` (the form-mode buffer — not needed; template edits are direct mutations)
- `canTick` / `onTick` props on `<ChecklistItemRow>` — pass `canTick={false}` (or hide the tick UI entirely via a new `hideTickUI` prop on `<ChecklistItemRow>` if needed; tracked as a small WO-14 follow-up)

### 5c. Rich descriptions + photoRequired toggle unchanged

`<ChecklistItemRow>` renders the TipTap description editor + photoRequired toggle the same way regardless of parent type — the callbacks bubble up to whichever mutation the wrapper chose.

### 5d. Controlled-component contract — props the editor takes from the form

Per Step 4b the form lifts all child state into itself. `<WorkOrderTemplateChecklistSection>` is a **controlled component**:

```typescript
interface IWorkOrderTemplateChecklistSectionProps {
    items: IChecklistDraft[];
    onItemsChange: (items: IChecklistDraft[]) => void;
    archivedIds: string[];
    onArchivedIdsChange: (ids: string[]) => void;
}
```

The component:
- Renders the row list from `items`
- Mutates state through the two `on*Change` callbacks — adds (with `temp~<nanoid>` ids), edits, drag-reorders all go through `onItemsChange(newArray)`; deletes call `onArchivedIdsChange([...archivedIds, removedId])` and `onItemsChange(items.filter(...))`
- Holds NO server-side state, fires NO GraphQL mutations — the parent's `upsertWorkOrderTemplate` does that on Save

No `saveRef`, no internal buffer. The parent reads the state directly when building the upsert payload (§4e).

- The job-mode component has additional concerns (completion tracking, draft buffer for form mode) that don't belong in a template-mode call path
- Forking now + extracting a shared `<ChecklistEditor>` core in a 1.34 cleanup PR is the smaller, safer sequence

Tracked as a follow-up. If WO-14 merges before WO-15b implementation starts AND the implementer has appetite to refactor instead of fork, they can — but the plan as-written assumes fork.

## Step 8: Delete Confirmation — Use `ListTableViews`'s Native Flow

**No new component.** `ListTableViews` already renders a confirm-delete-with-impact-count modal when `canBeDeleted` + `getDeleteCount` + `getDeleteCountResultLabel` are passed — see Step 3c for the wiring. The interface is defined at `packages/ui/src/types/ListTable.types.ts:189-199`:

```typescript
/** Function to get the related delete count */
getDeleteCount?: (variables: { variables: { ids: string[] } }) => Promise<any>;
/** What is the label the delete count result lives under */
getDeleteCountResultLabel?: string;
```

Per CLAUDE.md "TableFeed Queries (Preferred for Data Fetching)" the count query goes through the Job feed (`GqlTableDataName.Job`) so it inherits Job-level permission scoping for free. The user only sees Jobs they have read access to in the count — same semantic as everywhere else in the codebase.

### 8a. Cascade reminder

When the user confirms a delete, `BaseModel.deleteItem` sets `isDeleted = true` on the template row. The cascade to children (`WorkOrderTemplateChecklistItem`, `WorkOrderTemplateMaterialItem`, `WorkOrderTemplateLaborPlan`, `WorkOrderTemplateEquipmentPlan`, `WorkOrderTemplateFormWrapper`, `WorkOrderTemplateFieldDefault`) runs via the model's `deleteChildren` hook — soft-delete, not Prisma `onDelete: Cascade` (which only fires on hard deletes). `Job.appliedWorkOrderTemplateId` SetNulls on referencing Jobs per WO-15a Step 2a. Implementation note: confirm `WorkOrderTemplateModel` overrides `deleteChildren` to soft-delete every child collection; if not, add the override as part of the WO-15a addendum.

### 8b. Why no archive impact modal

The WO-15b spec mockup 4 sketched an archive confirmation modal showing applied-WO count. The codebase convention for Settings entities is **delete-only impact** — archive fires immediately. Following the convention: archive's reversibility (Show Archived + restore) makes the confirmation redundant; the impact-aware confirm is reserved for the non-recoverable delete path. If product wants the archive modal back, it would require building a custom component (the `ListTableViews` props don't expose an archive-side equivalent).
