# WO-14: Simple Checklist on Work Orders — Implementation Plan

## Overview

Introduce a first-class procedural checklist on every Work Order (Job with `jobClassification = WorkOrder`). Items have a label + done checkbox + an optional rich description (stored as **markdown**, edited via the existing TipTap WYSIWYG — same pattern as Job description), with audit fields (`createdByUserId`, `completedByUserId`, `completedAt`) recorded server-side. An optional `photoRequired` flag gates ticking on attaching at least one photo via the existing polymorphic `AssetReference` table. A computed `% complete` is surfaced on the WO header. Five surfaces: Desktop Settings tab (full management), Desktop Overview tab (read / tick / quick-add / archive), Desktop Create/Edit form (drafts persist with form save; live ticks), Mobile WO Detail (read / tick / photo capture), Mobile WO Create/Edit form (read / tick). Templates that pre-populate items ship later with WO-15 — this spec keeps the data model open to it.

**Estimated effort:** 3-4 days
**Risk:** Medium-High — new model + child mutations on Job, photo capture flow, multiple surfaces (5), TipTap reuse, audit invariant requires per-tick atomicity
**Spec:** `tm-work-orders-uis/wo-14-checklist.html`
**Requires:** WO-1 (Job classification), WO-3 (DataModelForm WO foundation), WO-3d (WO Property Settings tab)
**Enables:** WO-15 (Templates pre-fill checklist items)

---

## Decided — Model anchor, photos via AssetReference, classification gate at API

**Naming.** The model is `WorkOrderChecklistItem` (not `JobChecklistItem`) per the spec: the feature is intentionally WO-only and the codebase should be honest about that. The FK is to `Job` because a WorkOrder is a Job; the WO scope is enforced both at the GraphQL resolver layer (every mutation rechecks `jobClassification`) and structurally via the DAA `subModel = 'WorkOrder'` rows from Step 2.5 — ProjectJob forms never render the checklist section.

**Photos.** Photos attach via the existing `AssetReference` polymorphic join table (`apps/api/prisma/schema.prisma:1132-1152`) with `referenceTable = "WorkOrderChecklistItem"`, `referenceId = checklistItem.id`. **No new FK column** on `WorkOrderChecklistItem`. Multiple photos per item are supported natively; no captions, no annotations (locked-down per spec — richer photo flows belong in Forms / WO-13).

**Ticks always live.** `setWorkOrderChecklistItemDone` fires on every surface, including from inside the WO Create/Edit form. The audit invariant requires "completed at" to be the wall-clock moment of the tick — never a later form save. The form-save embed only handles drafts (item upserts + archives), never ticks.

**Form-save embed is upsert-based, not full-replace.** Quick-add and archive on the desktop Create/Edit form are batched into the `createJob` / `editJob` payload; ticks happening concurrently in another tab or on mobile are conflict-free because the form path never writes `isDone` / `completedByUserId` / `completedAt`.

**Archive guard for ticked items.** Ticked items cannot be archived from any surface — the API rejects the call with a clear error, and the UI hides/disables the control. To remove a ticked item the user must first untick it (which clears the audit fields AND deletes attached photos), then archive.

**Description is stored as markdown**, matching the project convention (Job description, Company description, RFI description — all use `defaultAttributeType = 'wysiwyg'` and round-trip markdown through TipTap via the `markdownValue` prop on `AdvancedTipTapEditor`). The frontend converts to HTML at render time using the existing `markdown2HTML` / `htmlToMarkdown` helpers in `@useanzen/shared-utils`. **No server-side HTML sanitization step** — markdown storage sidesteps the XSS surface that arbitrary HTML would create.

## Step 1: Prisma Schema — WorkOrderChecklistItem Model

**File:** `apps/api/prisma/schema.prisma`

Mirrors the shape of `WorkOrderLaborItem` / `WorkOrderMaterialItem` / `WorkOrderEquipmentItem` (line item children of Job) — same id format, same audit flags, `orderNo` for ordering, `onDelete: Cascade` to Job. Two `User` relations track who created the item and who ticked it; both use `onDelete: SetNull` so user deletion does not cascade-delete checklist history.

```prisma
model WorkOrderChecklistItem {
    id          String   @id @db.VarChar(21)
    isDeleted   Boolean  @default(false)
    isArchived  Boolean  @default(false)
    createdAt   DateTime @default(now())
    updatedAt   DateTime @default(now()) @updatedAt

    jobId String @db.VarChar(21)
    Job   Job    @relation("WorkOrderChecklistItems", fields: [jobId], references: [id], onDelete: Cascade)

    label       String  @db.VarChar(500)
    description String? @db.Text                // markdown (round-tripped via TipTap); null when no rich body
    orderNo     Int     @default(0)

    createdByUserId String? @db.VarChar(21)
    CreatedByUser   User?   @relation("WorkOrderChecklistItemsCreated",
                                       fields: [createdByUserId],
                                       references: [id],
                                       onDelete: SetNull)

    isDone            Boolean   @default(false)
    completedByUserId String?   @db.VarChar(21)
    CompletedByUser   User?     @relation("WorkOrderChecklistItemsCompleted",
                                           fields: [completedByUserId],
                                           references: [id],
                                           onDelete: SetNull)
    completedAt       DateTime?

    photoRequired Boolean @default(false)

    @@index([jobId, isDeleted, isArchived, orderNo], map: "WOChecklistItem_job_order_idx")
    @@index([createdByUserId], map: "WOChecklistItem_createdBy_idx")
    @@index([completedByUserId], map: "WOChecklistItem_completedBy_idx")
}
```

Add inverse relations on existing models:

```prisma
// On Job (alongside WorkOrderLaborItems / WorkOrderMaterialItems / WorkOrderEquipmentItems):
WorkOrderChecklistItems WorkOrderChecklistItem[] @relation("WorkOrderChecklistItems")

// On User (alongside existing reverse relations):
WorkOrderChecklistItemsCreated   WorkOrderChecklistItem[] @relation("WorkOrderChecklistItemsCreated")
WorkOrderChecklistItemsCompleted WorkOrderChecklistItem[] @relation("WorkOrderChecklistItemsCompleted")
```

**No FK to Asset.** Photos are joined via the existing polymorphic `AssetReference` table — no schema change for the photo relationship.

## Step 2.5: Migration — DAA + DocumentModelForm Seeding (`wo-checklist` slug)

**Same migration file as Step 2.** The checklist is not a DAA-driven scalar field — it's a *custom slot render* (same pattern as `wo-labor-items` / `wo-material-items` / `wo-equipment-items` in `JobDataModelForm.tsx:1189-1231`). A DAA row with a known slug is what tells the form engine to look up `customFormControl["wo-checklist"]` (on `DataModelForm`, the editable surface) or `customColumnRender["wo-checklist"]` (on `DataModelDetails`, the read-only Overview surface) and render the section component there. The DAA is seeded `subModel = 'WorkOrder'` so it appears only on WorkOrder forms.

Mirrors the pattern in `apps/api/prisma/migrations/20260409100000_work_order_daa_setup/migration.sql` (DAAs for the WO subModel) and `apps/api/prisma/migrations/20260416000001_rfi_email_tweaks/migration.sql` (wiring DAAs into CREATE / EDIT / SETTINGS DocumentModelForms).

### 2.5a. Find (do not create) the relevant WorkOrder DocumentSection

Use the existing "Work Order Info" section — or create a new dedicated "Checklist" section if Product wants the checklist rendered as its own visually distinct section header. Either works; the default below uses a dedicated `Checklist` section since the spec mockups show it as a top-level section with its own header and helper text.

```sql

`orderNo: 90` places the section near the bottom of the WO form (after Labor / Materials / Equipment / Forms but before Signatures) per the spec mockups; adjust against the actual sibling orderNos shipped by WO-3a.

### 2.5b. Insert the DAA — WorkOrder only

```sql
SET @woChecklistDaaId = LEFT(MD5(UUID()), 21);

INSERT INTO DocumentAttributeAssignment (
    id, createdAt, updatedAt,
    referenceModel, subModel,
    sectionId, orderNo, mobileSectionId, mobileOrderNo,
    defaultAttribute, defaultAttributeLabel, defaultAttributeType,
    defaultAttributeIsRequired, defaultAttributeIsDerived,
    slug, referenceColumn,

    @workOrderChecklistSectionId, 10, @workOrderChecklistSectionId, 10,
    'wo-checklist-items', 'Checklist', 'objects',
    FALSE, FALSE,
    'wo-checklist', 'wo-checklist-items',
    FALSE, FALSE

```

Key points:
- `subModel = 'WorkOrder'` — structural guarantee this row can never render on a ProjectJob form.
- `slug = 'wo-checklist'` — the key the frontend looks up in `customFormControl` (forms) / `customColumnRender` (Overview details), matching the `wo-labor-items` / `wo-material-items` / `wo-equipment-items` convention.
- `defaultAttribute = 'wo-checklist-items'` and `referenceColumn = 'wo-checklist-items'` — matches the slug convention used by `wo-labor-items` / `wo-material-items` / `wo-equipment-items` in `20260409100000_work_order_daa_setup/migration.sql`. The top-level GraphQL query is `workOrderChecklistItems(jobId, includeArchived)` (Step 5) — mirrors the sibling line-item queries.
- `defaultAttributeType = 'objects'` — matches the existing WO custom-slot DAAs (`wo-labor-items` / `wo-material-items` / `wo-equipment-items`); the form engine's default `objects` renderer is never reached because `customFormControl["wo-checklist"]` / `customColumnRender["wo-checklist"]` overrides it.
- `defaultAttributeIsRequired = FALSE` / `defaultAttributeIsDerived = FALSE` — items are user-managed; a WO with zero items is valid.

## Step 4: WorkOrderChecklistItem Model Class

**Create file:** `apps/api/src/models/WorkOrderChecklistItem.ts`

Extends **`BaseAuditableModel`** (not `BaseModel`) so every write — including ticks — generates an `AuditLog` row automatically. Matches the pattern used by `Holiday`, `ProgressReport`, `Department`, `Project`, etc.

The model enforces one invariant:

- **Archive guard** — `beforeEdit` rejects `isArchived = true` when the existing row has `isDone = true`.

**Audit-field protection is enforced at the GraphQL input shape, not at the model layer.** The `editWorkOrderChecklistItem` mutation's input does not declare `isDone` / `completedByUserId` / `completedAt` / `createdByUserId` (Step 5), so clients cannot submit them. The only mutation that writes those fields is `setWorkOrderChecklistItemDone`, which sets them server-side from auth context and routes through `this.editItem(...)` — clean, audited, no Prisma-direct bypass.

The `description` column stores **markdown** — no server-side HTML sanitization is needed (markdown storage sidesteps the XSS surface, matching the Job/Company/RFI description pattern in the codebase).

```typescript
protected modelFields: IField<IWorkOrderChecklistItem>[] = [
    {
        name: "jobId",
        type: "string",
        options: { isRequiredOnCreate: true, isFilterable: true, canEdit: false }
    },
    {
        name: "label",
        type: "string",
        options: { isRequiredOnCreate: true, canEdit: true, validate: (v) => !!v && v.length <= 500 }
    },
    { name: "description",       type: "string",  options: { canEdit: true } },
    { name: "orderNo",           type: "number",  options: { canEdit: true, isSortable: true } },
    { name: "createdByUserId",   type: "string",  options: { canEdit: true } }, // server-set; resolver never accepts from client
    { name: "isDone",            type: "boolean", options: { canEdit: true } }, // server-set via setItemDone / clearItemDone
    { name: "completedByUserId", type: "string",  options: { canEdit: true } }, // server-set via setItemDone / clearItemDone
    { name: "completedAt",       type: "date",    options: { canEdit: true } }, // server-set via setItemDone / clearItemDone
    { name: "photoRequired",     type: "boolean", options: { canEdit: true } }
];

protected async beforeCreate(data, currentUserId) {
    if (data.createdByUserId == null) data.createdByUserId = currentUserId;
    if (data.orderNo == null) {
        const max = await prisma.workOrderChecklistItem.aggregate({
            where: { jobId: data.jobId, isDeleted: false },
            _max: { orderNo: true }
        });
        data.orderNo = (max._max.orderNo ?? -1) + 1;
    }
    return data;
}

protected async beforeEdit(id, data, currentUserId) {
    if (data.isArchived === true) {
        const existing = await this.getItem(id, currentUserId);
        if (existing?.isDone) {
            throw new Error("Cannot archive a ticked checklist item. Untick it first.");
        }
    }
    return data;
}
```

`setItemDone` / `clearItemDone` are dedicated helper methods on the model class, called from the `setWorkOrderChecklistItemDone` resolver (Step 5). Both route through `this.editItem(...)` so the audit log captures the tick / untick automatically via `BaseAuditableModel`:

```typescript
async setItemDone(id: string, photoAssetIds: string[], currentUserId: string) {
    const item = await this.getItem(id, currentUserId);
    if (!item) throw new Error("Checklist item not found");
    if (item.photoRequired && photoAssetIds.length === 0) {
        throw new Error("This item requires at least one photo to be ticked");
    }

    // Audited via BaseAuditableModel — the AuditLog row records the field-level
    // diff (isDone false→true, completedByUserId/At set) with currentUserId as actor.
    await this.editItem(
        id,
        {
            isDone: true,
            completedByUserId: currentUserId,
            completedAt: new Date()
        },
        currentUserId
    );

    // Attach photos via AssetReference (Step 8). AssetReference has no dedicated
    // model class — direct Prisma is the existing house pattern for this table.
    for (const assetId of photoAssetIds) {
        await prisma.assetReference.create({
            data: {
                assetId,
                referenceTable: "WorkOrderChecklistItem",
                referenceId: id
            }
        });
    }
    return this.getItem(id, currentUserId);
}

async clearItemDone(id: string, currentUserId: string) {
    // Audited via BaseAuditableModel — captures isDone true→false and the audit-field clears.
    await this.editItem(
        id,
        { isDone: false, completedByUserId: null, completedAt: null },
        currentUserId
    );

    // Untick clears photo references — the audit invariant requires that the photos
    // captured at tick time disappear when the tick is undone.
    await prisma.assetReference.deleteMany({
        where: { referenceTable: "WorkOrderChecklistItem", referenceId: id }
    });
    return this.getItem(id, currentUserId);
}
```

**Every change to a checklist item is audited.** Because the model extends `BaseAuditableModel` and every mutation in Step 5 (create / edit / setDone / reorder / archive / restore) routes through `this.createItem(...)` or `this.editItem(...)`, every field-level change generates an `AuditLog` row with the actor, timestamp, and field-level before/after diff. That covers:

| Change | Audited via |
|---|---|
| Item created | `createItem` (initial AuditLog) |
| Label edited | `editItem` (label diff) |
| Description edited (markdown) | `editItem` (description diff — answers "did someone change the instructions for step 3 after the tech ticked it?") |
| Reordered (orderNo) | `editItem` (orderNo diff, once per moved item) |
| `photoRequired` toggled | `editItem` (photoRequired diff) |
| Archived / restored | `editItem` (isArchived diff) |
| Ticked | `editItem` via `setItemDone` (isDone + completedByUserId + completedAt diff) |
| Unticked | `editItem` via `clearItemDone` (isDone + completedByUserId + completedAt diff) |

**About the `canEdit: true` flips on audit fields:** those are necessary so `editItem` will accept the writes from `setItemDone` / `clearItemDone` (a `canEdit: false` field would be silently stripped). Audit-field protection against client tampering is not enforced at the model field-options layer — it's enforced at the GraphQL input boundary: the `editWorkOrderChecklistItem` mutation input (Step 5) simply does not declare `isDone` / `completedByUserId` / `completedAt` / `createdByUserId`, so a client cannot submit `{ id, isDone: true }` through it; the only mutation that writes those fields is `setWorkOrderChecklistItemDone`, which sources them from server-side state (`currentUserId` from auth context, `new Date()` for the timestamp). The model layer's job is uniform audit logging; the resolver layer's job is shape validation.

## Step 5: WorkOrderChecklistItem GraphQL Resolver

**Create file:** `apps/api/src/graphql/models/WorkOrderChecklistItem.ts`

Type, two top-level queries, and seven mutations: `create`, `edit`, `setDone`, `reorder`, `archive`, `restore`, plus the cross-cutting `upsertWorkOrderChecklistItems` used by the desktop form's two-phase save. The top-level query shape and the upsert mutation mirror the existing line-item pattern (`workOrderLaborItems` / `workOrderMaterialItems` / `workOrderEquipmentItems` + `upsertWorkOrderLineItems` in `apps/api/src/graphql/models/WorkOrderLineItems.ts`). All mutations recheck `jobClassification === "WorkOrder"` on the parent Job before proceeding.

```graphql
type WorkOrderChecklistItem {
    id: ID!
    jobId: String!
    Job: Job
    label: String!
    description: String
    orderNo: Int!
    createdByUserId: String
    CreatedByUser: User
    isDone: Boolean!
    completedByUserId: String
    CompletedByUser: User
    completedAt: DateTime
    photoRequired: Boolean!
    completionPhotos: [Asset!]!
    isArchived: Boolean!
    createdAt: DateTime!
    updatedAt: DateTime!
}

type WorkOrderChecklistProgress {
    doneCount: Int!
    totalCount: Int!
    percentComplete: Int  # null when totalCount = 0; otherwise 0..100
}

extend type Query {
    # Top-level query — mirrors workOrderLaborItems(jobId: String!), etc.
    workOrderChecklistItems(
        jobId: String!,
        includeArchived: Boolean = false
    ): [WorkOrderChecklistItem!]!

    # Top-level progress aggregate — read independently from the items list so
    # the WO header can fetch progress without hydrating the full item set.
    workOrderChecklistProgress(jobId: String!): WorkOrderChecklistProgress
}

input UpsertWorkOrderChecklistItemInput {
    id: String           # present = update existing; absent = create new
    label: String!
    description: String
    orderNo: Int
    photoRequired: Boolean
}

input UpsertWorkOrderChecklistItemsInput {
    jobId: String!
    items: [UpsertWorkOrderChecklistItemInput!]!
    archiveIds: [String!]
}

extend type Mutation {
    createWorkOrderChecklistItem(
        jobId: ID!,
        label: String!,
        description: String,
        orderNo: Int,
        photoRequired: Boolean
    ): WorkOrderChecklistItem!

    editWorkOrderChecklistItem(
        id: ID!,
        label: String,
        description: String,
        orderNo: Int,
        photoRequired: Boolean
    ): WorkOrderChecklistItem!

    setWorkOrderChecklistItemDone(
        id: ID!,
        isDone: Boolean!,
        photoAssetIds: [String!]
    ): WorkOrderChecklistItem!

    reorderWorkOrderChecklistItems(
        jobId: ID!,
        orderedIds: [String!]!
    ): [WorkOrderChecklistItem!]!

    archiveWorkOrderChecklistItem(id: ID!): WorkOrderChecklistItem!
    restoreWorkOrderChecklistItem(id: ID!): WorkOrderChecklistItem!

    # Cross-cutting upsert used by the desktop form's two-phase save (Step 11a):
    # accepts the full editable item set + an archive list, loops through
    # createItem / editItem on the model. Mirrors upsertWorkOrderLineItems.
    # NEVER writes isDone / completedByUserId / completedAt — ticks remain
    # exclusively on setWorkOrderChecklistItemDone (live, audited per tick).
    upsertWorkOrderChecklistItems(input: UpsertWorkOrderChecklistItemsInput!): Boolean!
}

Resolver bodies follow the project's "thin resolver, fat model" rule (CLAUDE.md §3) — delegate to the `WorkOrderChecklistItemModel` for everything non-trivial.

```typescript
// Helper used by every mutation that takes (or implies) a job context.
async function assertWorkOrderClassification(jobId: string) {
    const job = await prisma.job.findUnique({
        where: { id: jobId },
        select: { jobTypeId: true }
    });
    if (!job?.jobTypeId) throw new Error("Job not found or missing jobType");
    const pv = await prisma.propertyValue.findUnique({
        where: { id: job.jobTypeId },
        select: { jobClassification: true }
    });
    if (pv?.jobClassification !== "WorkOrder") {
        throw new Error("Checklist is only available on Work Orders");
    }
}

Resolvers: {
    Job: (parent) => prisma.job.findUnique({ where: { id: parent.jobId } }),
    CreatedByUser: (parent) =>
        parent.createdByUserId
            ? prisma.user.findUnique({ where: { id: parent.createdByUserId } })
            : null,
    CompletedByUser: (parent) =>
        parent.completedByUserId
            ? prisma.user.findUnique({ where: { id: parent.completedByUserId } })
            : null,
    completionPhotos: async (parent) => {
        const refs = await prisma.assetReference.findMany({
            where: {
                referenceTable: "WorkOrderChecklistItem",
                referenceId: parent.id
            },
            select: { assetId: true }
        });
        if (refs.length === 0) return [];
        return prisma.asset.findMany({
            where: { id: { in: refs.map((r) => r.assetId) }, isDeleted: false },
            orderBy: { createdAt: "asc" }
        });
    }
},
Mutation: {
    createWorkOrderChecklistItem: async (_, args, ctx) => {
        await assertWorkOrderClassification(args.jobId);
        return new WorkOrderChecklistItemModel().createItem(args, ctx.userId());
    },
    editWorkOrderChecklistItem: async (_, { id, ...rest }, ctx) => {
        const existing = await prisma.workOrderChecklistItem.findUnique({ where: { id } });
        if (!existing) throw new Error("Item not found");
        await assertWorkOrderClassification(existing.jobId);
        return new WorkOrderChecklistItemModel().editItem(id, rest, ctx.userId());
    },
    setWorkOrderChecklistItemDone: async (_, { id, isDone, photoAssetIds }, ctx) => {
        const existing = await prisma.workOrderChecklistItem.findUnique({ where: { id } });
        if (!existing) throw new Error("Item not found");
        await assertWorkOrderClassification(existing.jobId);
        const model = new WorkOrderChecklistItemModel();
        return isDone
            ? model.setItemDone(id, photoAssetIds ?? [], ctx.userId())
            : model.clearItemDone(id, ctx.userId());
    },
    reorderWorkOrderChecklistItems: async (_, { jobId, orderedIds }, ctx) => {
        await assertWorkOrderClassification(jobId);
        const model = new WorkOrderChecklistItemModel();
        for (let i = 0; i < orderedIds.length; i++) {
            await model.editItem(orderedIds[i], { orderNo: i }, ctx.userId());
        }
        return model.getList(
            { where: { jobId, isDeleted: false, isArchived: false } },
            ctx.userId()
        ).then((r) => r.list);
    },
    archiveWorkOrderChecklistItem: async (_, { id }, ctx) => {
        const existing = await prisma.workOrderChecklistItem.findUnique({ where: { id } });
        if (!existing) throw new Error("Item not found");
        await assertWorkOrderClassification(existing.jobId);
        // beforeEdit (Step 4) enforces the "cannot archive ticked" guard.
        return new WorkOrderChecklistItemModel().editItem(id, { isArchived: true }, ctx.userId());
    },
    restoreWorkOrderChecklistItem: async (_, { id }, ctx) => {
        const existing = await prisma.workOrderChecklistItem.findUnique({ where: { id } });
        if (!existing) throw new Error("Item not found");
        await assertWorkOrderClassification(existing.jobId);
        return new WorkOrderChecklistItemModel().editItem(id, { isArchived: false }, ctx.userId());
    },
    upsertWorkOrderChecklistItems: async (_, { input }, ctx) => {
        const { jobId, items, archiveIds } = input;
        await assertWorkOrderClassification(jobId);
        const model = new WorkOrderChecklistItemModel();
        const userId = ctx.userId();

        // Upsert each submitted item. Per-row beforeCreate handles default
        // orderNo + server-set createdByUserId; beforeEdit enforces the
        // ticked-archive guard (none of these calls write isArchived).
        // Tick state (isDone / completedByUserId / completedAt) is NEVER
        // touched here — it stays on setWorkOrderChecklistItemDone, live.
        for (const item of items) {
            const fields = {
                label: item.label,
                description: item.description ?? null,
                orderNo: item.orderNo,
                photoRequired: item.photoRequired ?? false
            };
            if (item.id) {
                await model.editItem(item.id, fields, userId);
            } else {
                await model.createItem({ ...fields, jobId }, userId);
            }
        }

        // Archive sweep. Each editItem({ isArchived: true }) routes through
        // beforeEdit, which rejects archive of ticked items.
        for (const id of archiveIds ?? []) {
            await model.editItem(id, { isArchived: true }, userId);
        }

        return true;
    }
}

Query: {
    workOrderChecklistItems: async (_, { jobId, includeArchived }, ctx) => {
        await assertWorkOrderClassification(jobId);
        const result = await new WorkOrderChecklistItemModel().getList(
            {
                where: {
                    jobId,
                    isDeleted: false,
                    ...(includeArchived ? {} : { isArchived: false })
                },
                orderBy: [{ column: "orderNo", direction: "asc" }]
            },
            ctx.userId()
        );
        return result.list ?? [];
    },
    workOrderChecklistProgress: async (_, { jobId }, ctx) => {
        await assertWorkOrderClassification(jobId);
        const result = await new WorkOrderChecklistItemModel().getList(
            { where: { jobId, isDeleted: false, isArchived: false } },
            ctx.userId()
        );
        const items = result.list ?? [];
        const totalCount = items.length;
        const doneCount = items.filter((i) => i.isDone).length;
        const percentComplete =
            totalCount === 0 ? null : Math.round((doneCount / totalCount) * 100);
        return { doneCount, totalCount, percentComplete };
    }
}
```

## Step 8: AssetReference Photo Wiring

**No new file.** Photos are joined via the existing `AssetReference` table (`prisma/schema.prisma:1132-1152`) with `referenceTable = "WorkOrderChecklistItem"`, `referenceId = checklistItem.id`. The lifecycle is owned by the resolver / model:

| Action | Effect on AssetReference |
|---|---|
| Tick (photoRequired item, photoAssetIds = [a, b]) | Inserts two rows: `(a, "WorkOrderChecklistItem", item.id)` and `(b, "WorkOrderChecklistItem", item.id)` |
| Untick | `deleteMany` by `referenceTable + referenceId` |
| Archive a previously-ticked-then-unticked item | No additional AssetReference work — references were already cleared on untick |
| Hard-delete the WO row (`onDelete: Cascade`) | Checklist items cascade-delete; AssetReference rows are orphaned by `referenceId` and cleaned up by the standard `AssetReference` housekeeping job. No app-layer action required. |

The `completionPhotos` field on the GraphQL type (Step 5) is resolved by the `assetReference.findMany` → `asset.findMany` two-step shown in the resolver block. For volumes large enough to matter, batch this with DataLoader at the resolver layer if N+1 surfaces during testing — but the per-WO photo count is small (handful per item, dozens per WO) so the naive resolver is acceptable for V1.

**Asset upload** itself uses the existing Asset upload flow — frontend creates the Asset row via the existing upload pipeline (`packages/server-side-utils` / `apps/api/src/graphql/models/Asset.ts`), receives the asset id back, then passes it in `photoAssetIds` to `setWorkOrderChecklistItemDone`. No new upload pathway is introduced.

## Step 10: Frontend — WorkOrderChecklistSection Component (Desktop)

**Create file:** `apps/frontend/src/components/WorkOrder/Checklist/WorkOrderChecklistSection.tsx`

One component, three rendering modes via a `mode` prop. Mirrors the architectural pattern of `WOLaborEditor` / `WOMaterialEditor` / `WOEquipmentEditor` — same `customFormControl` slot in the form, but with mode-specific UI affordances. State for `mode="form"` is held in the parent (`JobDataModelForm.tsx`) and serialized into `upsertWorkOrderChecklistItems` by the parent's `saveChecklist` callback during the two-phase save (Step 11a) — same way `WOLaborEditor` / `WOMaterialEditor` / `WOEquipmentEditor` flow.

```typescript
interface IWorkOrderChecklistSectionProps {
    jobId: string;
    mode: "settings" | "overview" | "form";
    // form-mode only: drafts owned by the parent form's useState, serialized
    // by saveChecklist on form save (mirrors WOLaborEditor / WOMaterialEditor / etc.)
    draftItems?: IWorkOrderChecklistItemDraft[];
    onDraftItemsChange?: (drafts: IWorkOrderChecklistItemDraft[]) => void;
    archivedDraftIds?: string[];
    onArchivedDraftIdsChange?: (ids: string[]) => void;
    disabled?: boolean;

**Mode behavior matrix** (matches the spec placement table):

| Mode | Read | Tick | Quick-add | Rich edit / reorder | Archive (unticked) | Restore |
|---|---|---|---|---|---|---|
| `settings` | ✓ | live | live | live | live | ✓ |
| `overview` | ✓ | live | live | hidden (link to Settings) | live | hidden |
| `form` | ✓ | live | drafted | hidden | drafted | hidden |

**Live operations** call the GraphQL mutations from Step 5 directly via Apollo hooks (`useCreateWorkOrderChecklistItemMutation`, `useSetWorkOrderChecklistItemDoneMutation`, etc.) and refetch `workOrderChecklistItems(jobId)` on success.

**Drafted operations** (form mode only) buffer in the parent form's `useState` via `draftItems` / `archivedDraftIds`. New items get a `nanoid()` client-id and a visible "UNSAVED" badge; archives push to `archivedDraftIds`. On form save, the parent's `saveChecklist(jobId)` helper serializes both lists into the `upsertWorkOrderChecklistItems` mutation (Step 5) — same two-phase pattern as `saveLineItems` for labor / material / equipment.

**Ticks are always live**, including in `mode="form"`. The component fires `setWorkOrderChecklistItemDone` directly; on success, it patches its local `data` cache so the row reflects "done" immediately. The form save never carries tick state.

**Rich description editing** uses the existing `AdvancedTipTapEditor` from `@useanzen/ui` (`packages/ui/src/components/WYSIWYG/AdvancedTipTap.tsx`) wired via the `markdownValue` prop — same configuration as the Job description editor. The editor round-trips through `markdown2HTML` / `htmlToMarkdown` (`@useanzen/shared-utils`); the value persisted to the API is markdown text. Visible in `mode="settings"` only; collapsed read-only in `overview` and `form` modes (toggle to expand). Read-only render uses the existing `<Markdown />` component from `@useanzen/ui`.

**Drag-and-drop reorder** (settings mode only) uses the project's existing drag-handle pattern (consult `packages/ui` for the shipped `Draggable` / `useReorder` primitive; if none exists, `@hello-pangea/dnd` is acceptable). On drop, fires `reorderWorkOrderChecklistItems` with the new ID order.

**Archive control**: hidden when the row has `isDone === true`; disabled with a tooltip on `mode="settings"` so the user understands the constraint. The API enforces the same rule (Step 4 `beforeEdit` guard) — the UI is purely an affordance.

**Photo capture + display use the existing `AssetViewer` component** (`apps/frontend/src/components/AssetViewer/AssetViewer.tsx` on desktop; `apps/mobile/src/components/AssetsViewer/AssetViewer.tsx` on mobile) — same component that powers the Note + Comment attachment flow (`apps/mobile/src/components/Note.tsx:386-401`, `apps/mobile/src/components/Forms/NoteAddEditForm/CommentAddEditForm.tsx:240-264`). No custom strip or lightbox component is built — `AssetViewer` already renders the thumbnail grid, opens its own lightbox/preview, handles uploads, handles deletes, and lets the parent trigger the file picker via a ref.

**Display** (ticked photoRequired items, any surface):
```tsx
<AssetViewer
    type="document"
    referenceTable="WorkOrderChecklistItem"
    initialAssets={item.completionPhotos.map((a) => ({ assetId: a.id }))}
    fixedGridSize={3}
    viewOnly
    hideMessageIfNoAsset
    hideLabel
    key={item.completionPhotos.length}

```

**Capture** (untracked-but-photoRequired item, tap-to-tick flow):
```tsx
const assetsRef = useRef(null);
const [uploadedAssetIds, setUploadedAssetIds] = useState<string[]>([]);

// Tap on the checkbox of an unticked photoRequired item:
const handleCheck = () => {
    if (item.photoRequired && !item.isDone) {
        assetsRef.current?.browseFiles(); // opens file picker / mobile camera
        return;
    }
    setWorkOrderChecklistItemDone({ variables: { id: item.id, isDone: true } });
};

<AssetViewer
    ref={assetsRef}
    type="document"
    externalRequest
    referenceTable="WorkOrderChecklistItem"
    onAllSettled={(uploaded) => {
        // Fire the tick with the freshly-uploaded asset ids; resolver creates
        // the AssetReference rows on the server side.
        setWorkOrderChecklistItemDone({
            variables: { id: item.id, isDone: true, photoAssetIds: uploaded }
        });
        setUploadedAssetIds(uploaded);
    }}
    hideUploadInterface  // the file picker is triggered via the ref, not via a visible upload UI
/>
```

The flow:
1. User taps the checkbox on an unticked, `photoRequired` item.
2. Component calls `assetsRef.current?.browseFiles()`, which `AssetViewer` opens — file picker on desktop, camera on mobile (mobile `AssetViewer` already passes `capture="environment"` for image inputs).
3. User selects/captures one or more photos; `AssetViewer` uploads each as an Asset.
4. `AssetViewer` fires `onAllSettled` with the uploaded asset ids.
5. Parent calls `setWorkOrderChecklistItemDone({ id, isDone: true, photoAssetIds: [...] })`.
6. Resolver creates `AssetReference` rows (Step 8) and marks the item done.

Render the camera glyph (`📷` or an `@useanzen/ui` icon if one fits) next to unticked photoRequired items as a visual hint — but the glyph is purely informational; the click target is the checkbox itself.

**Note on AssetReference creation:** in the Note flow, `AssetViewer` doesn't create AssetReference rows directly — the parent mutation (`createNote` / `editNote`) takes `assetIds` and the resolver creates the references. We follow the same pattern: `setWorkOrderChecklistItemDone` is the mutation that creates the AssetReference rows. `AssetViewer` only handles the upload → Asset row + returns the ids.

const saveChecklist = useCallback(
    async (jobId: string) => {
        const items = checklistDrafts.map((d, idx) => ({
            id: d.id?.startsWith("draft_") ? null : d.id,  // strip client-only nanoid prefix
            label: d.label,
            description: d.description ?? null,
            orderNo: d.orderNo ?? idx,
            photoRequired: d.photoRequired ?? false
        }));
        const result = await upsertWorkOrderChecklistItems({
            variables: { input: { jobId, items, archiveIds: archivedChecklistIds } }
        });
        if (result.errors?.length) {
            throw new Error(result.errors.map((e) => e.message).join("; "));
        }
    },
    [checklistDrafts, archivedChecklistIds, upsertWorkOrderChecklistItems]
);

### 12d. Mobile photo capture flow — uses `AssetViewer`

The tick handler on photoRequired items calls `assetViewerRef.current?.browseFiles()` on the mobile `AssetViewer` instance — on iOS Safari and Android Chrome this triggers the camera with a "take more" option in-flow (the mobile `AssetViewer` already passes `capture="environment"` for image inputs). `AssetViewer` uploads each captured photo as an Asset, then fires `onAllSettled` with the uploaded asset ids. The parent then calls `setWorkOrderChecklistItemDone` with `photoAssetIds`. If any upload fails, `AssetViewer` surfaces the error and `onAllSettled` is not called — the tick remains uncommitted and the user can retry.

## Step 13: Frontend Validation Rules

**Files:** the two checklist section components (desktop + mobile)

Client-side guards mirror the API:

- The Archive button is hidden when `item.isDone === true`. On the Settings tab it is rendered disabled with a tooltip ("Cannot archive ticked items — untick first").
- Tapping the checkbox on a `photoRequired` item launches the photo flow (file picker / camera) instead of firing `setWorkOrderChecklistItemDone` directly with empty `photoAssetIds`.
- In form mode, quick-add items are appended to the parent's `checklistDrafts` (Step 11a) with a client-id (`draft_<nanoid>`) and a visible "UNSAVED" badge (matches spec Mockup 3). The client-id prefix is stripped before submitting to `upsertWorkOrderChecklistItems`.
- Cancelling the Create/Edit form discards `checklistDrafts` and `archivedChecklistIds` along with the rest of the form's parent state — `useState` resets when the form unmounts. Live ticks committed while drafting remain (they were never part of the draft).
