# WO-15a: Work Order Templates · Schema &amp; Load Engine — Implementation Plan

## Overview

Backend foundation for Work Order Templates: seven new Prisma models that capture template content (top-level template + six child collections — checklist, materials, labor plans, equipment plans, forms, field defaults), an audit FK on `Job`, the `previewWorkOrderTemplate` snapshot resolver, and a `createJob` extension that applies a template's content to a brand-new Job in a single transaction. **No UI in this spec** — settings UI lives in WO-15b, apply UI in WO-15c.

The big alignment point is **WO-14** (PR #7155 — `task/Q21030-11700/work-order-checklist`, target `Release-v1.33.0`, still OPEN). `WorkOrderChecklistItem` (added by 7155) is the model the template mirrors. We match its shape exactly: same column names + types, same `description` `@db.Text`, same `photoRequired Boolean @default(false)`, same sanitization story (the `description` field uses `type: "wysiwyg"` in `modelFields`, which the BaseModel framework sanitizes via its built-in WYSIWYG handling — **no custom sanitize helper exists** to "reuse" per se; we follow the same `type: "wysiwyg"` declaration). Frontend-side reuse is bigger: WO-15b's checklist tab will mount the existing `<WorkOrderChecklistSection>` from `apps/frontend/src/components/WorkOrder/Checklist/WorkOrderChecklistSection.tsx` in a new "template" mode — that piece is in the WO-15b plan, but this spec is what makes it possible by keeping the mirror schema aligned.

**Estimated effort:** 5-6 days (matches spec estimate)
**Risk:** High — seven new tables in one migration, transactional createJob extension, audit FK touches every WO going forward. Most of the surface is additive (no existing rows mutated), but the `createJob` extension is the load-bearing piece every WO-15c apply will route through.
**Spec:** `tm-work-orders-uis/wo-15a-template-foundation.html`
**Requires:** WO-1 (job classification, already merged), **WO-13** (`JobSafetyFormWrapper` join — already in QA, ships before WO-15a lands), **WO-14** (`WorkOrderChecklistItem` from PR #7155 — must merge to Release-v1.33.0 before this plan can be implemented)
**Soft-requires:** **WO-16** (Schedule tab + EquipmentAssignment surface) — recommended to ship before/with WO-15c so the post-save consumer of structured plans exists. Not a hard requirement for 15a itself.
**Enables:** WO-15b (settings UI), WO-15c (apply UI + Planned Crew advisory), WO-16 (Schedule tab consumes `appliedWorkOrderTemplate.laborPlans`)

---

## Decided — alignment with adjacent in-flight work

**Mirror `WorkOrderChecklistItem` exactly.** PR #7155 added `WorkOrderChecklistItem` with `label String @db.VarChar(500)`, `description String? @db.Text`, `orderNo Int @default(0)`, `photoRequired Boolean @default(false)`, plus completion fields (`isDone`, `completedByUserId`, `completedAt`) that the **template mirror does NOT carry** — templates describe pre-completion work; "doneness" is per-Job, not per-template. The mirror's columns are: `label`, `description` (rich-text), `orderNo`, `photoRequired`. On apply, these four copy through to a new `WorkOrderChecklistItem` row on the new Job with `isDone = false`, `completedByUserId = null`, `completedAt = null`, `createdByUserId = currentUserId`. **No `AssetReference` rows are pre-created** — assets attach at tick time per WO-14.

**WYSIWYG sanitization rides on the BaseModel `type: "wysiwyg"` field declaration.** PR #7155's `WorkOrderChecklistItem.description` uses `type: "wysiwyg"` in its `modelFields`; no separate sanitize helper is invoked. WO-15a's `WorkOrderTemplateChecklistItem.description` and the rich-text-targeted `WorkOrderTemplateFieldDefault.value` (when target DAA's `defaultAttributeType` is the rich-text variant) declare the same `type: "wysiwyg"` and rely on the framework. Spec calls this "reuse WO-14 sanitization config" — the reuse is the framework path, not a function call.

**`JobSafetyFormWrapper` is the existing WO-13 join.** Schema at `schema.prisma:2366-2386`. Required on create: `id`, `jobId`, `formWrapperId`. Optional: `userId`, the four date columns, `isArchived`. WO-15a's apply path creates one row per `formWrapperId` in the template, leaves `userId` and dates null (those get filled on form fill-out per WO-13).

**`EquipmentAssignment` is the existing WO-16 surface.** Schema at `schema.prisma:1946-1974`. Required on create: `id`, `equipmentId`. WO-15a's apply path creates one row per user-selected equipment per structured equipment plan with `checkoutJobId = newJobId` and dates / operator / notes from the apply UI's prompt; un-resolved plans (user skipped the prompt) create no row — the plan stays as advisory metadata accessed via the template snapshot from `Job.appliedWorkOrderTemplate.equipmentPlans`.

**`DocumentAttributeAssignment` is keyed by `defaultAttributeType` for rich-text detection.** Schema at `schema.prisma:3572-3624`. `defaultAttributeType` is a `DocumentAttributeType?` enum with `string` as default; templates' field-default `value` is sanitized via `type: "wysiwyg"` only when the target DAA's `defaultAttributeType` resolves to a rich-text variant. Detection happens in the model's `customCreateItem` / `customEditItem` via a join to `DocumentAttributeAssignment`.

**`WO-11`'s polymorphic worked-on reference is out-of-scope for templates in V1.** Templates do not carry a default `workedOnReferenceModel` / `workedOnReferenceId`. The Equipment-as-Subject linkage on a created WO is set in the regular create form, not from the template. Spec explicitly defers a "default subject" to post-1.33.

**`createJob` extends via the same destructure-with-rest pattern already in use.** `JobModel.createItem` at `apps/api/src/models/Job.ts:1005-1177` already destructures `jobSiteSupervisorIds` and the `workedOnReference*` pair out of `data` and processes them after `super.createItem` returns. WO-15a adds `workOrderTemplateApplication` to the same destructure — no new model method, no `customCreateItem` rewrite. **Atomicity** is achieved via a `prisma.$transaction(async (tx) => { ... })` wrapper around the entire application section (Step 9). Open question for implementation: whether `super.createItem` can accept a `tx` client so the Job itself rolls back on a failed child write — see Step 9d. Current pattern (folder creation in the post-create callback) is sequential, not transactional; WO-15a's tighter atomicity requirement is the first piece of `createJob` work that genuinely needs `$transaction`.

**Untyped templates.** Per spec §4.1: any active template can apply to any WO regardless of `jobType`. No compatibility validation at apply time. Keeps the apply UI's picker simple.

**Snapshot semantics — no live-link.** Once a Job is created with a template, subsequent edits to the template do NOT propagate. `Job.appliedWorkOrderTemplateId` is purely an audit pointer. SetNull on template archive.

## Step 1: Prisma Schema — Seven New Models

**File:** `apps/api/prisma/schema.prisma`

Each model follows the standard house convention: `id String @id @db.VarChar(21)`, soft-delete + archive flags, timestamps, ON DELETE CASCADE to the parent template. No new id strategies, no new enums, no schema view changes.

### 1a. `WorkOrderTemplate` — top-level

```prisma
model WorkOrderTemplate {
    id          String   @id @db.VarChar(21)
    isDeleted   Boolean  @default(false)
    isArchived  Boolean  @default(false)
    createdAt   DateTime @default(now())
    updatedAt   DateTime @default(now()) @updatedAt

    name              String   @db.VarChar(200)
    description       String?  @db.Text
    estimatedDuration Int?
    isActive          Boolean  @default(true)
    lastUsedAt        DateTime?

    ChecklistItems  WorkOrderTemplateChecklistItem[]
    MaterialItems   WorkOrderTemplateMaterialItem[]
    LaborPlans      WorkOrderTemplateLaborPlan[]
    EquipmentPlans  WorkOrderTemplateEquipmentPlan[]
    FormWrappers    WorkOrderTemplateFormWrapper[]
    FieldDefaults   WorkOrderTemplateFieldDefault[]

    AppliedToJobs   Job[]    @relation("JobAppliedTemplate")

    @@index([isDeleted, isArchived, isActive], map: "WOTemplate_active_idx")
    @@index([lastUsedAt], map: "WOTemplate_lastUsed_idx")
}
```

### 1b. `WorkOrderTemplateChecklistItem` — mirror of `WorkOrderChecklistItem` (from PR #7155)

Identical column shape to PR #7155's runtime model, minus the completion fields (`isDone`, `completedByUserId`, `completedAt`, `createdByUserId`) which don't apply to a template. Same `@db.Text` description, same `photoRequired Boolean @default(false)`.

```prisma
model WorkOrderTemplateChecklistItem {
    id          String   @id @db.VarChar(21)
    isDeleted   Boolean  @default(false)
    isArchived  Boolean  @default(false)
    createdAt   DateTime @default(now())
    updatedAt   DateTime @default(now()) @updatedAt

    workOrderTemplateId String            @db.VarChar(21)
    WorkOrderTemplate   WorkOrderTemplate @relation(
        fields: [workOrderTemplateId], references: [id], onDelete: Cascade)

    label         String  @db.VarChar(500)
    description   String? @db.Text
    orderNo       Int     @default(0)
    photoRequired Boolean @default(false)

    @@index([workOrderTemplateId, isDeleted, orderNo], map: "WOTplChk_template_order_idx")
}
```

### 1c. `WorkOrderTemplateMaterialItem` — generic Material reference, variant deferred to runtime

Templates point at `Material` (the generic group, e.g. "Pipe Insulation Fitting"). The runtime variant (`materialAttributePriceId`) and price are filled in at apply time or later. Description-only rows are permitted (no FK).

```prisma
model WorkOrderTemplateMaterialItem {

    @@index([workOrderTemplateId, isDeleted, orderNo], map: "WOTplMat_template_order_idx")
    @@index([materialId], map: "WOTplMat_material_idx")

## Step 3: Migration — Seven Tables + Job FK in One File

**Create file:** `apps/api/prisma/migrations/[timestamp]_wo_15a_work_order_templates/migration.sql`

Seven `CREATE TABLE` statements + Job ALTER + composite indexes. No backfill (templates are new and empty; existing Jobs have `appliedWorkOrderTemplateId = NULL` which is the "no template" state). No schema view rebuild. No DAA seeding.

```sql
-- =============================================================
-- WO-15a: Work Order Templates — foundation tables
-- =============================================================

CREATE TABLE `WorkOrderTemplate` (
    `id`                String         CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci NOT NULL,
    `isDeleted`         TINYINT(1)     NOT NULL DEFAULT 0,
    `isArchived`        TINYINT(1)     NOT NULL DEFAULT 0,
    `createdAt`         DATETIME(3)    NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
    `updatedAt`         DATETIME(3)    NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
    `name`              VARCHAR(200)   NOT NULL,
    `description`       TEXT           NULL,
    `estimatedDuration` INT            NULL,
    `isActive`          TINYINT(1)     NOT NULL DEFAULT 1,
    `lastUsedAt`        DATETIME(3)    NULL,
    PRIMARY KEY (`id`),
    INDEX `WOTemplate_active_idx`   (`isDeleted`, `isArchived`, `isActive`),
    INDEX `WOTemplate_lastUsed_idx` (`lastUsedAt`)
);

-- ChecklistItem, MaterialItem, LaborPlan, EquipmentPlan, FormWrapper, FieldDefault
-- all follow the same shape: id VARCHAR(21), soft-delete flags, timestamps, FK to
-- WorkOrderTemplate ON DELETE CASCADE, content columns per §1b-1g, indexes per §1.
-- (Full SQL omitted here for brevity — the generator will produce it from the
-- Prisma diff; review per the CLAUDE.md SQL safety rules: no DROP PRIMARY KEY,
-- no schema-qualified table references, file ends with newline.)

-- Job audit FK
ALTER TABLE `Job`
    ADD COLUMN `appliedWorkOrderTemplateId` VARCHAR(21) NULL,
    ADD INDEX `Job_appliedWOTemplate_idx` (`appliedWorkOrderTemplateId`),
    ADD CONSTRAINT `Job_appliedWOTemplate_fkey`
        FOREIGN KEY (`appliedWorkOrderTemplateId`)
        REFERENCES `WorkOrderTemplate`(`id`)
        ON DELETE SET NULL ON UPDATE CASCADE;
```

Per CLAUDE.md: no DROP PRIMARY KEY, no `USE [database]`, no `[schema].[table]`, file ends with newline.

## Step 5: API Models — Seven New BaseModel Subclasses

**Files:** one TypeScript file per model under `apps/api/src/models/`.

Each is a thin `BaseModel<IXxx>` subclass with `modelFields` and any minimal validators. The `WorkOrderTemplate` model gets a small helper for the `lastUsedAt` bump that the apply path calls; everything else is vanilla BaseModel.

### 5a. `WorkOrderTemplate.ts`

```typescript
class WorkOrderTemplate extends BaseAuditableModel<IWorkOrderTemplate> {
    public name = "WorkOrderTemplate";
    name_plural = "WorkOrderTemplates";
    protected prisma = prisma.workOrderTemplate;

    protected modelFields: IField<IWorkOrderTemplate>[] = [
        { name: "name", type: "string", options: { isRequiredOnCreate: true, isSortable: true, isFilterable: true, maxLength: 200 } },
        { name: "description", type: "wysiwyg", options: { maxLength: 5000 } },
        { name: "estimatedDuration", type: "int" },
        { name: "isActive", type: "boolean", options: { isFilterable: true } },
        { name: "lastUsedAt", type: "date" }
    ];

    public async bumpLastUsedAt(id: string, currentUserId: string): Promise<void> {
        // Routes through BaseModel.editItem so audits / hooks / soft-delete
        // filtering all run — never raw prisma. The lastUsedAt field is in
        // modelFields above so the BaseModel write-path picks it up cleanly.
        await this.editItem(id, { lastUsedAt: new Date() }, currentUserId);
    }
}
```

`bumpLastUsedAt` is called from the Job apply path in §8c.

### 5c-5g. Child models

`WorkOrderTemplateMaterialItem.ts`, `WorkOrderTemplateLaborPlan.ts`, `WorkOrderTemplateEquipmentPlan.ts`, `WorkOrderTemplateFormWrapper.ts`, `WorkOrderTemplateFieldDefault.ts` follow the same vanilla BaseModel shape — `modelFields` matching the columns in §1. **Two validators worth calling out**:

**`WorkOrderTemplateLaborPlan` + `WorkOrderTemplateEquipmentPlan` reject "both null"** (per AC #10):

```typescript
public async customCreateItem(data: Partial<IWorkOrderTemplateLaborPlan>, currentUserId: string) {
    if (!data.tradeLevelId && !data.description) {
        throw new BadRequestError("A labor plan must specify a trade level or a description.");
    }
    return super.customCreateItem(data, currentUserId);
}
public async customEditItem(id: string, data: Partial<IWorkOrderTemplateLaborPlan>, currentUserId: string) {
    if ("tradeLevelId" in data || "description" in data) {
        // re-fetch current to compute the merged shape, then assert
        const current = await prisma.workOrderTemplateLaborPlan.findUnique({ where: { id } });
        const merged = { ...current, ...data };
        if (!merged.tradeLevelId && !merged.description) {
            throw new BadRequestError("A labor plan must specify a trade level or a description.");
        }
    }
    return super.customEditItem(id, data, currentUserId);
}
```

Same shape on `WorkOrderTemplateEquipmentPlan` with `equipmentCategoryId` in place of `tradeLevelId`.

**`WorkOrderTemplateFieldDefault` sanitizes `value` only when the target DAA is rich-text** — read `defaultAttributeType` on the assignment to decide whether to route through the WYSIWYG sanitization helper or trust the value as-is. Implementation detail: do this in `customCreateItem` / `customEditItem`, not via a static `type: "wysiwyg"` declaration on `modelFields` (because the decision is dynamic per-target-DAA).

```typescript
private RICH_TEXT_TYPES: DocumentAttributeType[] = ["wysiwyg"]; // confirm enum value(s) at implementation
private async sanitizeIfRichText(daaId: string, value?: string): Promise<string | undefined> {
    if (!value) return value;
    const daa = await prisma.documentAttributeAssignment.findUnique({
        where: { id: daaId },
        select: { defaultAttributeType: true }
    });
    if (daa && this.RICH_TEXT_TYPES.includes(daa.defaultAttributeType)) {
        // Same path the BaseModel framework uses for type: "wysiwyg" fields.
        // Confirm the helper name during implementation; for now, route through
        // the framework's WYSIWYG sanitizer.
        return sanitizeWysiwyg(value);
    }
    return value;
}
```

## Step 8: Job Model — Extend `createItem` for Template Application

**File:** `apps/api/src/models/Job.ts` (existing `createItem` at lines 1005-1177)

### 8a. End-to-end flow — what "apply" actually means

The backend in this step does **not** read the template's child rows during create. The "applying" happens on the frontend; the backend's job is to persist whatever the user submitted.

```
1. Frontend (WO-15c apply UI)
   • User clicks "Apply template" on the WO create form
   • Frontend calls previewWorkOrderTemplate(templateId) → fetches the template
     and its six child collections (read-only, no DB writes)
   • Frontend hydrates the WO create form draft state from the snapshot:
       - field defaults pre-fill the form fields
       - forms summary panel shows attached FormWrappers
       - checklist rows pre-populate inline (editable)
       - material rows pre-populate inline (editable)
       - free-form labor / equipment rows pre-populate inline (editable)
       - structured labor plans render as advisory callout (read-only on create)
       - structured equipment plans render as "pick specific equipment" prompts
   • User edits anything they want — adds rows, removes rows, changes values

2. Frontend submits createJob with the application payload
   • workOrderTemplateApplication.{checklistItems, materialItems, …} carries
     EXACTLY what the user wants saved — not the template's content
   • Anything the user removed is absent; anything they added is included
   • Structured labor plans are NOT in the payload (advisory metadata only;
     accessed at render time via Job.AppliedWorkOrderTemplate.LaborPlans)

3. Backend (this step) — JobModel.createItem
   • super.createItem writes the Job row (with appliedWorkOrderTemplateId)
   • applyWorkOrderTemplate (§8c) takes the user-submitted drafts and writes
     them as child rows on the new Job in a $transaction:
       - WorkOrderChecklistItem rows from application.checklistItems
       - WorkOrderMaterialItem rows from application.materialItems
       - JobSafetyFormWrapper rows from application.formWrapperIds
       - EquipmentAssignment rows from application.equipmentSelections
       - WorkOrderLaborItem rows from application.laborItems (free-form only)
       - WorkOrderEquipmentItem rows from application.equipmentItems (free-form only)
       - DocumentAttributeValue rows from application.fieldDefaults
   • The only template rows the backend touches: a single read to validate the
     template exists + is active, and a single update to bump lastUsedAt.
```

**Why this matters:** if the user clicks Apply, then removes a checklist item, then clicks Save, the removed item never reaches the backend and never lands on the Job. The template stays unchanged. Snapshot semantics from WO-15a become trivially true because the WO's child rows are populated from the **frontend's final state**, not from a server-side copy of the template — so subsequent template edits can't propagate (there's no link).

### 8b. **Extend** the existing `createItem` — do NOT replace it

The existing method already handles job numbering, project validation, geofence checks, `jobSiteSupervisorIds`, `workedOnReferenceModel`/`workedOnReferenceId`, and default folder creation. The template-application work slots in via the same destructure-with-rest pattern (line 1094):

```typescript
public async createItem(
    data: Partial<
        FullModel<
            IJob & {
                jobSiteSupervisorIds: string[];
                workedOnReferenceModel: string;
                workedOnReferenceId: string;
                workOrderTemplateApplication?: IWorkOrderTemplateApplicationInput;   // + NEW
            }
        >
    >,
    currentUserId: string,
    skipAfterCreate?: boolean,
    callback?: (data: FullModel<IJob>) => void
): Promise<FullModel<IJob>> {
    // ...all existing validation + numbering + standalone-job logic (lines 1019-1092) stays as-is...

    // Extend the existing destructure at line 1094 to also pull the application payload:
    const {
        jobSiteSupervisorIds,
        workedOnReferenceModel,
        workedOnReferenceId,
        workOrderTemplateApplication,                                                // + NEW
        ...rest
    } = copiedData;

    // + NEW — when applying a template, set the audit FK on the Job itself so it
    //         lands in the same row write super.createItem performs.
    if (workOrderTemplateApplication?.templateId) {
        rest.appliedWorkOrderTemplateId = workOrderTemplateApplication.templateId;
    }

    // ...existing super.createItem(rest, currentUserId, skipAfterCreate, async (job) => { folder creation }) call stays as-is (lines 1097-1156)...

    // Existing supervisor connect + worked-on sync at lines 1157-1175 stays as-is.

    // + NEW — fire the application AFTER all existing post-create work so
    //         supervisors and worked-on rows are in place if the application
    //         needs them. On failure, the Job is soft-deleted as a
    //         compensating action (no DB-level transaction — see §8e).
    if (workOrderTemplateApplication?.templateId) {
        await this.applyWorkOrderTemplate(
            created.id,
            workOrderTemplateApplication,
            currentUserId
        );
    }

    return created;

```

The structure deliberately mirrors the existing supervisor + worked-on extensions on this method.

### 8c. `applyWorkOrderTemplate` — the new private method

The function name is "apply" for symmetry with the spec's terminology, but per §8a what it actually does is **persist the user-submitted application drafts as child rows on the new Job**. It does not read the template's child collections; the frontend already did that via `previewWorkOrderTemplate` and the user has already edited the result.

**Every child write goes through its model's `createItem` method**, not raw Prisma — per CLAUDE.md "Always Use BaseModel Methods — Never Raw Prisma in Resolvers." That gives us audit logging, permission checks, soft-delete filtering, and any `customCreateItem` hooks the runtime models have (e.g. WO-14's checklist model may grow side effects later that we'd silently skip if we wrote raw Prisma here).

```typescript
private async applyWorkOrderTemplate(
    jobId: string,
    application: IWorkOrderTemplateApplicationInput,
    currentUserId: string
): Promise<void> {
    // Validate the template is active and not archived. Spec is explicit:
    // templates are untyped — no jobType compatibility check.
    // (BaseModel.getItem would also work here, but a thin select keeps this read cheap.)
    const template = await prisma.workOrderTemplate.findUnique({
        where: { id: application.templateId },
        select: { id: true, isArchived: true, isDeleted: true, isActive: true }
    });
    if (!template || template.isDeleted || template.isArchived || !template.isActive) {
        throw new BadRequestError("Selected template is not available for apply.");
    }

    // Each collection's rows are independent of each other, so within a
    // collection we Promise.all the writes. Between collections we await
    // sequentially so a partial failure surfaces with a clear "which step
    // failed" message and the compensating delete (§8e) catches cleanly.
    // The lastUsedAt bump runs LAST so the template isn't marked-as-used
    // if any child write threw.

    // 1. Checklist — route through the WO-14 model added by PR #7155 so its
    //    audit / hooks run.
    const checklistModel = new WorkOrderChecklistItemModel();
    await Promise.all(
        (application.checklistItems ?? []).map((item) =>
            checklistModel.createItem(
                {
                    jobId,
                    label: item.label,
                    description: item.description ?? undefined,
                    orderNo: item.orderNo ?? 0,
                    photoRequired: item.photoRequired ?? false
                    // isDone / completedByUserId / completedAt default per PR #7155 schema;
                    // createdByUserId is set by BaseAuditableModel from currentUserId
                },
                currentUserId
            )
        )
    );

    // 2. Materials — both structured (materialId set) and free-form (description-only)
    const materialModel = new WorkOrderMaterialItemModel();
    await Promise.all(
        (application.materialItems ?? []).map((item) =>
            materialModel.createItem(
                {
                    jobId,
                    materialId: item.materialId ?? undefined,
                    description: item.description ?? undefined,
                    quantity: item.quantity ?? undefined,
                    orderNo: item.orderNo ?? 0
                    // materialAttributePriceId stays NULL — variant chosen at runtime
                    // unitPrice stays NULL — pricing happens at runtime
                },
                currentUserId
            )
        )
    );

    // 3. Forms — one JobSafetyFormWrapper per formWrapperId
    const formWrapperModel = new JobSafetyFormWrapperModel();
    await Promise.all(
        (application.formWrapperIds ?? []).map((formWrapperId) =>
            formWrapperModel.createItem(
                {
                    jobId,
                    formWrapperId
                    // userId, jobSafetyFormDate left undefined — populated at fill-out per WO-13
                },
                currentUserId
            )
        )
    );

    // 4. Equipment assignments — only for plans the user resolved with specific equipment.
    //    Flatten the (selection × equipmentIds) into a single parallel batch.
    const equipmentAssignmentModel = new EquipmentAssignmentModel();
    const assignmentWrites = (application.equipmentSelections ?? []).flatMap((sel) =>
        sel.equipmentIds.map((equipmentId) =>
            equipmentAssignmentModel.createItem(
                {
                    equipmentId,
                    checkoutJobId: jobId,
                    userId: sel.operatorId ?? undefined,
                    checkoutDateTime: sel.checkoutDateTime ?? undefined,
                    checkinDateTime: sel.checkinDateTime ?? undefined,
                    checkoutNotes: sel.checkoutNotes ?? undefined
                },
                currentUserId
            )
        )
    );
    await Promise.all(assignmentWrites);

    // 5. Unstructured labor — WorkOrderLaborItem rows
    const laborItemModel = new WorkOrderLaborItemModel();
    await Promise.all(
        (application.laborItems ?? []).map((item) =>
            laborItemModel.createItem(
                {
                    jobId,
                    qtyOfWorkers: item.qtyOfWorkers ?? 1,
                    submittedDuration: item.submittedDuration ?? 0,
                    description: item.description ?? undefined,
                    orderNo: item.orderNo ?? 0
                    // rate stays NULL — filled at runtime
                },
                currentUserId
            )
        )
    );

    // 6. Unstructured equipment — WorkOrderEquipmentItem rows
    const equipmentItemModel = new WorkOrderEquipmentItemModel();
    await Promise.all(
        (application.equipmentItems ?? []).map((item) =>
            equipmentItemModel.createItem(
                {
                    jobId,
                    quantity: item.quantity ?? undefined,
                    description: item.description ?? undefined,
                    orderNo: item.orderNo ?? 0
                    // unitRate stays NULL; plannedSeconds intentionally not copied
                    // (no time column on this model)
                },
                currentUserId
            )
        )
    );

    // 7. Field defaults — DocumentAttributeValue rows for accepted defaults
    const docAttrValueModel = new DocumentAttributeValueModel();
    await Promise.all(
        (application.fieldDefaults ?? []).map((fd) =>
            docAttrValueModel.createItem(
                {
                    referenceId: jobId,
                    documentAttributeAssignmentId: fd.documentAttributeAssignmentId,
                    value: fd.value ?? undefined
                },
                currentUserId
            )
        )
    );

    // 8. Bump lastUsedAt — last, so the template isn't marked used if any
    //    earlier collection threw. Goes through the model helper so any
    //    future audit on the bump itself is captured.
    await new WorkOrderTemplateModel().bumpLastUsedAt(application.templateId, currentUserId);
}
```

**Why parallel within a collection but sequential between collections.** Every row in a single collection is independent — checklist row N doesn't depend on checklist row M, materials don't depend on each other, etc. `Promise.all` collapses N round-trips per collection to roughly one round-trip, which matters when a template has 18 checklist items + 5 materials + 3 labor lines + 2 equipment selections. Between collections we stay sequential because (a) error messages point at the collection that failed, making the compensating-delete catch (§8e) actionable, and (b) Prisma's connection pool is bounded — letting every collection's promises race could spike connection use briefly for a marginal speed gain on apply paths that are already milliseconds.

**Promise.all + BaseModel is safe.** Each `model.createItem(data, currentUserId)` call is stateless w.r.t. the model instance — the data is per-call, audit context is per-call. Prisma's pool handles concurrent queries fine. The shared model instance per collection is fine because BaseModel methods don't write to instance fields between calls.

**Confirm model class names at implementation time.** The codebase is **inconsistent on naming** — some classes carry the `Model` suffix (e.g. `WorkOrderTemplateModel`, `FolderModel`), others are bare (e.g. `EquipmentAssignment` not `EquipmentAssignmentModel`, `AnswerClass` not `AnswerClassModel`). The `new XxxModel()` calls in the code block above are illustrative — at implementation, grep `apps/api/src/models/` for the actual exported class name of each model and use that. If any of these models don't exist yet as a BaseModel subclass, the implementer adds a bare BaseModel subclass before wiring this method up — same pattern as the seven new template models.

**`bumpLastUsedAt` signature simplifies.** Now that the apply path no longer uses `$transaction`, the helper drops its optional `tx` parameter:

```typescript
public async bumpLastUsedAt(id: string, currentUserId: string): Promise<void> {
    await this.editItem(id, { lastUsedAt: new Date() }, currentUserId);
}
```

Routing through `editItem` instead of a raw `prisma.workOrderTemplate.update` for the same audit / hooks consistency reason. `editItem` is a BaseModel method; the `lastUsedAt` field is registered in `modelFields` (Step 5a) so the update flows through normally.

### 8d. Why a private model method, not a separate resolver

Per CLAUDE.md "GraphQL Resolvers Must Stay Thin" — the apply logic is non-trivial multi-step business logic, so it lives in the model. The resolver for `createJob` continues to be a one-liner.

### 8e. Atomicity — compensating soft-delete, not a DB transaction

Spec AC #6 says "failure of any step rolls everything back." A naive read of that says wrap the whole apply in `prisma.$transaction(async (tx) => ...)`. We don't, for one reason: **`BaseModel.createItem` and friends use the module-level `prisma` client**, so they can't be threaded into an outer `tx` without a framework-level refactor (passing `tx` through every `BaseModel.createItem`, `editItem`, etc.). That refactor is out of scope for WO-15a.

Routing every child write through model methods (§8c) is the right call — we don't want to silently skip audits, permissions, soft-delete filtering, or `customCreateItem` hooks just to gain DB-level atomicity. So the apply runs as a **sequence of independent model writes**, and we satisfy the spec's "rolls everything back" with a **compensating soft-delete** on the Job in the catch path:

```typescript
try {
    await this.applyWorkOrderTemplate(created.id, workOrderTemplateApplication, currentUserId);
} catch (err) {
    // Compensating delete — the application failed partway through, so the
    // Job (and any child rows already written through their model methods)
    // get soft-deleted. The user sees the same outcome as a DB-level rollback:
    // no half-applied WO. The audit log captures the soft-delete distinctly
    // from a true rollback, which is actually desirable for forensics.
    await this.deleteItem(created.id, currentUserId);
    throw err;
}
```

`this.deleteItem` (BaseModel) cascades the soft-delete to children via the existing soft-delete propagation (or via the `archiveChildren` hook if needed — confirm at implementation; the existing Job model has an `archiveChildren` override in the same file). The error is re-thrown so the GraphQL response surfaces the failure to the caller.

**Trade-offs vs a true DB transaction:**
- Audit-log captures `Job.created → Job.soft-deleted` rather than vanishing entirely — better forensics, slightly noisier history.
- Any soft-deleted children created before the failure remain queryable with `isDeleted: true` filters — same as any other compensating operation in the codebase.
- A crash between the create and the catch could leave a Job with `isDeleted = false` but no template content. Acceptable risk: failures inside the apply path are caught by `try/catch`; a Node process crash is rare and recovery is the same as any unsaved partial state in the system.

**Out-of-scope alternative (track separately):** a `BaseModel`-level `withTransaction(tx, async (m) => …)` helper that lets every model method accept a `tx`. Would give true DB atomicity here and elsewhere (folder creation, supervisor connect, etc. — none of which are atomic today either). Worth raising during data-model review with Chris, but not part of WO-15a.

## Step 9: Form-Render — Template Tier in Default-Value Resolution

**Files:** the existing form-render code path that resolves DAA `defaultValue` for a Job.

Per spec §4.2: render-time tier order is **instance > template > DAA default**. Today the resolver returns `DocumentAttributeAssignment.overrideDefaultValue ?? defaultValue` when no `DocumentAttributeValue` exists. The change is to consult `WorkOrderTemplateFieldDefault.value` between those two tiers when the Job has an `appliedWorkOrderTemplateId`.

```typescript
// Inside the existing form-render value resolver (path to confirm at implementation):
const instanceValue = await prisma.documentAttributeValue.findUnique({
    where: { referenceId_documentAttributeAssignmentId: { referenceId: jobId, documentAttributeAssignmentId: daa.id } }
});
if (instanceValue?.value !== undefined && instanceValue?.value !== null) return instanceValue.value;

const job = await prisma.job.findUnique({
    where: { id: jobId },
    select: { appliedWorkOrderTemplateId: true }
});
if (job?.appliedWorkOrderTemplateId) {
    const templateDefault = await prisma.workOrderTemplateFieldDefault.findFirst({
        where: {
            workOrderTemplateId: job.appliedWorkOrderTemplateId,
            documentAttributeAssignmentId: daa.id,
            isDeleted: false,
            isArchived: false
        }
    });
    if (templateDefault?.value !== undefined && templateDefault?.value !== null) {
        return templateDefault.value;
    }
}

return daa.overrideDefaultValue ?? daa.defaultValue ?? null;
```

This change is the only existing-code modification that touches a render-time path. Identify the resolver file during implementation (likely a per-section query or a form-builder loader). Add unit coverage: instance-set wins; instance-null + template-set wins; both null → DAA default.
