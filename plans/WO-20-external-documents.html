# WO-20: External Documents — Implementation Plan

## Overview

Add an "External documents" widget on Job, Project, and WO detail pages. Users paste a URL (typically SharePoint / OneDrive / Drive / Procore / Dropbox), label it, optionally hide it from mobile, and click to open in a new tab. The platform stores URL strings + provenance metadata only — **no server-fetch, no iframe, no OAuth**. Phase 2 (in-app iframe via Microsoft Graph) is out of scope for V1 and lives at WOX-17.

The data model is polymorphic on `referenceModel` ("Job" or "Project") + `referenceId`, mirroring the existing `AssetReference` and `MaintenanceThreshold` patterns. WO detail pages reuse the Job-side widget because WorkOrder is a `Job.classification` value, not a separate model.

Edits are first-class: users can fix a typo'd label, swap the URL (re-validated server-side), or toggle mobile visibility on an existing row. The mobile-visibility toggle uses the repo's existing `IconEye` / `IconEyeOff` convention as an inline clickable on each row (cribbed from `FileItem.tsx`), with optimistic update + revert-on-error.

**Estimated effort:** 1.5–2 days · 0.25d schema + migration · 0.4d API model + GraphQL · 0.5d desktop widget · 0.3d mobile · 0.2d tests + audit wiring
**Risk:** Low — additive schema, no backfill, no resolver-layer changes outside the new model, no permission seeding (uses parent-entity edit gate)
**Spec:** `wo-20-external-documents.html`
**Requires:** WO-3 / WO-4 (WO detail page scaffolding — Job-side surface)
**Enables:** Future WOX-17 (Phase 2 SharePoint iframe — extends this same model with a `provider` enum)

<div class="security-banner"><strong>Security invariant:</strong> the platform stores URL strings as user-pasted text. We <em>never</em> server-fetch a stored URL — that's an SSRF vector. Favicon / preview is client-side only. This rule is encoded in a unit test on the resolver (Step 11) and shouldn't be relaxed casually.</div>

<div class="callout"><strong>Distinct from the file/folder system.</strong> External documents are intentionally <em>not</em> part of the existing <code>Asset</code> + <code>Folder</code> + <code>AssetReference</code> tree — they're a flat list of pasted URLs at the entity level. Different lifecycle (pasted URLs vs uploaded assets), different ownership (external host vs Appello), different auth model. Keeping them separate avoids "is this folder mine to delete or just a link?" ambiguity.</div>

## Step 1: Prisma Schema — ExternalDocument Model

**File:** `apps/api/prisma/schema.prisma`

Insert after the `Folder` model (currently around line 4829 — the cluster of polymorphic-reference models). Cribbed from `Folder` (for `hiddenFromMobile`) and `AssetReference` (for the polymorphic `referenceModel` + `referenceId` shape).

```prisma
model ExternalDocument {
  id         String   @id @db.VarChar(21)
  isDeleted  Boolean  @default(false)
  isArchived Boolean  @default(false)
  createdAt  DateTime @default(now())
  updatedAt  DateTime @default(now()) @updatedAt

  referenceModel String @db.VarChar(50)
  referenceId    String @db.VarChar(21)

  url   String @db.VarChar(2000)
  label String @db.VarChar(200)

  hiddenFromMobile Boolean @default(false)

  sourceDomain String? @db.VarChar(255)

  addedByUserId String? @db.VarChar(21)
  AddedByUser   User?   @relation("ExternalDocumentsAdded", fields: [addedByUserId], references: [id], onDelete: SetNull)

  @@index([referenceModel, referenceId, isDeleted, isArchived], map: "ExternalDocument_reference_idx")
  @@index([addedByUserId], map: "ExternalDocument_addedBy_idx")
}
```

Add the inverse relation on the existing `User` model:

```prisma
// On User:
ExternalDocumentsAdded ExternalDocument[] @relation("ExternalDocumentsAdded")
```

**Notes for Chris's review:**

- `referenceModel` allowlist (`"Job"` and `"Project"`) is enforced in the model layer (Step 4), not at the schema level. WorkOrder is a `Job.classification` value so WOs use `referenceModel = "Job"`.
- `hiddenFromMobile Boolean @default(false)` mirrors `Folder.hiddenFromMobile` (line ~4821) exactly. Existing `Folder` callers filter server-side via `extendedWhere` (see `FileListFeed.ts` lines 114–115); this plan follows the same convention (Step 5).
- `sourceDomain` is cached at write time from `new URL(url).host.toLowerCase()` so the source-domain badge in the UI doesn't need to re-parse on every render. Phase 2 (WOX-17) will layer a `provider` enum on top.
- `url` capped at 2000 chars (covers any realistic SharePoint deep link with query params).
- `addedByUserId` is `onDelete: SetNull` so soft-deleting a user doesn't cascade-delete their pasted links.
- `isDeleted` / `isArchived` are inherited semantics from `BaseAuditableModel`; this model uses `isArchived` for soft-delete (spec §AC #7).

## Step 2: Migration

**Create file:** `apps/api/prisma/migrations/<YYYYMMDDHHMMSS>_add_external_document/migration.sql`

Use a timestamp greater than the most recent migration in `apps/api/prisma/migrations/`. `migration_lock.toml` lives at the migrations root and is unchanged.

```sql
-- WO-20: ExternalDocument table — pasted URLs at Job/Project level.
-- Polymorphic reference (referenceModel allowlist enforced in model layer).
-- Server NEVER fetches stored URLs — SSRF prevention is a code invariant.

CREATE TABLE `ExternalDocument` (
    `id`               VARCHAR(21)   NOT NULL,
    `isDeleted`        BOOLEAN       NOT NULL DEFAULT FALSE,
    `isArchived`       BOOLEAN       NOT NULL DEFAULT FALSE,
    `createdAt`        DATETIME(3)   NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
    `updatedAt`        DATETIME(3)   NOT NULL DEFAULT CURRENT_TIMESTAMP(3) ON UPDATE CURRENT_TIMESTAMP(3),
    `referenceModel`   VARCHAR(50)   NOT NULL,
    `referenceId`      VARCHAR(21)   NOT NULL,
    `url`              VARCHAR(2000) NOT NULL,
    `label`            VARCHAR(200)  NOT NULL,
    `hiddenFromMobile` BOOLEAN       NOT NULL DEFAULT FALSE,
    `sourceDomain`     VARCHAR(255)  NULL,
    `addedByUserId`    VARCHAR(21)   NULL,

    PRIMARY KEY (`id`),
    INDEX `ExternalDocument_reference_idx` (`referenceModel`, `referenceId`, `isDeleted`, `isArchived`),
    INDEX `ExternalDocument_addedBy_idx`   (`addedByUserId`),
    CONSTRAINT `ExternalDocument_addedBy_fkey`
        FOREIGN KEY (`addedByUserId`) REFERENCES `User`(`id`) ON DELETE SET NULL
);
```

Pure additive — no backfill, no data movement, safe to deploy ahead of API code.

## Step 4: ExternalDocument Model Class

**Create file:** `apps/api/src/models/ExternalDocument.ts`

Extends `BaseAuditableModel<IExternalDocument>` (cribbed from `Comment.ts`). `BaseAuditableModel.createItem` / `editItem` / `archiveItem` automatically emit `prisma.audit.create` calls — the spec's audit-log requirement is satisfied by inheritance, no per-call wiring needed.

### 4.1 · Model fields

```typescript
protected modelFields: IField<IExternalDocument>[] = [
    { name: "referenceModel", type: "string", options: { isRequiredOnCreate: true, isFilterable: true, canEdit: false } },
    { name: "referenceId",    type: "string", options: { isRequiredOnCreate: true, isFilterable: true, canEdit: false } },
    {
        name: "url",
        type: "string",
        options: {
            isRequiredOnCreate: true,
            canEdit: true,
            validation: async (value: string) => {
                let parsed: URL;
                try { parsed = new URL(value); } catch { throw new BadRequestError("Invalid URL"); }
                if (!ALLOWED_URL_SCHEMES.includes(parsed.protocol as typeof ALLOWED_URL_SCHEMES[number])) {
                    throw new BadRequestError("URL must use http or https");
                }
            }
        }
    },
    { name: "label",            type: "string",  options: { isRequiredOnCreate: true, canEdit: true } },
    { name: "hiddenFromMobile", type: "boolean", options: { canEdit: true, isFilterable: true, defaultValue: false } },
    { name: "sourceDomain",     type: "string",  options: { canEdit: false } },
    { name: "addedByUserId",    type: "string",  options: { canEdit: false } }
];
```

The URL validator covers AC #2 (RFC-3986 rejection — `new URL()` enforces this), AC #6 (re-validated on edit — `BaseAuditableModel.editItem` re-runs field validators on changed fields), and additionally rejects `javascript:` / `data:` schemes which `new URL()` would otherwise accept.

### 4.2 · `customCreateItem` override

```typescript
protected async customCreateItem(
    data: Partial<IExternalDocument>,
    currentUserId: string
): Promise<Partial<IExternalDocument>> {
    if (!EXTERNAL_DOCUMENT_REFERENCE_MODELS.includes(data.referenceModel as ExternalDocumentReferenceModel)) {
        throw new BadRequestError(`Invalid referenceModel: ${data.referenceModel}`);
    }

    await this.assertParentExistsAndUserCanEdit(data.referenceModel!, data.referenceId!, currentUserId);

    if (data.url) {
        data.sourceDomain = new URL(data.url).host.toLowerCase();
    }
    if (!data.addedByUserId) {
        data.addedByUserId = currentUserId;
    }

    return data;
}
```

### 4.3 · `customEditItem` override

```typescript
protected async customEditItem(
    id: string,
    data: Partial<IExternalDocument>,
    currentUserId: string
): Promise<Partial<IExternalDocument>> {
    const existing = await prisma.externalDocument.findUniqueOrThrow({ where: { id } });
    await this.assertParentExistsAndUserCanEdit(existing.referenceModel, existing.referenceId, currentUserId);

    delete data.referenceModel;
    delete data.referenceId;
    delete data.addedByUserId;

    if (data.url) {
        data.sourceDomain = new URL(data.url).host.toLowerCase();
    }

    return data;
}
```

`referenceModel` / `referenceId` / `addedByUserId` are stripped from the edit payload silently — moving a document between parents or rewriting authorship is not a supported V1 operation. (Same defensive pattern `Comment.ts` uses for its `createdById`.)

### 4.4 · `customArchiveItem` override

```typescript
protected async customArchiveItem(id: string, currentUserId: string): Promise<void> {
    const existing = await prisma.externalDocument.findUniqueOrThrow({ where: { id } });
    await this.assertParentExistsAndUserCanEdit(existing.referenceModel, existing.referenceId, currentUserId);
}
```

`BaseAuditableModel.archiveItem` performs the actual `isArchived = true` update and audit emit; this override is just the permission gate.

### 4.5 · Permission helper

```typescript
private async assertParentExistsAndUserCanEdit(
    referenceModel: string,
    referenceId: string,
    currentUserId: string
): Promise<void> {
    if (referenceModel === "Job") {
        const job = await prisma.job.findUnique({ where: { id: referenceId }, select: { id: true } });
        if (!job) throw new NotFoundError("Job not found");
        await continueIfUserCanPerform(currentUserId, "job", "edit", referenceId);
    } else if (referenceModel === "Project") {
        const project = await prisma.project.findUnique({ where: { id: referenceId }, select: { id: true } });
        if (!project) throw new NotFoundError("Project not found");
        await continueIfUserCanPerform(currentUserId, "project", "edit", referenceId);
    } else {
        throw new BadRequestError(`Invalid referenceModel: ${referenceModel}`);
    }
}
```

Same gate as adding a comment (`continueIfUserCanPerform` from `apps/api/src/lib/canUserPerformAction.ts`). Read access on the parent grants list access, which is enforced at the resolver layer (Step 5) by the standard list-permission flow.

### 4.6 · Empty stubs

`archiveChildren`, `restoreChildren`, `getRelatedDeleteCount`, `deleteChildren` returning `Promise.resolve()` / `{}` — same as `Comment.ts`. ExternalDocument has no children.

## Step 5: GraphQL Resolver

**Create file:** `apps/api/src/graphql/models/ExternalDocument.ts`

Cribbed from `apps/api/src/graphql/models/Comment.ts`.

### 5.1 · Type + inputs

```graphql
type ExternalDocument {
    id: ID!
    referenceModel: String!
    referenceId: String!
    url: String!
    label: String!
    hiddenFromMobile: Boolean!
    sourceDomain: String
    addedByUserId: String

}

    url: String
    label: String

}

extend type Query {
    externalDocuments(options: GetListOptions): GetListResult
    externalDocument(id: ID!): ExternalDocument
}

extend type Mutation {
    addExternalDocument(data: AddExternalDocumentInput!): ExternalDocument!
    editExternalDocument(id: ID!, data: EditExternalDocumentInput!): ExternalDocument!
    archiveExternalDocument(id: ID!): ExternalDocument!

```

### 5.2 · Resolvers

```typescript
Resolvers: {
    AddedByUser: (parent) => parent.addedByUserId
        ? prisma.user.findUnique({ where: { id: parent.addedByUserId } })
        : null
},
Query: {
    externalDocuments: (_, args, context) =>
        new ExternalDocumentModel().getList(args.options ?? {}, context.userId()),
    externalDocument: (_, args, context) =>
        new ExternalDocumentModel().getItem(args.id, context.userId())
},
Mutation: {
    addExternalDocument: (_, args, context) =>
        new ExternalDocumentModel().createItem(args.data, context.userId()),
    editExternalDocument: (_, args, context) =>
        new ExternalDocumentModel().editItem(args.id, args.data, context.userId()),
    archiveExternalDocument: (_, args, context) =>
        new ExternalDocumentModel().archiveItem(args.id, context.userId())
}
```

### 5.3 · Schema registration

Register in `apps/api/src/graphql/schema.ts` (5 places — same pattern as `Comment`):

1. Import `ExternalDocumentResolvers`.
2. Spread its `typeDefs` into the typeDefs array.
3. Spread `Resolvers` into the model-resolvers object.
4. Spread `Query` resolvers.
5. Spread `Mutation` resolvers.

Export from `apps/api/src/graphql/models/index.ts`.

### 5.4 · Mobile filtering — server-side via `extendedWhere`

The mobile client passes `hiddenFromMobile = false` as a filter on the `externalDocuments` list query. This matches the existing `FileListFeed.ts` convention (lines 114–115) for `Folder.hiddenFromMobile` and is more secure than client-side filtering (mobile cannot bypass it by tweaking client code).

The `hiddenFromMobile` field is marked `isFilterable: true` in Step 4.1 so the standard filter pipeline accepts `{fieldName: "hiddenFromMobile", value: false, fieldOperation: "equals"}` without resolver changes.

### 5.5 · Decision: top-level query vs Job/Project field resolvers

The spec's §5.1 sketches `extend type Job { externalDocuments: [ExternalDocument!]! }` field resolvers. **This plan instead uses the top-level `externalDocuments(options)` query with a `referenceModel` + `referenceId` filter** — same pattern as `Comment` (no `Job.comments` field exists; the comment widget filters by reference). Lower-risk, fewer files touched, matches existing convention. The frontend widget passes the filter via the standard `where.filter` shape (Step 8.1).

## Step 6: Audit Log Verification

`BaseAuditableModel` emits `prisma.audit.create` rows automatically on `createItem` / `editItem` / `archiveItem` (see `apps/api/src/models/base/_BaseAuditableModel.ts`). No additional wiring is needed. Verify by adding / editing / archiving a doc in dev and querying:

```sql
SELECT operation, entityType, entityId, userId, createdAt
FROM Audit
WHERE entityType = 'ExternalDocument'
ORDER BY createdAt DESC LIMIT 10;
```

Expect three rows after add → edit → archive: `Create`, `Update`, `Delete`.

## Step 7: Frontend GraphQL Queries + Mutations

**Create files:**

- `apps/frontend/src/graphql/queries/externalDocuments.query.ts`
- `apps/frontend/src/graphql/mutations/externalDocuments.mutation.ts`

(Apollo codegen picks these up via the existing pipeline — `apps/frontend/src/graphql/generated/` regenerates after running the codegen command.)

Per CLAUDE.md, `gql` definitions go at the **bottom** of the file. Single fragment + four operations:

```typescript
// At the bottom of externalDocuments.query.ts:
export const EXTERNAL_DOCUMENT_FIELDS = gql`
    fragment ExternalDocumentFields on ExternalDocument {
        id
        referenceModel
        referenceId
        url
        label
        hiddenFromMobile
        sourceDomain
        addedByUserId
        AddedByUser { id firstName lastName fullName }
        createdAt
        updatedAt
        isArchived
    }
`;

export const EXTERNAL_DOCUMENTS_QUERY = gql`
    query ExternalDocuments($options: GetListOptions) {
        externalDocuments(options: $options) {
            items { ...ExternalDocumentFields }
            total
        }
    }
    ${EXTERNAL_DOCUMENT_FIELDS}
`;
```

Mutations file: `ADD_EXTERNAL_DOCUMENT`, `EDIT_EXTERNAL_DOCUMENT`, `ARCHIVE_EXTERNAL_DOCUMENT` — each returns `...ExternalDocumentFields` for cache update.

### 8.2 · `ExternalDocumentRow.tsx` — IconEye toggle (the user's specific request)

Imported from `@useanzen/ui` exactly as `FileItem.tsx` does:

```tsx
import { FC, memo } from "react";
import { IconEye, IconEyeOff, Tooltip } from "@useanzen/ui";
import { useMutation } from "@apollo/client";
import { EDIT_EXTERNAL_DOCUMENT } from "~root/graphql/mutations/externalDocuments.mutation";

interface IExternalDocumentRowProps {
    document: GqlExternalDocument;
    canEdit: boolean;
    onEdit: (id: string) => void;
    onArchive: (id: string) => Promise<void>;
}

const ExternalDocumentRow: FC<IExternalDocumentRowProps> = ({ document, canEdit, onEdit, onArchive }) => {
    // Hooks
    const [editDoc] = useMutation(EDIT_EXTERNAL_DOCUMENT);

    // Functions
    const toggleHidden = async (e: React.MouseEvent) => {
        e.stopPropagation();
        const next = !document.hiddenFromMobile;
        try {
            await editDoc({
                variables: { id: document.id, data: { hiddenFromMobile: next } },
                optimisticResponse: {
                    editExternalDocument: { ...document, hiddenFromMobile: next }
                }
            });
        } catch (err) {
            notify.error("Couldn't update mobile visibility");
        }
    };

    return (
        <div className="doc-row">
            <SourceBadge sourceDomain={document.sourceDomain} />
            <div className="flex-1">
                <div className="font-bold">{document.label}</div>
                <div className="doc-meta">{document.sourceDomain} · {document.AddedByUser?.fullName} · {dayjs(document.createdAt).fromNow()}</div>
            </div>
            {canEdit && (
                <button onClick={toggleHidden} aria-label="Toggle mobile visibility">
                    {document.hiddenFromMobile
                        ? <Tooltip icon={<IconEyeOff className="mr-2 w-5 h-5 text-danger" />} description="Hidden from mobile users" disableClick />
                        : <Tooltip icon={<IconEye    className="mr-2 w-5 h-5 text-success" />} description="Visible to mobile users" disableClick />}
                </button>
            )}
            <a href={document.url} target="_blank" rel="noopener noreferrer" className="btn btn-secondary btn-sm">↗ Open</a>
            {canEdit && <KebabMenu items={[
                { label: "Edit",   onClick: () => onEdit(document.id) },
                { label: "Remove", onClick: () => onArchive(document.id), variant: "danger" }
            ]} />}
        </div>
    );
};

export { ExternalDocumentRow };
```

The optimistic update mirrors `FileItem.tsx` `toggleSensitive` behaviour — toggle UI immediately, revert + notify on error. This is the AC #10 path: visibility flips without re-opening the edit form.

### 8.3 · `AddExternalDocumentForm.tsx` — reused for create AND edit

The user explicitly asked that items be editable (label typo fixes, URL swaps). Same form serves both flows — pass an optional `existingDocument` prop and the form pre-fills + calls `editExternalDocument` on submit.

```tsx
interface IAddExternalDocumentFormProps {
    referenceModel: "Job" | "Project";
    referenceId: string;
    existingDocument?: GqlExternalDocument;
    onSaved: () => void;
    onCancel: () => void;
}

const AddExternalDocumentForm: FC<IAddExternalDocumentFormProps> = ({
    referenceModel,
    referenceId,
    existingDocument,
    onSaved,
    onCancel
}) => {
    // State
    const [url,   setUrl]   = useState(existingDocument?.url   ?? "");
    const [label, setLabel] = useState(existingDocument?.label ?? "");
    const [hideOnMobile, setHideOnMobile] = useState(existingDocument?.hiddenFromMobile ?? false);
    const [urlError, setUrlError] = useState<string | null>(null);

    // Hooks
    const [add]  = useMutation(ADD_EXTERNAL_DOCUMENT);
    const [edit] = useMutation(EDIT_EXTERNAL_DOCUMENT);

    // Functions
    const validateUrl = (v: string): string | null => {
        try {
            const parsed = new URL(v);
            if (!["http:", "https:"].includes(parsed.protocol)) return "URL must use http or https";
            return null;
        } catch { return "Invalid URL"; }
    };

    const handleSubmit = async () => {
        const err = validateUrl(url);
        if (err) { setUrlError(err); return; }

        const finalLabel = label.trim() || derivedLabelFromUrl(url);

        if (existingDocument) {
            await edit({ variables: { id: existingDocument.id, data: { url, label: finalLabel, hiddenFromMobile: hideOnMobile } } });
        } else {
            await add({ variables: { data: { referenceModel, referenceId, url, label: finalLabel, hiddenFromMobile: hideOnMobile } } });
        }
        onSaved();
    };

    return (
        // URL input, label input, "Hide on mobile" checkbox, Save / Cancel
        // Boolean shorthand props go at the bottom of JSX prop lists per CLAUDE.md
        ...
    );
};
```

## Step 10: Permissions Wiring

**No new permissions seeded.** All mutations gate on parent-entity edit access via `continueIfUserCanPerform(currentUserId, "job"|"project", "edit", referenceId)` (Step 4.5). This matches the spec ("same gate as adding a comment to that entity") and avoids any seed-data migration.

Read access is the standard list-permission flow — users who can read the parent Job/Project see the document list; the widget hides add/edit/remove controls when `canEdit === false` (Step 8.1).

## Step 11: Tests

### 11.1 · Backend unit tests

**Create file:** `apps/api/src/models/ExternalDocument.test.ts`

Cribbed from `apps/api/src/models/Comment.test.ts` (Prisma-mock pattern).

Required cases:

- **SSRF assertion (AC #4 — load-bearing):** spy on `fetch`, `axios.request`, `node:http.request`, `node:https.request`. Call `createItem({url: "http://attacker.example.com/", referenceModel: "Job", ...})` — assert none of the spies were called. Repeat on `editItem`. This test is what enforces the security invariant from the spec banner.
- **Allowlist validation (AC #12):** `createItem({referenceModel: "User", ...})` rejects with `BadRequestError`; `"Job"` and `"Project"` succeed.
- **URL format validation (AC #2):** `"not a url"`, `""` rejected.
- **URL scheme allowlist:** `"javascript:alert(1)"`, `"data:text/html,..."`, `"file:///etc/passwd"` rejected.
- **`sourceDomain` derivation (AC #3):** `createItem({url: "https://Contoso.SharePoint.com/sites/x"})` stores `sourceDomain === "contoso.sharepoint.com"`. Same on `editItem` URL re-validation.
- **Edit re-validates URL (AC #6):** `editItem(id, {url: "not-a-url"})` rejects.
- **Edit cannot change parent:** `editItem(id, {referenceModel: "Project", referenceId: "different"})` succeeds but the persisted row keeps the original parent (the override silently strips them).
- **Permission denial (AC #8):** stub `continueIfUserCanPerform` to throw `PermissionError` — assert `createItem` / `editItem` / `archiveItem` all reject.
- **Soft-delete (AC #7):** `archiveItem` sets `isArchived = true`, does not hard-delete the row.

### 11.2 · Frontend smoke tests

- `ExternalDocumentsWidget` renders empty state, loaded state, error state.
- Click on `IconEye` fires `editExternalDocument` mutation with the inverted `hiddenFromMobile` value; UI flips immediately (optimistic), reverts if mutation rejects.

## Open Questions to Confirm Before Coding

1. **Permission gate.** Spec says "same gate as adding a comment" but Comment uses role-based `Comment.create`, not parent-entity edit. AC #8 explicitly says parent-entity edit. Plan goes with parent-entity edit (`continueIfUserCanPerform("job"|"project", "edit")`). Confirm.
2. **Field resolvers vs top-level query.** Spec sketches `extend type Job/Project { externalDocuments }`; plan uses the top-level `externalDocuments(options)` query (matches `Comment` convention). Lower-risk, no Job/Project type changes. Confirm.
3. **URL scheme allowlist.** Plan rejects `javascript:` / `data:` / `file:` in addition to RFC-3986 violations. The spec only mentions RFC-3986 explicitly. The scheme block is anti-XSS belt-and-suspenders. Confirm.
4. **Edit form vs inline IconEye toggle.** Plan: inline IconEye is the *quick* visibility toggle (no form open); kebab "Edit" opens the form pre-filled for label / URL / visibility changes. Mobile uses tap-to-open and a separate edit affordance in the row's swipe action. Confirm shape.
5. **Top-level WO host page.** WO detail reuses the Job Overview tab (WO is a Job classification). If a separate WO detail tab structure exists outside the Job-derived layout, the widget mount needs an additional entry point — flag if so.
