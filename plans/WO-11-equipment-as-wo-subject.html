# WO-11: Equipment as Work Order Subject — Implementation Plan

## Overview

Introduce a first-class relationship between a Work Order (Job with `jobClassification = WorkOrder`) and the piece of equipment the work is being performed *on*. Surfaces every WO ever performed on a piece of equipment in a new "Work Orders" tab on the Equipment detail page (desktop & mobile) — the foundation of a per-asset service history.

**Estimated effort:** 2-3 days
**Risk:** Medium — new join table, Job mutation surface change, JobListFeed SQL view modification
**Spec:** `tm-work-orders-uis/wo-11-equipment-as-wo-subject.html`
**Requires:** WO-1 (Job classification), WO-3 (DataModelForm WO foundation), UIS-15E (Equipment QR — already done)
**Enables:** WO-12 (Maintenance ↔ Work Order Linkage)

---

## Decided — One equipment per WO (V1 product), m2m at data layer

**Naming note:** the spec calls this "subject equipment." Implementation uses the more generic `PerformedOn` / `ServiceHistory` naming so the data model and GraphQL surface don't have to be renamed when polymorphism arrives (Location, Vehicle, or other subject types). The UI keeps the customer-facing label `"Equipment Serviced"` per the spec mockups.

Per Chris's DB review (2026-05-08) and Emma's product call (2026-05-05): the relationship is **modeled as many-to-many** via a join table, but **capped at 1 non-deleted row per Job server-side** in V1. UI, GraphQL surface, and product behavior remain singular for V1. If product opens this up later, lifting the cap is a one-line change in the resolver/model — no table migration. The plural-shaped data model is the entire point: it lets us ship singular today without locking ourselves in.

---

## Step 1: Prisma Schema — JobPerformedOn Join Model

**File:** `apps/api/prisma/schema.prisma`

The join model mirrors the existing `WorkOrderEquipmentItem` pattern (line item join table) — same id format, same audit flags, same FK style, `onDelete: Cascade` on both sides.

```prisma
model JobPerformedOn {
    id         String   @id @db.VarChar(21)
    isDeleted  Boolean  @default(false)
    createdAt  DateTime @default(now())
    updatedAt  DateTime @default(now()) @updatedAt

    jobId String @db.VarChar(21)
    Job   Job    @relation("JobPerformedOnRecords", fields: [jobId], references: [id], onDelete: Cascade)

    equipmentId String    @db.VarChar(21)
    Equipment   Equipment @relation("EquipmentServiceHistory", fields: [equipmentId], references: [id], onDelete: Cascade)

    @@unique([jobId, equipmentId], map: "JobPerformedOn_jobId_equipmentId_key")
    @@index([jobId], map: "JobPerformedOn_jobId_idx")
    @@index([equipmentId], map: "JobPerformedOn_equipmentId_idx")
}
```

Add inverse relations on existing models:

```prisma
// On Job (alongside WorkOrderLaborItems / WorkOrderMaterialItems / WorkOrderEquipmentItems):
PerformedOn JobPerformedOn[] @relation("JobPerformedOnRecords")

// On Equipment (alongside Assignments / EquipmentTimeEntries):
ServiceHistory JobPerformedOn[] @relation("EquipmentServiceHistory")
```

## Step 2: Migration — Create JobPerformedOn Table

**Create file:** `apps/api/prisma/migrations/[timestamp]_wo_11_job_performed_on/migration.sql`

```sql
CREATE TABLE `JobPerformedOn` (
    `id` VARCHAR(21) NOT NULL,
    `isDeleted` BOOLEAN NOT NULL DEFAULT FALSE,
    `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
    `updatedAt` DATETIME(3) NOT NULL,
    `jobId` VARCHAR(21) NOT NULL,
    `equipmentId` VARCHAR(21) NOT NULL,
    PRIMARY KEY (`id`),
    UNIQUE INDEX `JobPerformedOn_jobId_equipmentId_key` (`jobId`, `equipmentId`),
    INDEX `JobPerformedOn_jobId_idx` (`jobId`),
    INDEX `JobPerformedOn_equipmentId_idx` (`equipmentId`),
    CONSTRAINT `JobPerformedOn_jobId_fkey` FOREIGN KEY (`jobId`)
        REFERENCES `Job`(`id`) ON DELETE CASCADE ON UPDATE CASCADE,
    CONSTRAINT `JobPerformedOn_equipmentId_fkey` FOREIGN KEY (`equipmentId`)
        REFERENCES `Equipment`(`id`) ON DELETE CASCADE ON UPDATE CASCADE
);
```

No data backfill required — the `JobPerformedOn` table starts empty. Existing WOs simply have no equipment serviced until an editor sets one. The DAA / DocumentModelForm seeding in Step 2.5 does the rest of the work required to make this table usable from the UI.

---

## Step 2.5: Migration — DAA + DocumentModelForm Seeding

**Same migration file as Step 2.** A field doesn't render on a DataModelForm just because a column exists — the UI is driven by `DocumentAttributeAssignment` rows attached to `DocumentSection` rows, which in turn get wired to `DocumentModelForm` rows via `DocumentModelFormElements`. All of this is per-classification: `equipment-serviced` must be seeded with `subModel = 'WorkOrder'` so it appears only on WorkOrder forms and never on ProjectJob forms.

Mirrors the pattern in `apps/api/prisma/migrations/20260409100000_work_order_daa_setup/migration.sql` (DocumentSections + DAAs for the WO subModel) and `apps/api/prisma/migrations/20260416000001_rfi_email_tweaks/migration.sql` (wiring a new DAA into CREATE / EDIT / SETTINGS forms).

### 2.5a. Find (do not create) the existing "Work Order Info" section

The WO subModel already has a `Work Order Info` DocumentSection from `20260409100000_work_order_daa_setup`. Use it — don't create a duplicate.

```sql
SET @workOrderInfoSectionId = (
    SELECT id FROM DocumentSection
    WHERE referenceModel = 'Job'
      AND subModel = 'WorkOrder'
      AND name = 'Work Order Info'
    LIMIT 1
);
```

### 2.5b. Insert the DAA — WorkOrder only

```sql
SET @equipmentServicedDaaId = LEFT(MD5(UUID()), 21);

INSERT INTO DocumentAttributeAssignment (
    id, createdAt, updatedAt,
    referenceModel, subModel,
    sectionId, orderNo, mobileSectionId, mobileOrderNo,
    defaultAttribute, defaultAttributeLabel, defaultAttributeType,
    defaultAttributeIsRequired, defaultAttributeIsDerived,
    slug, referenceColumn,
    isDeleted, isArchived
) VALUES (
    @equipmentServicedDaaId, NOW(), NOW(),
    'Job', 'WorkOrder',
    @workOrderInfoSectionId, 25, @workOrderInfoSectionId, 25,
    'performedOnEquipmentId', 'Equipment Serviced', 'objects',
    FALSE, FALSE,
    'equipment-serviced', 'performedOnEquipmentId',
    FALSE, FALSE
);
```

Key points:
- `subModel = 'WorkOrder'` — backstop so this DAA can never leak onto a ProjectJob form even if the frontend `jobClassification` JSX gate is removed.
- `orderNo: 25` — positions between Customer and Description (verify against the actual order numbers used by neighboring DAAs in the same section after the WO-3a migrations have shipped; adjust to land in the spec's mockup position).
- `defaultAttribute = 'performedOnEquipmentId'` and `referenceColumn = 'performedOnEquipmentId'` — wire the DAA to the virtual write-through field handled in Step 6.
- `defaultAttributeType = 'objects'` — matches the plural-shaped data model (m:n join table with V1 backend cap of 1). The form engine's default for `'objects'` is an array editor, but the `customFormControl["equipment-serviced"]` override (Step 11) renders a single combobox for V1 — so the DAA shape stays consistent with the data layer regardless of the visual cardinality. When product lifts the cap to many subjects per WO, only the custom form control + GraphQL surface change; the DAA type does not need a migration.
- `defaultAttributeIsDerived = FALSE` — the user edits this; it's not computed.
- `defaultAttributeIsRequired = FALSE` — per spec, the field is optional.

### 2.5c. Wire the DAA to the three WorkOrder DocumentModelForms

Look up the three `DocumentModelForm` rows for `(referenceModel = 'Job', subModel = 'WorkOrder')` and insert one `DocumentModelFormElements` row each. **The SETTINGS link uses `isDeleted = TRUE`** so admins can't reconfigure this system field from the Settings page; CREATE and EDIT links use `isDeleted = FALSE` so end users see the field on those forms.

```sql
-- CREATE form: visible to end users
INSERT INTO DocumentModelFormElements (
    id, createdAt, updatedAt,
    documentModelFormId, documentAttributeAssignmentId,
    isDeleted, isArchived
) VALUES (
    LEFT(MD5(UUID()), 21), NOW(), NOW(),
    (SELECT id FROM DocumentModelForm
       WHERE referenceModel = 'Job' AND subModel = 'WorkOrder' AND formType = 'CREATE'),
    @equipmentServicedDaaId,
    FALSE, FALSE
);

-- EDIT form: visible to end users
INSERT INTO DocumentModelFormElements (
    id, createdAt, updatedAt,
    documentModelFormId, documentAttributeAssignmentId,
    isDeleted, isArchived
) VALUES (
    LEFT(MD5(UUID()), 21), NOW(), NOW(),
    (SELECT id FROM DocumentModelForm
       WHERE referenceModel = 'Job' AND subModel = 'WorkOrder' AND formType = 'EDIT'),
    @equipmentServicedDaaId,
    FALSE, FALSE
);

-- SETTINGS form: present but turned off so admins don't see a toggle for this system field
INSERT INTO DocumentModelFormElements (
    id, createdAt, updatedAt,
    documentModelFormId, documentAttributeAssignmentId,
    isDeleted, isArchived
) VALUES (
    LEFT(MD5(UUID()), 21), NOW(), NOW(),
    (SELECT id FROM DocumentModelForm
       WHERE referenceModel = 'Job' AND subModel = 'WorkOrder' AND formType = 'SETTINGS'),
    @equipmentServicedDaaId,
    TRUE, FALSE
);
```

### 2.5d. Do NOT create a ProjectJob DAA

The `equipment-serviced` DAA is intentionally only seeded for `subModel = 'WorkOrder'`. No corresponding row is inserted for `subModel = 'ProjectJob'`. This is the structural guarantee that ProjectJob forms never render this field, regardless of any frontend changes.

## Step 5: JobPerformedOn GraphQL Resolver

**Create file:** `apps/api/src/graphql/models/JobPerformedOn.ts`

Type is exposed for completeness (lets other consumers introspect the join), but only `Query.jobPerformedOn` is exposed — no mutations. All writes go through the Job resolver.

**Forward-compat note:** the model name is intentionally generic (no `Equipment` in the name). Today the join row carries an `equipmentId`. If the product later wants polymorphic "performed-on" targets (a Location, a Vehicle, a system), the table picks up `referenceModel` / `referenceId` columns alongside or replacing `equipmentId` — no rename. The Equipment-side accessor `Equipment.ServiceHistory` stays valid; future `Location.ServiceHistory` / `Vehicle.ServiceHistory` resolvers slot in next to it.

```graphql
type JobPerformedOn {
    id: ID!
    jobId: String!
    Job: Job
    equipmentId: String!
    Equipment: Equipment
    createdAt: DateTime
}

extend type Query {
    jobPerformedOn(jobId: ID, equipmentId: ID): [JobPerformedOn]
}
```

Resolvers:

```typescript
Resolvers: {
    Job: (parent) =>
        prisma.job.findUnique({ where: { id: parent.jobId } }),
    Equipment: (parent) =>
        prisma.equipment.findUnique({ where: { id: parent.equipmentId } })
},
Query: {
    jobPerformedOn: (_, args, context) =>
        new JobPerformedOnModel().getList(
            {
                where: {
                    ...(args.jobId ? { jobId: args.jobId } : {}),
                    ...(args.equipmentId ? { equipmentId: args.equipmentId } : {}),
                    isDeleted: false
                }
            },
            context.userId()
        ).then(r => r.list)
}
```

Register in `apps/api/src/graphql/schema.ts` (4 places: import + Resolvers spread + Query spread + typeDefs) and export from `apps/api/src/graphql/models/index.ts`.

## Step 6: Extend Job — Write-Through performedOnEquipmentId

**File:** `apps/api/src/models/Job.ts`

`performedOnEquipmentId` arrives on the `createJob` / `editJob` input but is not a column on the `Job` table — it's a write-through to the `JobPerformedOn` join table. Per the existing Job pattern (e.g. `jobSiteSupervisorIds` at `Job.ts:1352`, `primaryContactId` strip at `Job.ts:1458-1467`), there is **no `modelFields` entry**. Instead, the field is destructured and deleted from the data object inside `customCreateItem` / `customEditItem` before the base Prisma write, then handled separately afterward.

### 6a. No modelFields entry needed

Do **not** add `performedOnEquipmentId` to `modelFields`. BaseModel does not have an `isVirtual` option — the convention is to manually strip non-column fields inside the custom hooks.

### 6b. Hook into customCreateItem / customEditItem

After the Job row is persisted, sync the `JobPerformedOn` row. The cap-of-1 is enforced by **soft-deleting all existing non-deleted rows for the job before inserting** — that way the resolver doesn't need to know what's already there.

```typescript
protected async customCreateItem(data, currentUserId) {
    const dataAny = data as any;
    const performedOnEquipmentId = dataAny.performedOnEquipmentId as string | null | undefined;
    delete dataAny.performedOnEquipmentId;

    const job = await super.customCreateItem(data, currentUserId);
    if (performedOnEquipmentId !== undefined) {
        await this.syncPerformedOnEquipment(job.id, performedOnEquipmentId, currentUserId);
    }
    return job;
}

protected async customEditItem(id, data, currentUserId) {
    const dataAny = data as any;
    const hasPerformedOnKey = "performedOnEquipmentId" in dataAny;
    const performedOnEquipmentId = dataAny.performedOnEquipmentId as string | null | undefined;
    delete dataAny.performedOnEquipmentId;

    const job = await super.customEditItem(id, data, currentUserId);
    if (hasPerformedOnKey) {
        await this.syncPerformedOnEquipment(id, performedOnEquipmentId ?? null, currentUserId);
    }
    return job;
}

private async syncPerformedOnEquipment(jobId: string, equipmentId: string | null, currentUserId: string) {
    // V1 cap of 1: soft-delete any existing non-deleted rows, then insert.
    await prisma.jobPerformedOn.updateMany({
        where: { jobId, isDeleted: false },
        data: { isDeleted: true }
    });
    if (equipmentId) {
        await new JobPerformedOnModel().createItem(
            { jobId, equipmentId },
            currentUserId
        );
    }
}
```

The `"performedOnEquipmentId" in dataAny` check on edit distinguishes "field absent from input → leave alone" from "field present with null → clear it." This matches the GraphQL semantic where omitted input fields should be no-ops.

### 6d. Wire performedOnEquipmentId into `Job.upsert`

`Job.upsert()` at `apps/api/src/models/Job.ts:2962` is what `DataModelForm` submissions route through (legacy `createJob` / `editJob` mutations also exist, but the form path goes through `upsert`). Two adjustments needed there:

**Add `performedOnEquipmentId` to the empty-string-to-null normalization list** at `Job.ts:2974-2987`:

```typescript
const nullableIdFields = [
    "projectId",
    "companyId",
    "locationId",
    "jobStatusId",
    "jobTypeId",
    "rateTypeId",
    "jobLeadId",
    "performedOnEquipmentId" // NEW — combobox clear sends "" instead of null
] as const;
```

Without this, clearing the equipment combobox in the form sends `""`, which would either fail an FK lookup (if accidentally typed as `string` not `string | null`) or insert an invalid empty value into `JobPerformedOn`. The list converts `""` → `null` so the customCreateItem/customEditItem hook treats it as "clear the link."

**No other change to `upsert` is needed.** The field flows through as part of `...restData` to either `createItem` (which calls `customCreateItem`) or `customEditItem` directly, and the destructure-then-`delete` pattern from 6b removes it from the Prisma payload. The `upsert` callback that handles `documentData` (DocumentAttributeValues) is irrelevant here because `performedOnEquipmentId` is stored in `JobPerformedOn`, not as a DAV.

**Why delete-then-insert rather than upsert:** the V1 cap is "at most one non-deleted row." Sweeping the existing rows enforces the cap as a side effect of every write, even if a future bug somehow created multiple rows.

### 6c. Validation

If a non-WorkOrder classification job tries to set `performedOnEquipmentId`, throw a clear validation error. The frontend should not present the field for ProjectJobs (Step 9), but the API guards against direct mutation.

```typescript
if (performedOnEquipmentId) {
    const classification = await this.getJobClassification(data.jobTypeId ?? existingJob.jobTypeId);
    if (classification !== "WorkOrder") {
        throw new Error("performedOnEquipmentId is only valid for jobs with WorkOrder classification");
    }
}
```

## Step 7: Extend Job GraphQL — performedOnEquipment field + input

**File:** `apps/api/src/graphql/models/Job.ts`

```graphql
type Job {

```

The **singular** `performedOnEquipmentId` / `PerformedOnEquipment` fields are what the UI consumes in V1. The raw join-row accessor `PerformedOnRecords` is kept available for future product changes (or admin debugging) — its name is target-agnostic, so it stays valid when polymorphism lands (the rows would simply carry `referenceModel` / `referenceId` instead of, or alongside, `equipmentId`).

### 7b. Add field-level resolvers

```typescript
// In Job Resolvers:
performedOnEquipmentId: async (parent) => {
    const row = await prisma.jobPerformedOn.findFirst({
        where: { jobId: parent.id, isDeleted: false },
        select: { equipmentId: true }
    });
    return row?.equipmentId ?? null;
},
PerformedOnEquipment: async (parent) => {
    const row = await prisma.jobPerformedOn.findFirst({
        where: { jobId: parent.id, isDeleted: false },
        select: { equipmentId: true }

    if (!row) return null;
    return prisma.equipment.findUnique({ where: { id: row.equipmentId } });
},
PerformedOnRecords: (parent) =>
    prisma.jobPerformedOn.findMany({
        where: { jobId: parent.id, isDeleted: false }
    })
```

### 7c. Extend CreateJob and EditJob inputs

```graphql
input CreateJob {
    # ...existing fields
    performedOnEquipmentId: String
}

input EditJob {
    # ...existing fields
    # null clears the link; a value replaces the single row.
    performedOnEquipmentId: String
}
```

No new mutations. `createJob` and `editJob` carry the field through to `JobModel.customCreateItem` / `customEditItem` (Step 6).

## Step 8: Extend Equipment GraphQL — ServiceHistory field

**File:** `apps/api/src/graphql/models/Equipment.ts`

### 8a. Add to Equipment type

```graphql
type Equipment {
    # ...existing fields
    ServiceHistory(isCompleted: Boolean, take: Int, skip: Int): [Job]
}
```

`ServiceHistory` reads as the canonical domain concept ("RTU-3's service history") and is target-agnostic — when polymorphism lands, `Location.ServiceHistory` / `Vehicle.ServiceHistory` slot in with the same semantics.

### 8b. Add field-level resolver

```typescript
// In Equipment Resolvers:
ServiceHistory: async (parent, args) => {
    const joinRows = await prisma.jobPerformedOn.findMany({
        where: {
            equipmentId: parent.id,
            isDeleted: false,
            Job: { isDeleted: false }
        },
        select: { jobId: true },
        take: args.take,
        skip: args.skip
    });
    const jobIds = joinRows.map(r => r.jobId);
    if (jobIds.length === 0) return [];
    return prisma.job.findMany({
        where: { id: { in: jobIds } },
        orderBy: { createdAt: "desc" }
    });
}
```

**Note:** This field is fine for low-volume per-equipment lookups (the Equipment detail page Work Orders tab). For the desktop ListTable view with sorting/filtering/pagination, use the JobListFeed view extension in Step 9 — `ServiceHistory` is the "give me the chronological list" simple path.

## Step 9: JobListFeed SQL View — Surface performedOnEquipmentId

**File:** `apps/api/prisma/views/JobListFeed.sql`

The WO list page (and the Equipment detail Work Orders tab desktop view) both route through `JobListFeed`. Surface `performedOnEquipmentId` and the equipment name as derived columns so the Equipment Serviced column is sortable / filterable through the existing TableFeed plumbing.

### 9a. Update the view

Left-join `JobPerformedOn` and `Equipment`, project the two columns. The join is left so jobs without equipment serviced still appear.

```sql
-- In JobListFeed.sql, add to the SELECT list:
,
(
    SELECT jse.equipmentId
    FROM JobPerformedOn jse
    WHERE jse.jobId = Job.id AND jse.isDeleted = FALSE
    LIMIT 1
) AS performedOnEquipmentId,
(
    SELECT e.name
    FROM JobPerformedOn jse
    LEFT JOIN Equipment e ON e.id = jse.equipmentId
    WHERE jse.jobId = Job.id AND jse.isDeleted = FALSE
    LIMIT 1
) AS performedOnEquipmentName
```

The correlated subquery form keeps the V1 cap of 1 implicit. When the product cap is lifted, both subqueries need to change to `GROUP_CONCAT` or a separate flatten — but for V1 the singular case is the contract.

### 9b. Apply view update

Run `pnpm run prisma:updateViews` — no migration file needed for view changes per project conventions.
