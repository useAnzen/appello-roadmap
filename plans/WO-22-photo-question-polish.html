# WO-22: Mobile Photo Question — Polish — Implementation Plan

## Overview

Bring the PHOTO question type up to the polish bar the rest of the platform has reached: 2-column thumbnails (was 4-column), captions on each photo, min/max enforcement, swipe / large-X delete with confirm, action-sheet camera/gallery picker, EXIF / GPS capture, and a per-question config card in the desktop form builder. Universal Asset additions — `caption`, `gpsLatitude`, `gpsLongitude`, `capturedAt` — pay for themselves immediately (photo answers) and become free leverage everywhere Assets are surfaced (equipment files, drawings, signature stamps, etc.).

**The polish lands on the existing `AssetViewer` components — `apps/frontend/src/components/AssetViewer/AssetViewer.tsx` and `apps/mobile/src/components/AssetsViewer/AssetViewer.tsx` (the latter is the path the user pointed at; note the plural directory).** Both already cover 9-11 polymorphic `ReferenceTable` options including `Answer`, both already handle confirm-before-delete, both already mount `<FileUpload>` with their app's local `useCreateAssetMutation` / `useEditAssetMutation` / `useGetAssetLazyQuery` / `useGetUploadUrlQuery`. The mobile viewer is already 2-col on small screens (line 784: `grid-cols-2 md:grid-cols-3`) and already passes `imageCompression={true}` to `<FileUpload>`. What's missing is the photo-specific polish — captions, min/max counter, action-sheet add CTA, GPS badge, EXIF capture toggle. We add those as new props on the existing components rather than building a parallel component.

**`PhotoQuestionType` becomes a thin wrapper** that mounts the mobile `<AssetViewer />` with `referenceTable="Answer"`, `referenceId={answer.id}`, `type="image"`, and the photo-config props forwarded from `Question.config`. No new shared component in `packages/ui`. No graphql-binding injection.

**Per-question config rides on the existing `Question.config` JSON field** (the established convention used by Conditional, Multiselect, Equipment, and Person question types — see `Question.ts:95-101` and the consumers in `apps/frontend/src/components/Forms/QuestionnaireForm/QuestionTypes/`). **No new columns on `Question`** — deliberate divergence from the spec's "5 new SafetyFormQuestion columns" sketch in favor of the convention every other configurable question type already uses. Spec author flagged this section as an "implementation-plan call" so the choice belongs here, not in the spec.

Server-side compression / 30-day original retention is layered onto the existing `AssetSize` pipeline (`AssetSizeDetails` in `apps/api/src/types/Asset.types.ts`, resize via `EdgeFunction.assetResize`) plus a new daily cron in the `maintenanceReminderJob.ts` style. PDF export keeps the EXIF strip default the spec calls out.

**Estimated effort:** 2-3 days — back down from the 3-4 day generic-component estimate now that we're enhancing two existing components in place instead of extracting a third
**Risk:** Medium — touches Asset model (used by every upload path), introduces a cron, modifies two viewers that are mounted across most upload surfaces in both apps, adds a form-builder config card. Because the viewers are already on most surfaces, the polish appears for free on existing flows the moment a surface opts in to the new props.
**Spec:** `tm-work-orders-uis/wo-22-photo-question-polish.html`
**Requires:** existing forms infra (`Question`, `Answer`, `Asset`, `AssetReference`, `AssetSize`, `FileUpload`, both `AssetViewer`s, `QuestionFormDetails` workflow, `QuestionnaireAddEditForm` builder) — all already shipped
**Enables:** WOX-19 voice-to-report can hang off the polished capture surface; future photo annotation; surfaces already on `AssetViewer` can opt in to the polish one prop at a time

## Decided — config in `Question.config` JSON, Asset additions are universal columns

**Enhance the existing `AssetViewer` components in place — do not build a new shared component.** Both apps already have a polymorphic `AssetViewer` (`apps/frontend/.../AssetViewer/AssetViewer.tsx` and `apps/mobile/.../AssetsViewer/AssetViewer.tsx`) wired to 9-11 reference tables including `Answer`. Mobile is already 2-col, already does confirm-before-delete, already passes `imageCompression={true}` to `<FileUpload>`. The polish (captions on thumbs, min/max counter, action-sheet add CTA, GPS badge, EXIF capture/strip) lands as new optional props on both viewers. **`PhotoQuestionType` retires its inline `FileUpload` + `ImageList` plumbing and instead mounts `<AssetViewer referenceTable="Answer" referenceId={answer.id} type="image" {...photoConfig} />`.** Other surfaces already using either viewer get the polish automatically the moment they pass the new props; surfaces still on raw `FileUpload` migrate by swapping to their app's local `AssetViewer`. Each app's viewer keeps its own GraphQL hooks from the local `generated` module — no `packages/ui` lift, no binding injection.

**Photo-question settings live in `Question.config` (JSON), NOT new columns on `Question`.** The model already has `config String? @db.Text` (`schema.prisma:1310`) with a `maxLength: 500` validator (`Question.ts:95-101`). It is the established home for per-question-type configuration — Conditional stores `{ continueLabel, skipLabel, continueAllow, skipAllow }`, Multiselect stores `{ multiselectLogic }`, Equipment stores `{ equipmentHasOther }`, Person stores `{ personHasOther }`. Photo joins the same pattern with `{ photoMin, photoMax, captionMode, allowGalleryImport, storeExif }` — ~150 chars of JSON, well under the 500 cap. **Zero schema change on `Question`. No migration. No downstream type churn.** Spec called the column placement an "implementation-plan call"; this is that call.

**Asset additions are universal columns, not JSON.** `caption`, `gpsLatitude`, `gpsLongitude`, `capturedAt` apply to every Asset (equipment files, drawings, signature stamps, photos in any context), not just photo-question answers — exactly as the spec's Decided callout states. Direct columns let us index GPS and filter / sort by `capturedAt` cheaply, and they're not behind a question-type gate. A single `Asset` migration adds the four columns + one composite index on GPS.

**`PhotoQuestionType` already exists in `packages/ui/src/components/SafetyFormQuestions/PhotoQuestionType.tsx`** — the spec's "extract from QAForm.tsx inline switch" line was based on a stale snapshot. The component is mounted from `packages/ui/src/components/SafetyFormWorkflow/QuestionFormDetails.tsx:613` for both `PHOTO` and `FILE` types. This plan **enhances the existing component in `packages/ui` rather than creating a parallel mobile-only file** — the renderer is already shared, so the polish carries to every consumer (mobile QA, preview, any future surface).

**Caption-mode const lives in `packages/shared-utils`.** Cross-app source-of-truth for `OFF | OPTIONAL | REQUIRED` so the mobile renderer, form-builder config card, server validator, and TS types all read the same literal. Same pattern as `AssetSizeNames` in `apps/api/src/types/Asset.types.ts` but exported from `shared-utils` because it's consumed in both `apps/api` and the frontend / mobile apps.

**Server-side compression layers onto the existing `AssetSize` pipeline.** `Asset.resizeImages()` (`apps/api/src/models/Asset.ts:1356-1418`) already creates named sizes via `EdgeFunction.assetResize` driven by `AssetSizeDetails`. We add **no new resize step at upload time** — the existing `default` (750w jpg) is already well under 2MB for any field-captured photo. The "compress to 2MB" requirement becomes a **purge of the `original` `AssetSize` row + S3 object** 30 days after upload, leaving `default` / `default_webp` as the served sizes. Implemented as a new `assetOriginalPurgeJob.ts` in the `apps/api/src/helpers/` directory, started in `application.ts` next to `startMaintenanceReminderJob`.

**No new GraphQL mutations.** `createAsset` / `editAsset` (`apps/api/src/graphql/models/Assets.ts:120-121`) already exist and accept arbitrary asset fields through the standard BaseModel path — the four new columns become accepted inputs as soon as `modelFields` and the GraphQL `Asset` type pick them up. `upsertManyAnswers` (`apps/api/src/graphql/models/Answer.ts:79`) is where photoMin server-side enforcement lands as a single validator call before delegating to the model.

**No frontend `Question` schema changes.** The form builder already passes `config` as a freeform object through `setFormValues(...formValues, config: { ... })` and the editor reads it back via `formValues.config?.xxx` (see `MultiselectQuestionType.tsx:58`). The new `PhotoQuestionType.tsx` config card slots into the same pattern with zero plumbing.

## Step 1: Caption-Mode Const + Photo Config Shape

**File:** `packages/shared-utils/src/types/PhotoConfig.ts` (NEW)

Single source-of-truth for the photo-config keys + caption-mode literal. Imported by both `AssetViewer`s (desktop + mobile) as a prop bag, by `PhotoQuestionType` to parse `Question.config`, by the form-builder config card, and by the API validator.

```typescript
export const CaptionModes = ["OFF", "OPTIONAL", "REQUIRED"] as const;
export type CaptionMode = (typeof CaptionModes)[number];

export const PHOTO_MAX_CEILING = 25;          // hard ceiling enforced in builder + API
export const PHOTO_DEFAULT_MAX = 10;

/**
 * Optional photo-specific behaviour for <AssetViewer />. Every field is optional
 * with sensible defaults; a viewer not opting in keeps today's behaviour.
 */
export interface IPhotoConfig {
    photoMin?: number;
    photoMax?: number;
    captionMode?: CaptionMode;
    allowGalleryImport?: boolean;
    storeExif?: boolean;
}

/**
 * The SafetyForm PHOTO question stores config of the same shape on Question.config.
 * Alias rather than a divergent type so the wrapper passes config through unchanged.
 */
export type IPhotoQuestionConfig = IPhotoConfig;
```

Export from `packages/shared-utils/src/types/index.ts` (or wherever the package barrel lives — match neighbours).

Why one file: keeps the const list, the type, and the ceiling/default in lockstep so a future bump (e.g. ceiling to 50) is one edit. Aliasing `IPhotoQuestionConfig` to `IPhotoConfig` means a future hypothetical "questions need a setting other AssetViewer consumers don't" only has to break the alias once.

## Step 2: Prisma Schema — Asset Additions Only

**File:** `apps/api/prisma/schema.prisma` (Asset model at lines 1048-1110)

Four new nullable columns on `Asset` + one composite index. No changes to `Question`, `Answer`, `AssetReference`, `AssetSize`.

```prisma
model Asset {
    // ...existing fields (lines 1049-1102)

    caption       String?   @db.VarChar(500)
    gpsLatitude   Decimal?  @db.Decimal(10, 7)
    gpsLongitude  Decimal?  @db.Decimal(10, 7)
    capturedAt    DateTime?

    // ...existing indexes (lines 1104-1109)
    @@index([gpsLatitude, gpsLongitude], map: "Asset_gps_idx")
}
```

Why `VarChar(500)` for caption: matches `Question.description`-style caps and is plenty for a one-line "north wall · cracked grout" caption. Why `Decimal(10, 7)` for GPS: 7 decimal places resolves to ~1cm, the standard for geo-coordinate storage; 10 total digits covers the full ±180.0000000 range.

Why nullable on all four: existing Assets have no captions and no GPS history; null is the natural "unset" sentinel. No backfill needed.

**`originalPurgedAt` column for the cron** — added as part of the same Asset block. Stores when the cron last removed the `original*` AssetSize rows for this asset; lets the cron skip already-processed assets cheaply and gives audit visibility into the purge.

```prisma
originalPurgedAt DateTime?
```

## Step 7: Photo-Answer Validation in `upsertManyAnswers`

**File:** `apps/api/src/graphql/models/Answer.ts` (resolver at lines 173-200, mutation at line 79)

Photo-question constraints (`photoMin`, `photoMax`, `captionMode = REQUIRED`) are enforced at the **answer-save boundary**, not the asset-upload boundary. Reason: an Asset is the universal building block; the per-question rules are not the Asset's concern. Validation lives where the question + answers come together — the upsertManyAnswers path that mobile submits on form completion.

### 7a. Resolver-side guard

Add a private validator (e.g. `apps/api/src/models/Answer.ts` — `assertPhotoQuestionAnswerValid`) called from `Answer.upsertItem` / `Answer.upsertManyItems` for each row whose related `Question.type.name === "PHOTO"`.

```typescript
private async assertPhotoQuestionAnswerValid(
    questionId: string,
    answerAssetIds: string[],
    currentUserId: string
): Promise<void> {
    const question = await prisma.question.findUnique({
        where: { id: questionId },
        select: { config: true, type: { select: { name: true } } }
    });
    if (question?.type.name !== "PHOTO") return;

    const config: IPhotoQuestionConfig = question.config
        ? JSON.parse(question.config)
        : {};
    const min = config.photoMin ?? 0;
    const max = config.photoMax ?? PHOTO_DEFAULT_MAX;

    if (answerAssetIds.length < min) {
        throw new BadRequestError(
            `Photo question requires at least ${min} photo${min === 1 ? "" : "s"} — received ${answerAssetIds.length}.`,
            { questionId }
        );
    }
    if (answerAssetIds.length > max) {
        throw new BadRequestError(
            `Photo question accepts at most ${max} photo${max === 1 ? "" : "s"} — received ${answerAssetIds.length}.`,
            { questionId }
        );
    }
    if (config.captionMode === "REQUIRED" && answerAssetIds.length > 0) {
        const missingCaption = await prisma.asset.count({
            where: {
                id: { in: answerAssetIds },
                OR: [{ caption: null }, { caption: "" }]
            }
        });
        if (missingCaption > 0) {
            throw new BadRequestError(
                `Photo question requires a caption on every photo (${missingCaption} missing).`,
                { questionId }
            );
        }
    }
}
```

### 7b. Wire it into upsertManyAnswers

`upsertManyAnswers` resolver delegates to `new Answer().upsertManyItems(args.data, context.userId())` — the per-row validator runs inside that path before the answer write.

Why server-side enforcement matters: the mobile renderer enforces the rules at the UX layer (Add CTA disabled at max, save blocked below min) but a defensive server gate prevents bad data via direct API calls, queue replays, or future surfaces.

### 7c. Error payload identifies the question

`BadRequestError`'s second arg is the structured payload (existing house pattern — e.g. `BadRequestError("message", { questionId })`). The frontend uses `error.extensions.questionId` to jump to / highlight the offending question. Mirror the shape mobile expects when it surfaces the inline error ("Question 4 needs 2 more photos").

## Step 8: Enhance Mobile `AssetsViewer` with Photo Polish Props

**File:** `apps/mobile/src/components/AssetsViewer/AssetViewer.tsx` (existing, 954 lines)

Add optional photo-polish props to the existing component. Every new prop is optional with safe defaults so existing mounts (mobile expense, notes, certifications, etc.) keep today's behaviour until they opt in.

### 8a. Extend the props interface

Add five fields from `IPhotoConfig` plus a small handful of UX flags. Spread the shared type into the existing `AssetViewerProps`:

```typescript
import { IPhotoConfig, PHOTO_DEFAULT_MAX } from "@useanzen/shared-utils";

interface AssetViewerProps extends IPhotoConfig {
    // ...existing props (lines 72-203)

    /** Show "M of N minimum" badge above the grid. Auto-shown when photoMin > 0. */
    showMinCounter?: boolean;
    /** Camera-only mode skips the action sheet on Add. Default: derived from allowGalleryImport. */
    cameraOnly?: boolean;

Why bolt onto `AssetViewerProps` rather than a wrapping `<PhotoSection>`: every consumer of `AssetViewer` already controls the `maxUploadFiles` / `type="image"` props. The new fields fit the same shape.

### 8b. Apply `photoMax` to FileUpload's `maxUploadFiles`

Today: `maxUploadFiles = 8` default (line 225) → passed straight to `<FileUpload>` (line 934). Update so an explicit `photoMax` wins:

```typescript
const effectiveMax = photoMax ?? maxUploadFiles ?? PHOTO_DEFAULT_MAX;
// later passed to <FileUpload maxUploadFiles={effectiveMax} />
```

When `assets.length >= effectiveMax`, disable the upload trigger and the `<FileUpload>` itself (the component already exposes a disabled / blocked state via `setIsUploadDisabled` at line 267).

### 8c. Min-counter badge

Above the grid (above the `{assets && assets.length > 0 ? (...)}` block at line 742), render the badge when `photoMin > 0` or `showMinCounter === true`:

```tsx
{(showMinCounter ?? (photoMin ?? 0) > 0) && (
    <div className={new ClassNames("px-3 py-2 text-xs font-semibold")
        .if(assets.length < (photoMin ?? 0), "text-on-warning-light bg-warning-light")
        .if(assets.length >= (photoMin ?? 0) && assets.length < effectiveMax, "text-on-success-light bg-success-light")
        .if(assets.length >= effectiveMax, "text-on-info-light bg-info-light")
        .list()}>
        {assets.length} of {photoMin ?? 0} minimum
    </div>
)}
```

Use semantic colour classes per the CLAUDE.md "Colors" guideline (no `bg-amber-50` / `bg-green-100`).

### 8d. Caption strip + editor on each thumbnail

Pass `captionMode` and `updateAsset` into `<FileAsset>` (the per-tile component at `apps/mobile/.../AssetsViewer/FileAsset.tsx`). The tile renders an overlay caption strip across the bottom of the image (when `type === "image"` and `captionMode !== "OFF"`).

Tap the caption strip → opens an inline editor in a flyout (`useFlyout` is already imported at line 31). The editor uses `<FormControl type="text" maxLength={500}>` from the app's local `_FormControls`. On save, fire `updateAsset({ id, caption })` (the existing `useEditAssetMutation` import at line 31 already supplies it). Tap-out reverts.

When `captionMode === "REQUIRED"`, the viewer exposes a new `isValid()` method on its forwardRef:

```typescript
useImperativeHandle(ref, () => ({
    // ...existing methods (addFile, performUpload, browseFiles, removeFiles, clearAssets)
    isValid(): boolean {
        if (captionMode !== "REQUIRED") return true;
        return assets.every((a) => /* hydrated asset has non-empty caption */);
    }
}));
```

Parents (`PhotoQuestionType` and any other surface) call `viewerRef.current?.isValid()` from their own submit gates.

### 8e. GPS badge on each thumbnail

When `storeExif === true` and the hydrated Asset has non-null `gpsLatitude` / `gpsLongitude`, render a small pin badge in the top-left of the tile (`<FileAsset>` again). Tooltip shows the lat/long.

### 8f. Action sheet on Add (camera vs gallery)

The existing `<FileUpload>` opens the device's default picker. Wrap the Add trigger in an action sheet (existing `Dropdown` / bottom-sheet primitive in `@useanzen/ui`) when `allowGalleryImport !== false` AND `cameraOnly !== true`:

- "Camera" → `uploaderRef.current?.browseFiles({ capture: "environment" })` (FileUpload already supports forwarding `capture`)
- "Choose from Gallery" → `uploaderRef.current?.browseFiles()`
- "Cancel"

When `allowGalleryImport === false` OR `cameraOnly === true`, skip the sheet and call the camera-capture path directly. Pass `portalId="dialog-portal"` per CLAUDE.md.

### 8g. EXIF parse / strip on upload

In the `onComplete` handler at line 899 (where the uploaded asset arrives), if `storeExif === true`, parse EXIF from the uploaded file (`exifr` or the equivalent already vendored — confirm during implementation, fall back to `exif-js`) and call `updateAsset({ id: asset.id, gpsLatitude, gpsLongitude, capturedAt })` to persist. If `storeExif === false`, no-op — never persist EXIF.

## Step 14: Daily Cron — Purge Originals After 30 Days

**File:** `apps/api/src/helpers/assetOriginalPurgeJob.ts` (NEW)

Mirror the `maintenanceReminderJob.ts` pattern (`apps/api/src/helpers/maintenanceReminderJob.ts`):

```typescript
import prisma from "../models/_prismaClient";
import { S3Client, DeleteObjectCommand } from "@aws-sdk/client-s3";
import { AssetSizeNames } from "../types/Asset.types";

const HOUR_MS = 60 * 60 * 1000;
const RETENTION_DAYS = 30;

async function runOnce(): Promise<void> {
    const cutoff = new Date(Date.now() - RETENTION_DAYS * 24 * HOUR_MS);

    const candidates = await prisma.asset.findMany({
        where: {
            createdAt: { lt: cutoff },
            originalPurgedAt: null,
            AssetSizes: { some: { sizeName: { startsWith: "original" } } }
        },
        select: { id: true },
        take: 200  // batched to avoid runaway memory on first activation
    });

    for (const { id } of candidates) {
        await purgeOriginalsForAsset(id);
    }
}

async function purgeOriginalsForAsset(assetId: string): Promise<void> {
    const originalSizes = await prisma.assetSize.findMany({
        where: {
            assetId,
            sizeName: { startsWith: "original" }
        }
    });

    const s3 = new S3Client({/* same config as Asset.ts:42-48 */});

    for (const size of originalSizes) {
        try {
            await s3.send(new DeleteObjectCommand({
                Bucket: size.bucket,
                Key: size.key
            }));
        } catch (err) {
            console.error(`Failed to delete S3 object for AssetSize ${size.id}`, err);
            // continue — soft-delete the row even if S3 delete fails; nightly retry
        }
        await prisma.assetSize.update({
            where: { id: size.id },
            data: { isDeleted: true }
        });
    }

    // Repoint Asset.url to the largest remaining size (default > thumbnail).
    const remaining = await prisma.assetSize.findFirst({
        where: { assetId, isDeleted: false },
        orderBy: { width: "desc" }
    });

    await prisma.asset.update({
        where: { id: assetId },
        data: {
            originalPurgedAt: new Date(),
            url: remaining?.url ?? undefined
        }
    });
}

export function startAssetOriginalPurgeJob(): void {
    const tick = () => {
        runOnce().catch((err) => console.error("[assetOriginalPurgeJob]", err));
    };
    tick();
    setInterval(tick, 24 * HOUR_MS);
}
```

**Wire it up in `apps/api/src/application.ts`** next to the existing `startMaintenanceReminderJob(rootUser.id)` call (line 601):

```typescript
import { startAssetOriginalPurgeJob } from "./helpers/assetOriginalPurgeJob";

// in bootstrap, near line 601:
startAssetOriginalPurgeJob();
```

Why batched (`take: 200`): first activation will scan every Asset older than 30 days. Capping at 200 per tick keeps the job's S3 / DB load predictable; the daily cadence chews through any backlog inside a few days.

Why `originalPurgedAt` instead of just relying on `AssetSize.isDeleted`: the column is on the cheap-to-query side (Asset) and lets the cron's `where` clause short-circuit without joining AssetSize. Also gives an audit trail on the Asset itself.

Why update `Asset.url`: existing consumers read `Asset.url` as the canonical pointer; after purge it must point at a still-existing size.
