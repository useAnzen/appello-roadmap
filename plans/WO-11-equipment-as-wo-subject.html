# WO-11: Equipment as Work Order Subject — Implementation Plan

## Overview

Introduce a first-class relationship between a Work Order (Job with `jobClassification = WorkOrder`) and the piece of equipment the work is being performed *on*. Surfaces every WO ever performed on a piece of equipment in a new "Work Orders" tab on the Equipment detail page (desktop & mobile) — the foundation of a per-asset service history.

**Estimated effort:** 2-3 days
**Risk:** Medium — new join table, Job mutation surface change, JobListFeed SQL view modification
**Spec:** `tm-work-orders-uis/wo-11-equipment-as-wo-subject.html`
**Requires:** WO-1 (Job classification), WO-3 (DataModelForm WO foundation), UIS-15E (Equipment QR — already done)
**Enables:** WO-12 (Maintenance ↔ Work Order Linkage)

---

## Decided — Polymorphic from day one, one entity per WO (V1 product), m2m at data layer

**Polymorphic reference, not an Equipment FK.** The join row carries `workedOnReferenceModel` (e.g. `"Equipment"`) + `workedOnReferenceId` (the target row's id) instead of a hard `equipmentId` FK. **Deliberate divergence from house convention**: the ~20 existing polymorphic tables in `schema.prisma` (`Attributes`, `NoteReferences`, `Audit`, `AnswerModelMap`, `MaintenanceThreshold`, etc.) all use the bare `referenceModel @db.VarChar(50)` + `referenceId @db.VarChar(21)` pair. The WO-11 plan prefixes with `workedOn` for **clarity-at-a-glance** — the column names read the semantic relation in a single token, which matters more on `Job` (already a wide table with many other reference-like fields like `jobTypeId`, `jobLeadId`, `jobStatusId`) than it does on a narrow polymorphic join table like `Audit` or `Attributes`. The data shape and the no-FK trade-off are identical to those precedents; only the names differ.

**Trade-off:** no FK enforcement on the join row. The downstream cost is that orphan join rows are possible if a referenced row is hard-deleted (an Equipment row removed from the DB will leave the `JobPerformedOn` row pointing at a non-existent id). Mitigations: (a) the application path soft-deletes Equipment via `BaseModel.deleteItem` (which sets `isDeleted = true` — verified at `_DbModelBase.ts` line ~2065), so the row stays around and the polymorphic resolver still finds it; (b) the field resolvers (Step 7b, Step 8b) treat "not found" as `null` rather than throwing, so the UI degrades gracefully; (c) a future cleanup job can sweep orphan join rows if needed. The win is target-agnosticism at the data layer — every existing polymorphic table in the schema lives with this same trade-off and it's been net-positive.

**No `ServiceHistory` Prisma relation on Equipment.** Polymorphic references can't be declared as Prisma `@relation`s, so `Equipment.ServiceHistory` is a **field-level GraphQL resolver only** — it queries `JobPerformedOn` with `where: { workedOnReferenceModel: "Equipment", workedOnReferenceId: parent.id }`. Same pattern future `Location.ServiceHistory` / `Vehicle.ServiceHistory` resolvers will follow.

**Cardinality.** Per Chris's DB review (2026-05-08) and Emma's product call (2026-05-05): the relationship is **modeled as many-to-many** via a join table, but **capped at 1 non-deleted row per Job server-side** in V1. UI, GraphQL surface, and product behavior remain singular for V1. If product opens this up later, lifting the cap is a one-line change in the resolver/model — no table migration. The plural-shaped data model is the entire point: it lets us ship singular today without locking ourselves in.

**Naming.** The UI label stays `"Equipment Serviced"` per the spec mockups; the GraphQL convenience field stays `PerformedOnEquipment` for V1; the polymorphic data-layer columns are `workedOnReferenceModel` / `workedOnReferenceId`. When future subject types land, additional convenience GraphQL fields slot in (`PerformedOnLocation`, etc.) — none of the existing surfaces rename.

## Step 1: Prisma Schema — JobPerformedOn Join Model

**File:** `apps/api/prisma/schema.prisma`

The join model is polymorphic on the worked-on side: `workedOnReferenceModel` + `workedOnReferenceId` instead of a hard FK to `Equipment`. The `workedOn` prefix is a deliberate divergence from the bare `referenceModel` / `referenceId` shape used by `Attributes`, `NoteReferences`, `Audit`, etc. — chosen for clarity-at-a-glance (see the Decided callout above). The column lengths match the house convention: `VARCHAR(50)` for the model name, `VARCHAR(21)` for the id. Job side stays a hard FK with `onDelete: Cascade` since `Job` is the only parent.

```prisma
model JobPerformedOn {
    id         String   @id @db.VarChar(21)
    isDeleted  Boolean  @default(false)
    createdAt  DateTime @default(now())
    updatedAt  DateTime @default(now()) @updatedAt

    jobId String @db.VarChar(21)
    Job   Job    @relation("JobPerformedOnRecords", fields: [jobId], references: [id], onDelete: Cascade)

    // Polymorphic pointer — no Prisma @relation, no FK constraint.
    // V1: workedOnReferenceModel = "Equipment" only.
    workedOnReferenceModel String @db.VarChar(50)
    workedOnReferenceId    String @db.VarChar(21)

    @@unique([jobId, workedOnReferenceModel, workedOnReferenceId], map: "JobPerformedOn_jobId_reference_key")
    @@index([jobId], map: "JobPerformedOn_jobId_idx")
    @@index([workedOnReferenceModel, workedOnReferenceId], map: "JobPerformedOn_reference_idx")
}
```

Add the inverse relation on `Job` only — `Equipment` does **not** get a Prisma relation because the join's worked-on side is polymorphic (Prisma can't model polymorphic relations).

```prisma
// On Job (alongside WorkOrderLaborItems / WorkOrderMaterialItems / WorkOrderEquipmentItems):
PerformedOn JobPerformedOn[] @relation("JobPerformedOnRecords")

// On Equipment — NO Prisma relation added. Service history is reached via the
// `Equipment.ServiceHistory` field-level GraphQL resolver (Step 8), which
// queries JobPerformedOn with workedOnReferenceModel = "Equipment".
```

## Step 2: Migration — Create JobPerformedOn Table

**Create file:** `apps/api/prisma/migrations/[timestamp]_wo_11_job_performed_on/migration.sql`

```sql
CREATE TABLE `JobPerformedOn` (
    `id` VARCHAR(21) NOT NULL,
    `isDeleted` BOOLEAN NOT NULL DEFAULT FALSE,
    `createdAt` DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
    `updatedAt` DATETIME(3) NOT NULL,
    `jobId` VARCHAR(21) NOT NULL,
    `workedOnReferenceModel` VARCHAR(50) NOT NULL,
    `workedOnReferenceId` VARCHAR(21) NOT NULL,
    PRIMARY KEY (`id`),
    UNIQUE INDEX `JobPerformedOn_jobId_reference_key`
        (`jobId`, `workedOnReferenceModel`, `workedOnReferenceId`),
    INDEX `JobPerformedOn_jobId_idx` (`jobId`),
    INDEX `JobPerformedOn_reference_idx`
        (`workedOnReferenceModel`, `workedOnReferenceId`),
    CONSTRAINT `JobPerformedOn_jobId_fkey` FOREIGN KEY (`jobId`)
        REFERENCES `Job`(`id`) ON DELETE CASCADE ON UPDATE CASCADE
    -- NO foreign key on workedOnReferenceId — polymorphic reference, target
    -- table is not knowable at the schema layer. Orphan cleanup is an
    -- application concern (see Step 1 Decided callout).
);
```

No data backfill required — the `JobPerformedOn` table starts empty. Existing WOs simply have no equipment serviced until an editor sets one. The DAA / DocumentModelForm seeding in Step 2.5 does the rest of the work required to make this table usable from the UI.

## Step 2.5: Migration — DAA + DocumentModelForm Seeding

**Same migration file as Step 2.** A field doesn't render on a DataModelForm just because a column exists — the UI is driven by `DocumentAttributeAssignment` rows attached to `DocumentSection` rows, which in turn get wired to `DocumentModelForm` rows via `DocumentModelFormElements`. All of this is per-classification: `equipment-serviced` must be seeded with `subModel = 'WorkOrder'` so it appears only on WorkOrder forms and never on ProjectJob forms.

Mirrors the pattern in `apps/api/prisma/migrations/20260409100000_work_order_daa_setup/migration.sql` (DocumentSections + DAAs for the WO subModel) and `apps/api/prisma/migrations/20260416000001_rfi_email_tweaks/migration.sql` (wiring a new DAA into CREATE / EDIT / SETTINGS forms).

### 2.5a. Find (do not create) the existing "Work Order Info" section

The WO subModel already has a `Work Order Info` DocumentSection from `20260409100000_work_order_daa_setup`. Use it — don't create a duplicate.

```sql
SET @workOrderInfoSectionId = (
    SELECT id FROM DocumentSection
    WHERE referenceModel = 'Job'
      AND subModel = 'WorkOrder'
      AND name = 'Work Order Info'
    LIMIT 1
);
```

### 2.5b. Insert the DAA — WorkOrder only

```sql
SET @equipmentServicedDaaId = LEFT(MD5(UUID()), 21);

INSERT INTO DocumentAttributeAssignment (
    id, createdAt, updatedAt,
    referenceModel, subModel,
    sectionId, orderNo, mobileSectionId, mobileOrderNo,
    defaultAttribute, defaultAttributeLabel, defaultAttributeType,
    defaultAttributeIsRequired, defaultAttributeIsDerived,
    slug, referenceColumn,
    isDeleted, isArchived
) VALUES (
    @equipmentServicedDaaId, NOW(), NOW(),
    'Job', 'WorkOrder',
    @workOrderInfoSectionId, 25, @workOrderInfoSectionId, 25,
    'workedOnReferenceId', 'Equipment Serviced', 'objects',
    FALSE, FALSE,
    'equipment-serviced', 'workedOnReferenceId',
    FALSE, FALSE
);
```

Key points:
- `subModel = 'WorkOrder'` — backstop so this DAA can never leak onto a ProjectJob form even if the frontend `jobClassification` JSX gate is removed.
- `orderNo: 25` — positions between Customer and Description (verify against the actual order numbers used by neighboring DAAs in the same section after the WO-3a migrations have shipped; adjust to land in the spec's mockup position).
- `defaultAttribute = 'workedOnReferenceId'` and `referenceColumn = 'workedOnReferenceId'` — points at the primary value column on `JobPerformedOn`. The companion `workedOnReferenceModel` column is **not** represented as a separate DAA; the `customFormControl["equipment-serviced"]` override (Step 11) is the only V1 entry point for this field and it sends both columns as a pair (`workedOnReferenceModel: "Equipment"` hardcoded). When polymorphism opens up at the UI level, the custom control becomes responsible for choosing both the model and the id — the DAA still doesn't need a migration.
- `defaultAttributeType = 'objects'` — matches the plural-shaped data model (m:n join table with V1 backend cap of 1). The form engine's default for `'objects'` is an array editor, but the `customFormControl["equipment-serviced"]` override (Step 11) renders a single combobox for V1 — so the DAA shape stays consistent with the data layer regardless of the visual cardinality. When product lifts the cap to many subjects per WO, only the custom form control + GraphQL surface change; the DAA type does not need a migration.
- `defaultAttributeIsDerived = FALSE` — the user edits this; it's not computed.
- `defaultAttributeIsRequired = FALSE` — per spec, the field is optional.

### 2.5c. Wire the DAA to the three WorkOrder DocumentModelForms

Look up the three `DocumentModelForm` rows for `(referenceModel = 'Job', subModel = 'WorkOrder')` and insert one `DocumentModelFormElements` row each. **The SETTINGS link uses `isDeleted = TRUE`** so admins can't reconfigure this system field from the Settings page; CREATE and EDIT links use `isDeleted = FALSE` so end users see the field on those forms.

```sql
-- CREATE form: visible to end users
INSERT INTO DocumentModelFormElements (
    id, createdAt, updatedAt,
    documentModelFormId, documentAttributeAssignmentId,
    isDeleted, isArchived
) VALUES (
    LEFT(MD5(UUID()), 21), NOW(), NOW(),
    (SELECT id FROM DocumentModelForm
       WHERE referenceModel = 'Job' AND subModel = 'WorkOrder' AND formType = 'CREATE'),
    @equipmentServicedDaaId,
    FALSE, FALSE
);

-- EDIT form: visible to end users
INSERT INTO DocumentModelFormElements (
    id, createdAt, updatedAt,
    documentModelFormId, documentAttributeAssignmentId,
    isDeleted, isArchived
) VALUES (
    LEFT(MD5(UUID()), 21), NOW(), NOW(),
    (SELECT id FROM DocumentModelForm
       WHERE referenceModel = 'Job' AND subModel = 'WorkOrder' AND formType = 'EDIT'),
    @equipmentServicedDaaId,
    FALSE, FALSE
);

-- SETTINGS form: present but turned off so admins don't see a toggle for this system field
INSERT INTO DocumentModelFormElements (
    id, createdAt, updatedAt,
    documentModelFormId, documentAttributeAssignmentId,
    isDeleted, isArchived
) VALUES (
    LEFT(MD5(UUID()), 21), NOW(), NOW(),
    (SELECT id FROM DocumentModelForm
       WHERE referenceModel = 'Job' AND subModel = 'WorkOrder' AND formType = 'SETTINGS'),
    @equipmentServicedDaaId,
    TRUE, FALSE
);
```

### 2.5d. Do NOT create a ProjectJob DAA

The `equipment-serviced` DAA is intentionally only seeded for `subModel = 'WorkOrder'`. No corresponding row is inserted for `subModel = 'ProjectJob'`. This is the structural guarantee that ProjectJob forms never render this field, regardless of any frontend changes.

## Step 5: JobPerformedOn GraphQL Resolver

**Create file:** `apps/api/src/graphql/models/JobPerformedOn.ts`

Type is exposed for completeness (lets other consumers introspect the join), but only `Query.jobPerformedOn` is exposed — no mutations. All writes go through the Job resolver.

The GraphQL type carries the raw polymorphic columns plus a V1 convenience field `Equipment` that returns the linked row only when `workedOnReferenceModel === "Equipment"`. Future subject types add sibling fields (`Location`, `Vehicle`) without breaking the V1 callers.

```graphql
type JobPerformedOn {
    id: ID!
    jobId: String!
    Job: Job
    workedOnReferenceModel: String!
    workedOnReferenceId: String!
    # V1 convenience — resolves only when workedOnReferenceModel = "Equipment".
    Equipment: Equipment
    createdAt: DateTime
}

extend type Query {
    # Both lookup paths supported. equipmentId is the V1 convenience filter and
    # internally narrows to (workedOnReferenceModel: "Equipment", workedOnReferenceId: equipmentId).
    jobPerformedOn(
        jobId: ID
        workedOnReferenceModel: String
        workedOnReferenceId: ID
        equipmentId: ID
    ): [JobPerformedOn]
}
```

Resolvers:

```typescript
Resolvers: {
    Job: (parent) =>
        prisma.job.findUnique({ where: { id: parent.jobId } }),
    Equipment: (parent) =>
        parent.workedOnReferenceModel === "Equipment"
            ? prisma.equipment.findUnique({ where: { id: parent.workedOnReferenceId } })
            : null
},
Query: {
    jobPerformedOn: (_, args, context) => {
        // Translate the V1 convenience filter into the polymorphic shape.
        const workedOnReferenceModel =
            args.workedOnReferenceModel ?? (args.equipmentId ? "Equipment" : undefined);
        const workedOnReferenceId = args.workedOnReferenceId ?? args.equipmentId;
        return new JobPerformedOnModel().getList(
            {
                where: {
                    ...(args.jobId ? { jobId: args.jobId } : {}),
                    ...(workedOnReferenceModel ? { workedOnReferenceModel } : {}),
                    ...(workedOnReferenceId ? { workedOnReferenceId } : {}),
                    isDeleted: false
                }
            },
            context.userId()
        ).then(r => r.list);
    }
}
```

Register in `apps/api/src/graphql/schema.ts` (4 places: import + Resolvers spread + Query spread + typeDefs) and export from `apps/api/src/graphql/models/index.ts`.

## Step 6: Extend Job — Write-Through workedOnReferenceModel / workedOnReferenceId

**File:** `apps/api/src/models/Job.ts`

The pair `workedOnReferenceModel` + `workedOnReferenceId` arrives on the `createJob` / `editJob` input but is not stored on the `Job` table — it's a write-through to the `JobPerformedOn` join table. Per the existing Job pattern (e.g. `jobSiteSupervisorIds` destructured-and-stripped in `Job.ts:createItem` around line 1064, and the `customEditItem` body around `Job.ts:1352-1399`), there is **no `modelFields` entry** for these virtual fields. Instead, both fields are destructured from the data object **before** the base write, then handled separately afterward.

### 6a. No modelFields entry needed

Do **not** add `workedOnReferenceModel` / `workedOnReferenceId` to `Job.modelFields`. BaseModel does not have an `isVirtual` option — the convention is to manually strip non-column fields inside the custom hooks.

### 6b. **Extend** the existing `Job.createItem` — do NOT replace it

`JobModel.createItem` **already exists** at `Job.ts:979-1130` and does a lot of load-bearing work: project / standalone job-number generation, geofence validation (`checkInRadius >= 25`), the `forecastedEndDateIsManual` flag, the `assertNotInternalProject` check at the top, the `jobSiteSupervisorIds` destructure-and-write-through at lines 1064 + 1126-1128, and default folder creation via the `super.createItem` callback (lines 1066-1125). **None of this gets removed.** The WO-11 extension slots in alongside the existing `jobSiteSupervisorIds` pattern — same destructure, same post-`super.createItem` write-through.

There is no `customCreateItem` method on `JobModel` — don't invent one. The override mechanism here is the existing `createItem` override that already calls `super.createItem(rest, ...)` at line 1066.

**Shape of the change** — only the lines marked `// + NEW` are added; every other line in the method stays as-is:

```typescript
public async createItem(
    data: Partial<FullModel<IJob & {
        jobSiteSupervisorIds: string[];
        workedOnReferenceModel: string;       // + NEW
        workedOnReferenceId: string;          // + NEW
    }>>,
    currentUserId: string,
    skipAfterCreate?: boolean,
    callback?: (data: FullModel<IJob>) => void
): Promise<FullModel<IJob>> {
    // ...all existing validation + numbering + standalone-job logic (lines 985-1062) stays as-is...

    // Extend the existing destructure at line 1064 to also pull the new pair:
    const {
        jobSiteSupervisorIds,
        workedOnReferenceModel,               // + NEW
        workedOnReferenceId,                  // + NEW
        ...rest
    } = copiedData;

    // ...existing super.createItem(rest, currentUserId, skipAfterCreate, async (job) => { folder creation }) call stays as-is (lines 1066-1125)...

    // Existing supervisor connect at lines 1126-1128 stays as-is:
    if (jobSiteSupervisorIds) {
        await this.connectJobSiteSupervisors(created.id, jobSiteSupervisorIds, currentUserId);
    }

    // + NEW — fires only when at least one half of the pair was supplied on input.
    if (workedOnReferenceModel !== undefined || workedOnReferenceId !== undefined) {
        await this.assertValidWorkedOnReference(
            created.id,
            workedOnReferenceModel,
            workedOnReferenceId,
            rest.jobTypeId
        );
        await this.syncPerformedOn(
            created.id,
            workedOnReferenceModel ?? null,
            workedOnReferenceId ?? null,
            currentUserId
        );
    }

    return created;
}
```

The diff against the existing method is intentionally small: the signature's `data` shape gains two new optional keys, the destructure at line 1064 gains two names, and one new post-create block fires alongside the existing supervisor block. Every other line — folder creation, job-number generation, geofence check, forecasted-end-date handling, `assertNotInternalProject` — is untouched.

### 6c. `customEditItem` — real signature has 8 parameters

The actual `customEditItem` signature on `JobModel` (around `Job.ts:1352`) is:

```typescript
public async customEditItem(
    id: string,
    data: Partial<IJob & { jobSiteSupervisorIds: string[] }>,
    enableDisconnect: boolean,
    currentUserId: string,
    instance: Instance,
    documentData?: ...,
    skipAfterEdit?: boolean,
    callback?: ...
): Promise<FullModel<IJob>>
```

Keep the full signature when extending it; do not collapse to 3 params. The write-through extension slots in next to the existing `jobSiteSupervisorIds` handling — destructure both keys out of `data` near the top, then defer the join-table sync to **after** the existing `customEditItem` body has run and the Job row is persisted.

```typescript
public async customEditItem(id, data, enableDisconnect, currentUserId, instance, documentData, skipAfterEdit, callback) {
    const dataAny = data as any;
    const hasKey = "workedOnReferenceModel" in dataAny || "workedOnReferenceId" in dataAny;
    const { workedOnReferenceModel, workedOnReferenceId, ...rest } = dataAny;

    // ...existing customEditItem body runs over `rest` (or `data` if it strips
    // workedOnReferenceModel/workedOnReferenceId itself); the existing classification-change
    // check at Job.ts:1375-1399 already inlines the propertyValue lookup the
    // way 6d below mirrors.

    const job = await super.customEditItem(
        id, rest, enableDisconnect, currentUserId, instance, documentData, skipAfterEdit, callback
    );

    if (hasKey) {
        await this.assertValidWorkedOnReference(id, workedOnReferenceModel, workedOnReferenceId, rest.jobTypeId);
        await this.syncPerformedOn(id, workedOnReferenceModel ?? null, workedOnReferenceId ?? null, currentUserId);
    }
    return job;
}
```

The "either key present in `data`" check distinguishes "fields absent from input → leave alone" from "fields present with null → clear it." This matches the GraphQL semantic where omitted input fields should be no-ops.

### 6d. Validation helper — inline the `propertyValue` lookup

`JobModel` does **not** expose a `getJobClassification(jobTypeId)` method. The existing precedent at `Job.ts:1385-1400` derives jobClassification by querying `prisma.propertyValue.findUnique({ where: { id: jobTypeId } })` and reading `.jobClassification`. Mirror that — do not invent a helper method that isn't there.

```typescript
private async assertValidWorkedOnReference(
    jobId: string,
    workedOnReferenceModel: string | null | undefined,
    workedOnReferenceId: string | null | undefined,
    jobTypeIdFromInput: string | null | undefined
) {
    // Half-set inputs (one null, one set) are treated as clear by syncPerformedOn,
    // but we don't want them to ALSO pass through validation as "set" — so guard
    // only when both are truthy.
    if (!workedOnReferenceModel || !workedOnReferenceId) return;

    // V1 allowlist — explicit product sign-off required to add subject types.
    const ALLOWED_WORKED_ON_MODELS = ["Equipment"] as const;
    if (!ALLOWED_WORKED_ON_MODELS.includes(workedOnReferenceModel as any)) {
        throw new Error(
            `workedOnReferenceModel "${workedOnReferenceModel}" is not supported on Job.workedOn. Allowed: ${ALLOWED_WORKED_ON_MODELS.join(", ")}.`
        );
    }

    // Classification gate. Inline the propertyValue lookup (no helper method exists).
    const effectiveJobTypeId =
        jobTypeIdFromInput ??
        (await prisma.job.findUnique({ where: { id: jobId }, select: { jobTypeId: true } }))?.jobTypeId;
    if (!effectiveJobTypeId) {
        throw new Error("Cannot set worked-on reference: Job has no jobType.");
    }
    const classification = (
        await prisma.propertyValue.findUnique({
            where: { id: effectiveJobTypeId },
            select: { jobClassification: true }
        })
    )?.jobClassification;
    if (classification !== "WorkOrder") {
        throw new Error(
            "Worked-on reference is only valid on Jobs with WorkOrder classification."
        );
    }
}
```

### 6e. `syncPerformedOn` — soft-delete-then-insert

```typescript
private async syncPerformedOn(
    jobId: string,
    workedOnReferenceModel: string | null,
    workedOnReferenceId: string | null,
    currentUserId: string
) {
    // V1 cap of 1: soft-delete any existing non-deleted rows, then insert.
    await prisma.jobPerformedOn.updateMany({
        where: { jobId, isDeleted: false },
        data: { isDeleted: true }
    });
    // Both fields must be present together to insert. Half-set inputs are
    // treated as clear (defensive — should never reach here from the
    // customFormControl which writes the pair together, but a direct
    // GraphQL mutation could).
    if (workedOnReferenceModel && workedOnReferenceId) {
        await new JobPerformedOnModel().createItem(
            { jobId, workedOnReferenceModel, workedOnReferenceId },
            currentUserId
        );
    }
}
```

### 6f. Wire `workedOnReferenceId` into `Job.upsert.nullableIdFields`

Verified: `Job.upsert()` exists at `Job.ts:2962`, with a `nullableIdFields` array at lines 2974-2981 currently containing `"projectId", "companyId", "locationId", "jobStatusId", "jobTypeId", "rateTypeId", "jobLeadId"`.

`Job.upsert()` at `apps/api/src/models/Job.ts:2962` is what `DataModelForm` submissions route through (legacy `createJob` / `editJob` mutations also exist, but the form path goes through `upsert`). One adjustment needed there:

**Add `workedOnReferenceId` to the empty-string-to-null normalization list** at `Job.ts:2974-2987` (the `Model` field doesn't need normalizing — the customFormControl hardcodes it to `"Equipment"` or omits both, never `""`):

```typescript
const nullableIdFields = [
    "projectId",
    "companyId",
    "locationId",
    "jobStatusId",
    "jobTypeId",
    "rateTypeId",
    "jobLeadId",
    "workedOnReferenceId" // NEW — combobox clear sends "" instead of null
] as const;
```

Without this, clearing the equipment combobox in the form sends `""`, which would slip past the truthy `if (workedOnReferenceModel && workedOnReferenceId)` guard in Step 6b in an unintended way. The list converts `""` → `null` so the syncPerformedOn helper treats it as "clear the link."

**No other change to `upsert` is needed.** Both fields flow through as part of `...restData` to either `createItem` (the override from Step 6b) or `customEditItem` (the override from Step 6c), and the destructure-with-rest pattern in those overrides keeps them out of the Prisma payload. The `upsert` callback that handles `documentData` (DocumentAttributeValues) is irrelevant here because the worked-on pointer is stored in `JobPerformedOn`, not as a DAV.

**Why delete-then-insert rather than upsert:** the V1 cap is "at most one non-deleted row." Sweeping the existing rows enforces the cap as a side effect of every write, even if a future bug somehow created multiple rows.

```typescript

workedOnReferenceModel: async (parent) => {
    const row = await prisma.jobPerformedOn.findFirst({
        where: { jobId: parent.id, isDeleted: false },
        select: { workedOnReferenceModel: true }

workedOnReferenceId: async (parent) => {

## Step 8: Extend Equipment GraphQL — ServiceHistory field

**File:** `apps/api/src/graphql/models/Equipment.ts`

### 8a. Add to Equipment type

```graphql
type Equipment {
    # ...existing fields
    ServiceHistory(isCompleted: Boolean, take: Int, skip: Int): [Job]
}
```

`ServiceHistory` reads as the canonical domain concept ("RTU-3's service history") and is target-agnostic — when polymorphism lands, `Location.ServiceHistory` / `Vehicle.ServiceHistory` slot in with the same semantics.

### 8b. Add field-level resolver

`ServiceHistory` is a pure GraphQL field resolver — Equipment has no Prisma relation to `JobPerformedOn` (polymorphic side). The resolver queries the join table with the polymorphic filter.

```typescript
// In Equipment Resolvers:
ServiceHistory: async (parent, args) => {
    const joinRows = await prisma.jobPerformedOn.findMany({
        where: {
            workedOnReferenceModel: "Equipment",
            workedOnReferenceId: parent.id,
            isDeleted: false,
            Job: { isDeleted: false }
        },
        select: { jobId: true },
        take: args.take,
        skip: args.skip
    });
    const jobIds = joinRows.map(r => r.jobId);
    if (jobIds.length === 0) return [];
    return prisma.job.findMany({
        where: { id: { in: jobIds } },
        orderBy: { createdAt: "desc" }
    });
}
```

**Note:** This field is fine for low-volume per-equipment lookups (the Equipment detail page Work Orders tab). For the desktop ListTable view with sorting/filtering/pagination, use the JobListFeed view extension in Step 9 — `ServiceHistory` is the "give me the chronological list" simple path.

## Step 9: JobListFeed SQL View — Surface worked-on pointer

**File:** `apps/api/prisma/views/JobListFeed.sql`

The WO list page (and the Equipment detail Work Orders tab desktop view) both route through `JobListFeed`. Surface the polymorphic pointer plus the resolved Equipment name as derived columns so the Equipment Serviced column is sortable / filterable through the existing TableFeed plumbing.

### 9a. Update the view

Three correlated subqueries — pointer model, pointer id, and the V1-specific Equipment name. The Equipment join is filtered by `workedOnReferenceModel = 'Equipment'` so it stays correct when other subject types land.

```sql
-- In JobListFeed.sql, add to the SELECT list:
,
(
    SELECT jpo.workedOnReferenceModel
    FROM JobPerformedOn jpo
    WHERE jpo.jobId = Job.id AND jpo.isDeleted = FALSE
    LIMIT 1
) AS workedOnReferenceModel,
(
    SELECT jpo.workedOnReferenceId
    FROM JobPerformedOn jpo
    WHERE jpo.jobId = Job.id AND jpo.isDeleted = FALSE
    LIMIT 1
) AS workedOnReferenceId,
(
    SELECT e.name
    FROM JobPerformedOn jpo
    LEFT JOIN Equipment e ON e.id = jpo.workedOnReferenceId
    WHERE jpo.jobId = Job.id
      AND jpo.workedOnReferenceModel = 'Equipment'
      AND jpo.isDeleted = FALSE
    LIMIT 1
) AS performedOnEquipmentName
```

The correlated subquery form keeps the V1 cap of 1 implicit. When the product cap is lifted, all three subqueries need to change to `GROUP_CONCAT` or a separate flatten — but for V1 the singular case is the contract. Future subject types each get their own resolved-name subquery (e.g. `performedOnLocationName` joining `Location` with `workedOnReferenceModel = 'Location'`).
