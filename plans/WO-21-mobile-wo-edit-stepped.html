# WO-21: Mobile WO Edit · Stepped Form (Free Navigation) — Implementation Plan

## Overview

Mobile WO edit today opens `MobileWODataModelForm` with `steppedForm={false}` (`apps/mobile/src/components/WorkOrders/WODetail.tsx:85`) — a single flat scroll. WO-8a already shipped the stepped wizard for WO *create*, including the section-by-section flow, `StepIndicator`, `StepNavigation`, and Summary step inside `apps/mobile/src/components/Forms/DataModelForm/DataModelForm.tsx`. This plan flips edit onto that same wizard and adds a **free-navigation mode** so techs can jump straight to any section instead of walking sequentially. Three new props on `DataModelForm` carry the difference:

- `steppedFormMode: "sequential" | "free"` — sequential (default) preserves create's gated-Next behavior; free unlocks every step dot, surfaces Save on every step, and moves required-field enforcement from "Next gate" to "Save gate."
- `initialSectionId: string` — lets the WO detail page open the flyout pointed straight at a specific section. `DataModelForm` resolves it to a step index internally by matching `sections[].id`. Using a string (not numeric step index) keeps the deep-link stable if section order ever changes.
- `saveOnEveryStep: boolean` — exposes Save on every step's action bar (not only Summary).

> **Architecture decision — implement the deep-link via flyout prop, not URL routing.** The spec describes "deep-link into that section's step." Mobile edit opens as a `useFlyout()` flyout (not a separate `/edit` route), so the natural plumbing is to forward `initialSectionId` as a flyout prop. The result is identical from the user's perspective: tap a section on the detail page, the wizard opens at that step. URL routing would require a flyout-to-page rewrite that's well outside this ticket's 1–1.5d estimate.

> **Architecture decision — keep `validateAndAdvance` for sequential mode; add `validateAllSections` for free mode's Save.** `DataModelForm.validateAndAdvance` (`DataModelForm.tsx:417–447`) currently checks the *current* section only and is wired to the Next button. Sequential create depends on that. For free mode's Save, we add a sibling `validateAllSections` that runs `validateDataModelForm` (lines 75–128) across every section's fields and returns `{ field, message, stepIndex, sectionLabel }[]` — same validators, broader scope, plus the step-index pointer the spec needs for the "tap to fix" error message. A `validateSection` helper already exists at `DataModelForm.tsx:130` and is reused inside `validateAllSections`.

> **Architecture decision — plumb the deep-link through `DetailOverview`, not via per-tab affordances.** `WODetail.tsx` actually only has three tabs (Overview / Notes / Files at lines 101–160), and all WO field sections are rendered *inside* the Overview tab via the shared `DetailOverview` component, which renders each section as a `DetailCard`. The line-item editors (`wo-labor-items`, `wo-material-items`, etc.) are not separate tabs — they are field columns inside the Overview's sectionedRecord, surfaced via `customColumnRender` + `fullWidthColumns` (lines 113–132). Today, `DetailOverview` only renders an edit handle on the *first* section (`DetailOverview.tsx:86` — `handleEdit={index === 0 ? onEdit : undefined}`) and the `onEdit` callback receives no section context. To support per-section deep-link, we extend `DetailOverview`'s `onEdit` signature to `(sectionId?: string) => void` and render the edit handle on every section when `editPermission` is true. WODetail's `handleEdit` accepts the optional `sectionId` and forwards it as `initialSectionId` to `MobileWODataModelForm`. The top-of-page Edit button stays — it calls `handleEdit()` with no argument, so the wizard lands on the first step.

**Estimated effort:** 1–1.5 days
**Risk:** Low — sequential mode default keeps all create flows untouched. The new free-mode behavior is additive, gated by a prop.
**Spec:** `tm-work-orders-uis/wo-21-mobile-wo-edit-stepped.html`
**Requires:** WO-8a (stepped wizard, `StepIndicator`, `StepNavigation`), WO-3 (DataModelForm field rendering + validators)

## Step 1: Extend `DataModelForm` Props for Free-Navigation Mode

**File:** `apps/mobile/src/components/Forms/DataModelForm/DataModelForm.tsx`

### 1a. Add three optional props to `IDataModelFormProps`

The interface lives at lines 32–62. After the existing `steppedForm?: boolean` at line 44, add:

```typescript
interface IDataModelFormProps {
    // ... existing props
    steppedForm?: boolean;
    steppedFormMode?: "sequential" | "free"; // defaults "sequential"
    initialSectionId?: string;                // resolved to step index by matching sections[].id
    saveOnEveryStep?: boolean;                // defaults false; when true, Save on every step's action bar
}
```

Defaults preserve every current call site — `steppedFormMode` defaults to `"sequential"`, `initialSectionId` is unset (lands on step 0), `saveOnEveryStep` to `false`. WO-8a's create flow continues to behave exactly as today.

### 1b. Honor `initialSectionId` once the form definition loads

The stepped-form state lives at line 221:

```typescript
const [activeStep, setActiveStep] = useState(0);
```

Leave this initialization alone — sections are not yet known at mount time (they come from a query). Inside the existing `useEffect` that initializes form data once `data` arrives (lines 236–252), append a resolver:

```typescript
useEffect(() => {
    if (!loading && data) {
        // ... existing init
        if (steppedForm && initialSectionId) {
            const sectionsLocal = (data?.dataModel?.form?.sections ?? []) as FormSection[];
            const idx = sectionsLocal.findIndex((s) => s.id === initialSectionId);
            if (idx >= 0) setActiveStep(idx);
        }
    }
}, [loading, data, formType]);
```

If the section id isn't found, we silently leave `activeStep` at 0 — preserves graceful behavior if the form definition changes.

### 1c. Pass mode + saveOnEveryStep down

Forward the new props into `StepIndicator` (Step 2) and `StepNavigation` (Step 3) at the existing render sites (lines 463–474 and 510–521).

## Step 2: `StepIndicator` — Free-Navigation Tappable Dots

**File:** `apps/mobile/src/components/Forms/DataModelForm/StepIndicator.tsx`

### 2a. Accept `mode` prop

The current props (lines 5–11):

```typescript
interface IStepIndicatorProps {
    className?: string | ClassNames;
    totalSteps: number;
    activeStep: number;
    sectionLabels?: string[];
    onStepTap: (step: number) => void;
}
```

Add:

```typescript
mode?: "sequential" | "free"; // defaults "sequential"
```

### 2b. Make every dot tappable in free mode

Line 44–47 currently gates the tap and disables the button when not completed:

```tsx
onClick={() => {
    if (isCompleted) onStepTap(index);
}}
disabled={!isCompleted}
```

Change to:

```tsx
onClick={() => {
    if (mode === "free" || isCompleted) onStepTap(index);
}}
disabled={mode !== "free" && !isCompleted}
```

### 2c. Tappable visual treatment for pending dots in free mode

The dot uses inline Tailwind classes today (lines 37–43): `bg-success` for completed, `bg-info` for active, `bg-gray-200 text-gray-500` for pending. In free mode, pending dots should render with a tappable blue-outline treatment (per CLAUDE.md semantic colors). Add an extra `.if(...)` branch before the gray pending fallback:

```tsx
className={new ClassNames(
    "w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0"
)
    .if(isCompleted, "bg-success text-white cursor-pointer")
    .if(isActive, "bg-info text-white")
    .if(
        !isCompleted && !isActive && mode === "free",
        "bg-white text-info border-2 border-info cursor-pointer"
    )
    .if(
        !isCompleted && !isActive && mode !== "free",
        "bg-gray-200 text-gray-500"
    )
    .list()}
```

### 2d. Sequential mode unchanged

When `mode === "sequential"` (default), the component behaves exactly as today: only completed dots are tappable, pending dots are greyed. No regression for create.

## Step 3: `StepNavigation` — Save on Every Step in Free Mode

**File:** `apps/mobile/src/components/Forms/DataModelForm/StepNavigation.tsx`

### 3a. Accept new props

Current props (lines 5–13) include `activeStep`, `totalSteps`, `onPrevious`, `onNext`, `onCancel`, `returnToSummary`. Add:

```typescript
saveOnEveryStep?: boolean; // defaults false
onSave?: () => void;        // free-mode Save handler; required when saveOnEveryStep is true
isSaving?: boolean;         // for disabling/labeling the Save button while submitting
```

### 3b. Render Save button when `saveOnEveryStep`

Current render (lines 27–45) shows Cancel + (Previous when not first) + Next/Review with `Button` from `~root/components`. When `saveOnEveryStep=true`, insert a Save button between Previous and Next. The Next button still shows "Next" / "Review Summary" / "Back to Summary" — Save coexists with it:

```tsx
<div className={new ClassNames("flex gap-3 px-4 py-3 border-t border-gray-200 bg-white")
    .add(className)
    .list()}>
    <Button color="white" onClick={onCancel} fullWidth size="xl" outline>
        Cancel
    </Button>
    {!isFirst ? (
        <Button color="default" onClick={onPrevious} fullWidth size="xl">
            Previous
        </Button>
    ) : null}
    {saveOnEveryStep && onSave ? (
        <Button color="success" onClick={onSave} fullWidth size="xl" disabled={isSaving}>
            {isSaving ? "Saving..." : "Save"}
        </Button>
    ) : null}
    <Button color={saveOnEveryStep ? "info" : "success"} onClick={onNext} fullWidth size="xl">
        {returnToSummary ? "Back to Summary" : isLast ? "Review Summary" : "Next"}
    </Button>
</div>
```

Use `Button` from `~root/components` (already the existing import) — not `@useanzen/ui`. In free mode the primary CTA on each non-summary step shifts to Save (success-green); Next becomes the secondary "info" blue.

### 3c. Sequential mode unchanged

When `saveOnEveryStep` is `false`/undefined, the action bar renders exactly as today — Cancel / Previous / Next, with Save reachable only via the Summary step's submit. WO-8a create flow is untouched.

## Step 4: Validation Routing — Save Gate with Step-Index Pointers

**File:** `apps/mobile/src/components/Forms/DataModelForm/DataModelForm.tsx`

### 4a. Add `validateAllSections` helper

Sibling to `validateAndAdvance` (lines 417–447). Reuses the existing `validateSection` helper at line 130 across every section and tags each error with its step index + section label:

```typescript
const validateAllSections = useCallback((): Array<{
    field: string;
    message: string;
    stepIndex: number;
    sectionLabel: string;
}> => {
    return sections.flatMap((section, stepIndex) =>
        validateSection(section, formData).map((err) => ({
            ...err,
            stepIndex,
            sectionLabel: section.label
        }))
    );
}, [sections, formData]);
```

### 4b. Wire the free-mode Save handler

At the stepped-form render branch (lines 458–525), pass `onSave` to `StepNavigation` only when `steppedFormMode === "free"` and `saveOnEveryStep === true`. The toast mechanism is `notify.error` from `useNotification()` already imported at line 209:

```typescript
const handleFreeSave = useCallback(async () => {
    const allErrors = validateAllSections();
    if (allErrors.length > 0) {
        const first = allErrors[0];
        setErrors(allErrors.map(({ field, message }) => ({ field, message })));
        setActiveStep(first.stepIndex);
        scrollRef.current?.scrollTo({ top: 0, behavior: "smooth" });
        notify.error(
            `${first.sectionLabel}: ${first.message}. Jumped to step ${first.stepIndex + 1}.`
        );
        return;
    }
    await handleSubmit(); // existing submit handler at line 260
}, [validateAllSections, handleSubmit, notify]);
```

The handler jumps the user to the first failing step automatically (in addition to surfacing the toast) — simpler UX than a tappable toast, and the existing `notify` API doesn't support tap callbacks.

### 4c. Sequential mode keeps current behavior

`validateAndAdvance` stays untouched. Sequential create still gates Next on per-section validation. The new free-mode path is parallel; nothing reroutes.

### 4d. Summary step Save in free mode

The Summary step (`SteppedFormSummary` at lines 477–486) already calls `handleSubmit`. In free mode, route the Summary's `onSubmit` through `handleFreeSave` instead so the user gets the same step-jump-on-error UX whether they tap Save from a section step or the Summary step.

## Step 6: `DetailOverview` + `WODetail.tsx` — Stepped Edit + Per-Section Deep-Link

### 6a. Flip the existing edit flyout to stepped mode

**File:** `apps/mobile/src/components/WorkOrders/WODetail.tsx`

Line 85 currently passes `steppedForm={false}` to `MobileWODataModelForm` inside the flyout. Change to `steppedForm={true}`. The wrapper from Step 5 will pick up the edit-mode defaults (`steppedFormMode="free"`, `saveOnEveryStep=true`). The top-of-page "Edit" button (lines 172–176) keeps its current handler — calling `handleEdit()` with no argument so the user lands on the first section.

### 6b. Extend `DetailOverview` to support per-section edit deep-link

**File:** `apps/mobile/src/components/DetailOverview/DetailOverview.tsx`

Today, `DetailOverview`'s `onEdit` is a no-arg callback rendered only on the first section (`handleEdit={index === 0 ? onEdit : undefined}` at line 86). To support deep-linking, broaden the signature and render the edit handle on every section when `editPermission` is true:

```typescript
type DataModelMode = {
    // ...existing
    onEdit?: (sectionId?: string) => void; // now takes optional sectionId
    editPermission: boolean;
    // ...rest unchanged
};
```

In `SectionsList`:

```tsx
{sections.map((section) => (
    <DetailCard
        label={section.label}
        key={section.id}
        handleEdit={onEdit ? () => onEdit(section.id) : undefined}
        editPermission={editPermission}
        // ...rest unchanged
    >
        {/* elements */}
    </DetailCard>
))}
```

This is backwards-compatible:
- `RFIDetail.tsx` (line 111–112) passes `onEdit={canEdit ? handleEdit : undefined}` where `handleEdit: () => void` — TS accepts the wider signature because the optional `sectionId` arg can be ignored.
- `ProjectDetail.tsx` uses `CustomQueryMode`, which doesn't render edit handles (the prop isn't on that variant).
- Existing consumers that ignore the new argument get the same "edit the whole record" behavior; the difference is the handle now renders on every section, not just the first. For RFI, this is desirable (any section can be edited).

### 6c. Wire `WODetail.tsx` to forward the section id as `initialSectionId`

In `WODetail.tsx`:

```tsx
const handleEdit = (sectionId?: string) => {
    openFlyout(
        <MobileWODataModelForm
            formType={DataModelFormType.Edit}
            recordId={woId}
            steppedForm={true}
            initialSectionId={sectionId}
            onSaved={() => {
                setRefetchKey((k) => k + 1);
                closeFlyout();
            }}
        />,
        { /* ...existing flyout opts */ }
    );
};
```

Pass `onEdit` and `editPermission` to `DetailOverview` inside the Overview tab:

```tsx
<DetailOverview
    modelName={TableDataName.Job}
    recordId={woId}
    subModel="WorkOrder"
    onEdit={canEdit ? handleEdit : undefined}
    editPermission={canEdit}
    fullWidthColumns={[...]}
    customColumnRender={{...}}
/>
```

The top-of-page Edit button (line 173) calls `handleEdit()` with no argument → lands on the first step. Tapping a section's edit handle calls `handleEdit(section.id)` → wizard opens at that section.

### 6d. Permission gating

`canEdit` is already computed at lines 38–45 of `WODetail.tsx` via `hasPermissions()` — reuse it for both `onEdit` (conditionally passed) and `editPermission` (always passed as a boolean, since `DataModelMode` requires it). Per-section affordances inherit the same gate.

## Step 7: Verification & Manual Testing

### 7a. Manual test plan

Run the mobile dev server (`pnpm run dev:mobile`) and exercise:

1. **Create flow regression** — Create a new WO. Step indicator gates on Next, pending dots greyed, Save only on Summary. Confirm sequential behavior unchanged.
2. **Edit from "Edit" button** — Open an existing WO, tap top-of-page Edit. Wizard opens at Step 1. All step dots tappable (blue outline on pending). Save button visible on every step.
3. **Edit from section deep-link** — Open the same WO. Scroll to a section card (e.g., "Equipment") in the Overview tab and tap its pencil/edit handle. Wizard opens at that section's step directly. All other steps still tappable.
4. **Free-mode jump-around** — From edit Step 1, tap step 4 directly. Form jumps without validating step 1. Tap step 2. Edit a field. Tap step 5. Edit a field. Tap Save. Confirm both edits persist.
5. **Save-gate validation** — Open edit. Tap a section step. Clear a required field. Tap Save (from any step). Toast names the offending section ("Customer & Site: Customer name is required. Jumped to step 2."). Wizard auto-jumps to that step; the failing field shows its inline error.
6. **Summary step in edit** — Tap Summary step (last). Confirm same overview layout as create's Summary. Save from Summary runs the same Save-gate validation as Save from any other step.

### 7b. Things that must still work

- Create flow on mobile (sequential, gated Next, Save on Summary only) — no regression
- WO detail page tab navigation for read view — tabs still display read content
- Permission gating on tabs and on the Edit-this-section affordance
- Line-item save callback (`saveLineItems` in `MobileWODataModelForm.tsx`) — fires on submit regardless of which step was last active
- Existing `submitDataModelForm` mutation — unchanged; same payload shape

## Deviations from Spec

| Spec section | Deviation | Reason |
|---|---|---|
| Mockup 1 — vertical section row list with chevrons | Reuse existing `DetailOverview` section cards inside the Overview tab and surface a per-section edit handle on each card | `WODetail.tsx` only has three tabs (Overview / Notes / Files). All WO field sections render as `DetailCard`s inside the Overview tab via the shared `DetailOverview` component. Rebuilding the page into a vertical row layout is a larger UX change than 1–1.5d supports and would impact `RFIDetail`/`ProjectDetail` too. The deep-link UX is preserved via the per-card edit handle; only the visual entry differs. |
| §5 "edit?step=N" deep-link URL | Pass `initialSectionId` as a flyout prop, not a URL query param | Mobile edit opens as a flyout via `useFlyout()`, not a separate route. URL routing would require rewriting the edit surface from flyout to page. Functionally equivalent for the user. |
| Step-index deep-link | Use `initialSectionId` (string) instead of `initialStep` (number) | Section IDs from the form definition are stable across schema changes; numeric step indexes silently drift if a section is added/reordered. |
