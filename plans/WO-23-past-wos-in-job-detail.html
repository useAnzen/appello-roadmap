# WO-23: Past WOs in Job Detail — Implementation Plan

## Overview

Surface the list of WOs nested under a Project Job on the Job detail page, and surface the reverse pointer ("Part of: &lt;parent Job&gt;") on the WO detail header. Data-model piece is a single self-FK on `Job`: `parentJobId` (nullable, `SetNull` on parent archive). UI piece is a new "Work Orders" tab on the Project Job detail page (desktop + mobile) that mounts the existing `JobList` component with a `parentJobId = this.job.id` filter — no new list UI to build. A "+ New work order" button on that tab opens the existing `JobAddEditForm` pre-wired with this Job as the parent.

Smallest possible subset of the post-V1 sub-relationships work (WOX-23) — just enough to answer "what WOs have been done on this job?" Action item from the 2026-05-07 Kris × Corey × Emma demo call.

**Estimated effort:** 1-1.5 days
**Risk:** Low — additive self-FK with `SetNull`, no migration of existing data, reuse of `JobList` for both list rendering and "+ Create" flow
**Spec:** `tm-work-orders-uis/wo-23-past-wos-in-job-detail.html`
**Requires:** WO-1 (Job classification routing)
**Enables:** Future WOX-23 sub-relationships (Project / Job / WO / Task with rollup financials)

---

## Decided — self-FK on Job, classification gate, JobList reuse, no rollups

**Self-FK on `Job`, not a join table.** WOs *are* Jobs (per WO-1) — the hierarchy "Project Job has child WOs" is a parent-child relationship between rows of the same table. A self-FK is the natural shape and mirrors the existing `Department` self-hierarchy in the schema (`schema.prisma:5510-5513` — `parentId`/`Parent`/`Children` named `DepartmentHierarchy`). Self-FK now means WOX-23 just extends the nesting; no new model to migrate later.

**`SetNull` on parent archive, no cascade.** A child WO is a first-class record with its own labor / materials / equipment / financials. Removing or archiving the parent Job must never delete the child. The FK is `ON DELETE SET NULL` — the child loses its pointer but survives intact.

**Validation lives in the Job model, not in the resolver.** `Job.customCreateItem` and `Job.customEditItem` enforce both invariants on every write path (resolver, upsert, DAA-form save): (a) the parent must be a `ProjectJob`-classified Job — V1 forbids WO-under-WO, and (b) a Job cannot be its own parent. The existing `customEditItem` (`apps/api/src/models/Job.ts:1348-1399`) already validates classification changes; the parent-classification check slots into the same block.

**No cycle check in V1.** Nesting is shallow — one level only. Cycles cannot form when the parent must be a ProjectJob and the child must be a WO. WOX-23 will revisit when nesting depth grows.

**`JobList` is the list-rendering surface.** The desktop "Work Orders" tab on the Project Job detail page mounts `JobList` (`apps/frontend/src/components/SharedListViews/JobList.tsx`) — the same component that powers the WO portfolio page (`apps/frontend/src/pages/work-orders/index.tsx`). New `parentJobId` prop threads through `queryVariableDefaultFilters` so the underlying `tableData` resolver filters server-side by the parent's id. No new list component, no new "+ New work order" flyout — `JobList` already opens the existing `JobAddEditForm` flyout.

**No rollup financials in V1.** Child WO financials do **not** roll up into the parent Job's financial summary. The parent's totals continue to compute from its own labor / materials / equipment / line items. Rollups are explicitly WOX-23.

**Tab visibility is classification-scoped.** The "Work Orders" tab is hidden on WO-classified Jobs in V1 — WOs don't nest under WOs, so the list would always be empty. Gating: same `data.job.rateType?.slug` / `jobClassification` branch used elsewhere on the Job detail tabs array (`apps/frontend/src/components/DetailsPage/JobDetailsPage/index.tsx:109-148`).

## Step 1: Prisma Schema — `Job.parentJobId` Self-FK

**File:** `apps/api/prisma/schema.prisma` (Job model at lines 1154-1244)

Add the FK column, the two named relations (forward + inverse), and a composite index on `(parentJobId, isDeleted)` so the per-parent filter used by the new "Work Orders" tab can be served from the index without scanning the table.

```prisma
model Job {
    // ...existing fields

    parentJobId String? @db.VarChar(21)
    ParentJob   Job?    @relation("JobChildJobs",
                                  fields: [parentJobId],
                                  references: [id],
                                  onDelete: SetNull,
                                  onUpdate: Cascade)
    ChildJobs   Job[]   @relation("JobChildJobs")

    // ...existing indexes
    @@index([parentJobId, isDeleted], map: "Job_parentJob_idx")
}
```

Why named relation `JobChildJobs`: Prisma requires explicit relation names on every self-relation. The name has to match the inverse field. Same convention as the existing `Department` self-relation (`DepartmentHierarchy` — `schema.prisma:5512-5513`).

Why `SetNull` on the FK: archiving the parent Job must not delete the child WO. The child loses its pointer but survives. Matches the "Out of Scope: Cascading rules on parent Job archive" decision in the spec.

---

## Step 2: Migration — Column + FK + Index + DAA + Form Wiring (single file)

**Create file:** `apps/api/prisma/migrations/[timestamp]_wo_23_job_parent_hierarchy/migration.sql`

Everything for WO-23's data layer lands in one migration: the schema change (column + index + FK), the DAA that makes the field show up on the WO forms, and the `DocumentModelFormElements` rows that wire the DAA to the WorkOrder CREATE / EDIT / SETTINGS forms. Pattern mirrors `apps/api/prisma/migrations/20260409100000_work_order_daa_setup/migration.sql` which does the same one-file column-plus-DAA-plus-form-wiring move for the original WO sub-model setup.

```sql
-- =============================================================
-- 1. Schema: nullable self-FK + composite index + foreign key
-- =============================================================

-- 1a. Add the nullable self-FK column.
ALTER TABLE `Job` ADD COLUMN `parentJobId` VARCHAR(21) NULL;

-- 1b. Composite index for the per-parent child lookup. Combined with isDeleted
--     so the live-rows-only query path used by the "Work Orders" tab is served
--     entirely from the index.
ALTER TABLE `Job` ADD INDEX `Job_parentJob_idx` (`parentJobId`, `isDeleted`);

-- 1c. Self-FK with SET NULL on parent archive/delete. Children survive intact.
ALTER TABLE `Job`
    ADD CONSTRAINT `Job_parentJobId_fkey`
    FOREIGN KEY (`parentJobId`) REFERENCES `Job`(`id`)
    ON DELETE SET NULL ON UPDATE CASCADE;

-- No backfill — every existing Job starts with parentJobId = NULL. Standalone
-- WOs remain standalone. The existing JobSafetyForm.jobId form-submission
-- visibility path is untouched; this column is purely additive.
--
-- No ReferenceModel registration — the column is a real FK to an existing
-- table, not a polymorphic reference.

-- =============================================================
-- 2. DAA: `wo-parent-job` field on the WorkOrder subModel
-- =============================================================
-- Without a DAA the parentJobId field will not appear on the DAA-driven WO
-- Create / Edit / Settings forms — the form engine renders nothing for columns
-- that have no corresponding DocumentAttributeAssignment row.
--
-- Pattern mirrors `job-project` (single-FK relationship field, `defaultAttributeType = 'object'`).
--
-- subModel = 'WorkOrder' is a structural guarantee this row only renders on
-- WO forms. NO corresponding DAA is seeded for subModel = 'ProjectJob' — V1
-- forbids ProjectJob-under-ProjectJob and WO-under-WO; a ProjectJob is itself
-- the top of the hierarchy.

SET @woParentJobDaaId = LEFT(MD5(UUID()), 21);

INSERT INTO `DocumentAttributeAssignment` (
    `id`, `createdAt`, `updatedAt`,
    `referenceModel`, `subModel`,
    `sectionId`, `orderNo`, `mobileSectionId`, `mobileOrderNo`,
    `defaultAttribute`, `defaultAttributeLabel`, `defaultAttributeType`,
    `defaultAttributeIsRequired`, `defaultAttributeIsDerived`,
    `slug`, `referenceColumn`,
    `isDeleted`, `isArchived`
) VALUES (
    @woParentJobDaaId, NOW(), NOW(),
    'Job', 'WorkOrder',
    (SELECT id FROM `DocumentSection`
        WHERE `referenceModel` = 'Job' AND `subModel` = 'WorkOrder' AND `name` = 'Work Order Info' LIMIT 1),
    20,
    (SELECT id FROM `DocumentSection`
        WHERE `referenceModel` = 'Job' AND `subModel` = 'WorkOrder' AND `name` = 'Work Order Info' LIMIT 1),
    20,
    'wo-parent-job', 'Parent Job', 'object',
    FALSE, FALSE,
    'wo-parent-job', 'parentJobId',
    FALSE, FALSE
);

-- =============================================================
-- 3. DocumentModelFormElements: wire the DAA to all three WorkOrder forms
-- =============================================================
-- CREATE, EDIT, and SETTINGS all show the Parent Job picker.

INSERT INTO `DocumentModelFormElements` (
    `id`, `createdAt`, `updatedAt`,
    `documentModelFormId`, `documentAttributeAssignmentId`,
    `isDeleted`, `isArchived`
) VALUES
    (LEFT(MD5(UUID()), 21), NOW(), NOW(),
     (SELECT id FROM `DocumentModelForm`
         WHERE `referenceModel` = 'Job' AND `subModel` = 'WorkOrder' AND `formType` = 'CREATE'),
     @woParentJobDaaId, FALSE, FALSE),
    (LEFT(MD5(UUID()), 21), NOW(), NOW(),
     (SELECT id FROM `DocumentModelForm`
         WHERE `referenceModel` = 'Job' AND `subModel` = 'WorkOrder' AND `formType` = 'EDIT'),
     @woParentJobDaaId, FALSE, FALSE),
    (LEFT(MD5(UUID()), 21), NOW(), NOW(),
     (SELECT id FROM `DocumentModelForm`
         WHERE `referenceModel` = 'Job' AND `subModel` = 'WorkOrder' AND `formType` = 'SETTINGS'),
     @woParentJobDaaId, FALSE, FALSE);
```

Key points on the DAA / form wiring:
- `defaultAttributeType = 'object'` (singular) — single-FK relationship; the standard DataModelForm engine renders the combobox via its built-in `'object'` renderer. No `customFormControl` slot needed.
- `slug = 'wo-parent-job'`, `defaultAttribute = 'wo-parent-job'`, `referenceColumn = 'parentJobId'` — the DB column the value writes back to is `parentJobId` on the `Job` row.
- `defaultAttributeIsRequired = FALSE` — a standalone WO with no parent is valid.
- Section: drops into the existing "Work Order Info" section (created in `20260409100000_work_order_daa_setup`); `orderNo = 20` places it after the shared Job fields. Adjust against the actual sibling `orderNo`s shipped by that migration as needed.
- **No `subModel = 'ProjectJob'` DAA** — structural guarantee the Parent Job picker never appears on a ProjectJob form, and belt-and-braces with the `assertValidParentJob` validator in Step 4.

## Step 4: Extend `Job` Model — Parent Validation

**File:** `apps/api/src/models/Job.ts`

Two invariants enforced at the model layer (so every write path is covered — resolver, upsert, DAA form save):

1. **Parent must be a `ProjectJob`-classified Job.** Looking up the parent's classification follows the same `jobTypeId → PropertyValue.jobClassification` lookup pattern already in `customEditItem` at lines 1375-1399.
2. **A Job cannot be its own parent.** Trivial id check.

### 4a. Add `parentJobId` to `modelFields`

```typescript
// In the modelFields array on JobModel:
{ name: "parentJobId", type: "string", options: { canEdit: true, isFilterable: true } }
```

`isFilterable: true` is what lets the TableFeed / `getList` paths accept `where: { parentJobId: "..." }` filters from the frontend `JobList` mount (Step 6).

### 4b. Shared validation helper

```typescript
// Top of Job.ts (or alongside assertJobNotInInternalProject):
async function assertValidParentJob(
    candidateParentJobId: string | null | undefined,
    childJobId: string | null | undefined
) {
    if (!candidateParentJobId) return; // null parent is always valid (clears link)

    if (childJobId && candidateParentJobId === childJobId) {
        throw new BadRequestError("A Job cannot be its own parent.");
    }

    const parent = await prisma.job.findUnique({
        where: { id: candidateParentJobId },
        select: { jobTypeId: true, isDeleted: true }
    });
    if (!parent || parent.isDeleted) {
        throw new BadRequestError("Parent Job not found.");
    }

    const parentClassification = parent.jobTypeId
        ? (
              await prisma.propertyValue.findUnique({
                  where: { id: parent.jobTypeId },
                  select: { jobClassification: true }
              })
          )?.jobClassification ?? "ProjectJob"
        : "ProjectJob";

    if (parentClassification !== "ProjectJob") {
        throw new BadRequestError(
            "A Work Order's parent must be a Project Job. Nesting Work Orders under Work Orders is not supported."
        );
    }
}
```

### 4c. Call the validator from `customCreateItem` / `customEditItem`

```typescript
// In customCreateItem, before super.customCreateItem:
await assertValidParentJob(data.parentJobId, null);

// In customEditItem, alongside the existing classification check at lines 1375-1399:
if ("parentJobId" in data) {
    await assertValidParentJob(data.parentJobId, id);
}
```

`"parentJobId" in data` distinguishes "omitted" (no-op) from "explicitly null" (clear the link). An explicit `null` parent is valid and clears the FK — needed for the "Out of Scope: Bulk-reparent UI" exit hatch where the user reparents one-at-a-time via the WO edit form.

### 7b. `MobileJobChildWorkOrders` — list component

**Create file:** `apps/mobile/src/components/JobViews/MobileJobChildWorkOrders.tsx`

A thin wrapper around the mobile WO list pattern (the one used by `apps/mobile/src/pages/work-orders/index.tsx` or equivalent). It fetches `useGetTableDataRecordSetQuery` with `GqlTableDataName.Job`, `where: { jobClassification: "WorkOrder", parentJobId: jobId }`, and renders each row as a compact card linking to `/work-orders/[childId]`.

```tsx
interface IMobileJobChildWorkOrdersProps {
    jobId: string;
    className?: string;
}

const MobileJobChildWorkOrders: FC<IMobileJobChildWorkOrdersProps> = ({ jobId, className = "" }) => {
    const { data, loading, refetch } = useGetTableDataRecordSetQuery({
        variables: {
            modelName: GqlTableDataName.Job,
            options: {
                where: { jobClassification: "WorkOrder", parentJobId: jobId, isArchived: false },
                columns: ["full-job-number", "name", "work-order-status", "completion-date"],
                orderBy: { column: "fullJobNumber", direction: "desc" }
            }
        }
    });

    const rows = (data?.tableData?.recordSet as Array<Record<string, any>>) ?? [];

    return (
        <div className={new ClassNames("p-3 space-y-2").add(className).list()}>
            <div className="flex items-center justify-between">
                <h3 className="text-sm font-semibold">Work Orders ({rows.length})</h3>
                <Button size="sm" onClick={() => openCreateFlyout(jobId, refetch)}>
                    <IconPlus className="w-4 h-4" />
                    New
                </Button>
            </div>
            {loading && <Loader />}
            {!loading && rows.length === 0 && (
                <p className="text-sm text-gray-500">No Work Orders yet.</p>
            )}
            {rows.map((row) => (
                <Link key={row.id} href={`/work-orders/${row.id}`}>
                    {/* compact row: WO# - name, status chip, completion date */}
                </Link>
            ))}
        </div>
    );
};

## Step 9: Reparenting Edge Cases

The "Out of Scope" list says no bulk-reparent UI in V1 — but the standard WO edit form **does** allow reparenting one-at-a-time via the `parentJobId` field on `EditJob`. This is fully handled by the DAA from Step 2.5 — no additional UI work in this step:

- **Set / change parent** — the `wo-parent-job` DAA renders on the WO Edit / Settings form via the standard DataModelForm engine's `'object'` (relationship) renderer. Selecting a different parent sends the new id through `EditJob.parentJobId`; the validator in Step 4b gates classification + self-parenting on submit.
- **Clear parent** — the standard relationship control supports clearing the value; the form sends `null`. The model layer accepts explicit `null` because of the `"parentJobId" in data` distinction in Step 4c.

The pre-wired form (created via the "+ New work order" CTA on a Project Job's Work Orders tab — Step 6a) opens the same field with the parent's id already selected. The user can change or clear it before saving if needed.
