# WO-17 — Pricing Permission Gate · Implementation Plan

**Spec:** [wo-17-pricing-permission-gate.html](../wo-17-pricing-permission-gate.html)
**Estimate:** ~3.5–4 days · 0.25d Prisma migration · 0.15d PermissionMap wiring · ~2.5d shared-UI billable-rate plumbing + prop split (incl. API resolvers, mapper, 3 displays, 3 editors with live re-resolution, Material rename cascade) · 0.25d desktop wiring · 0.25d mobile wiring · 0.25d PDF wiring.
**Branch suggestion:** `wo-17-pricing-permission-gate`

**Six-part plan, must ship in order.** Read all six before starting — Part 3 changes the meaning of existing props on the shared display + editor components, adds new billable-rate plumbing, and renames Material's `showCost` prop to `showPrice`; Parts 4–6 depend on those changes.

1. Prisma migration to seed the permission and grant it to `super-admin` + `admin` roles only.
2. `PermissionMap.ts` wiring so the permission appears in the role editor under a new "Work Orders" group.
3. Shared-UI billable-rate plumbing + prop split. Three concerns: (a) surface `TradeLevelRate.billableValue ?? baseValue` and `EquipmentRateValue.amount` on Labor + Equipment structured rows for the first time (the displays currently render zero pricing on structured rows; the row data types carry no rate field) — including new GraphQL resolvers for live re-resolution in the editor; (b) split the existing `showRates` / `showPrice` props so they gate **structured rows only** — blank-row pricing is user input and renders unconditionally; (c) rename Material's `showCost` prop and "Unit Cost" header to `showPrice` / "Unit Price" since the displayed value is the sell price, not cost. This is the load-bearing piece of WO-17.
4. Desktop wiring on the WO Overview tab (read-only display) and the WO create/edit form (line item editors).
5. Mobile wiring on `WODetail.tsx` (display) and the mobile WO edit flow.
6. PDF wiring: compute `canViewPricing` on the client at the export trigger (same `useAuth()` + `hasPermissions()` pattern as desktop / mobile), send it in the export request, and pass it through to the existing rate-toggle props on `WorkOrderSectionPDF` from `pdf-export.ts`.

<div class="callout"><strong>Blank vs. structured — the rule that drives this plan:</strong> "Structured" labour / equipment / material lines pull their rate from a catalog source — TimeSheetRecord (via TradeLevelRate) for labour, EquipmentTimeEntry (via EquipmentRateLabel) for equipment, the Material catalog (via LEM-3 sell-price cascade) for material. Those catalog rates are the thing the permission protects. "Blank" lines have <code>materialId == null</code> / no FK to TradeLevelRate or Equipment — the user types description, qty, and rate by hand. Hiding a user's own typed-in rate from them is nonsensical, and hiding it on read-back makes the row unreadable, so blank-row pricing is exempt from this gate on every surface (display, editor, and PDF).</div>

## Part 1 · Prisma migration (REVIEW BY CHRIS)

### 1.1 · File

Mirror the existing convention: `apps/api/prisma/migrations/<YYYYMMDDHHMMSS>_<snake_case_name>/migration.sql`. Use a timestamp greater than the most recent migration. As of 2026-05-08 the latest is `20260507000000_tsr_override_furthest_detail_record`, so use:

```
apps/api/prisma/migrations/20260508000000_add_work_order_view_pricing_permission/migration.sql
```

`migration_lock.toml` lives at the migrations root and is unchanged — no per-directory lock file.

### 1.2 · Migration body

Two `INSERT IGNORE` statements: one to seed the permission row, one to grant it to `super-admin` + `admin` only. The grant uses a `CROSS JOIN` between `Role` and `Permission` filtered by slug so the same SQL is re-runnable on any environment without needing the permission's generated id baked in.

```sql
-- WO-17: Add WorkOrder___viewPricing permission and grant it to super-admin
-- and admin roles only. Other roles get the permission turned ON deliberately
-- by an admin via the role editor when a customer wants techs to see pricing.
-- Permission.name uses PascalCase model + lowercase first letter of the
-- action so hasPermissions() maps WorkOrder___viewPricing ->
-- { workOrder: { viewPricing } }.

INSERT IGNORE INTO `Permission` (`id`, `name`, `slug`) VALUES
    (SUBSTRING(MD5(UUID()), 1, 21), 'WorkOrder___viewPricing', 'workOrder___viewPricing');

INSERT IGNORE INTO `RolePermission` (`id`, `roleId`, `permissionId`, `scope`, `createdAt`, `updatedAt`)
SELECT
    LEFT(MD5(CONCAT(UUID(), r.id, p.id)), 21),
    r.id,
    p.id,
    'ALL',
    NOW(),
    NOW()
FROM
    `Role` r
    CROSS JOIN `Permission` p
WHERE
    p.slug = 'workOrder___viewPricing'
    AND r.slug IN ('super-admin', 'admin');
```

Notes for Chris's review:

- ID generation uses the `SUBSTRING(MD5(UUID()), 1, 21)` / `LEFT(MD5(CONCAT(UUID(), r.id, p.id)), 21)` pattern (nanoid VarChar(21)) consistent with how `Permission` and `RolePermission` ids are minted elsewhere in the schema.
- `INSERT IGNORE` keeps the migration idempotent — re-running on an environment that already has the row is a no-op.
- No `ReferenceModel` row needed — `WorkOrder` is a `Job.classification` value, not a Prisma model, so there is no model row for the role editor to scope against.
- Grant scope is super-admin + admin only — non-admin roles do NOT receive the permission on deploy. WO pricing surfaces are not yet live in any environment, so this is the initial state at launch — no role loses visibility they currently have. Customers who want techs to see pricing turn the permission ON via the role editor (Part 2).

## Part 3 · Shared-UI: surface billable rate on structured rows + prop split

This is the load-bearing piece of WO-17, and it's bigger than a permission gate. Three intertwined concerns:

1. **Surface the catalog billable rate on Labor + Equipment structured rows.** Today these structured rows render zero pricing — `ILaborTimeRowData` and `IStructuredEquipmentRowData` carry no rate or total fields, and the displays render no rate column on structured rows (the existing `showRates` prop only gates blank-row rate cells today). The plan adds the missing data plumbing and column rendering. Material is already plumbed end-to-end via `MaterialAttributePrice.value` → `WorkOrderMaterialItem.unitPrice`.
2. **Reframe the existing `showRates` / `showPrice` props so they gate structured rows only.** Blank rows always render their own pricing — they're user-typed input.
3. **Material prop / header naming cleanup.** Today the prop is `showCost` and the header reads "Unit Cost" but the value displayed is `MaterialAttributePrice.value` (the customer-facing sell price). Rename the prop to `showPrice` and the header to "Unit Price" so the API matches what's actually shown.

Rates are resolved fresh on every load (no stored `billableRate` column). Catalog rate changes propagate automatically — same pattern Material uses today.

### 3.0 · Catalog rate sources

| Type | Catalog billable field | Resolver |
|---|---|---|
| Labor | `TradeLevelRate.billableValue ?? baseValue` | Pattern in `apps/api/src/models/WorkOrderConversion.ts:54–89` |
| Equipment | `EquipmentRateValue.amount` (no separate cost field) | `EquipmentRateValueModel.resolveEquipmentRate(equipmentId, rateLabelId, per, jobId?, operatorIncluded?, date?)` (`apps/api/src/models/EquipmentRateValue.ts:300–364`) |
| Material | `MaterialAttributePrice.value` → already populated to `WorkOrderMaterialItem.unitPrice` | `resolveMaterialAttributePrice()` GraphQL query (already wired) |

### 3.1 · API — extend WO query response + add live re-resolve resolvers

**Display path (extend the WO load query):**

The GraphQL query that loads work-order labor + equipment line items for the Overview tab and the edit form must include the resolved billable rate so the row renders without a second round-trip:

- **Labor structured row**: `billableRate: Float` — resolved as `TradeLevelRate.billableValue ?? baseValue` for the row's `tradeLevelId` + `employeeAgreementId` + `rateLabelId`.
- **Equipment structured row**: `billableRate: Float` — resolved via `resolveEquipmentRate(equipmentId, rateLabelId, per, jobId, operatorIncluded, date)`. Also expose `operatorIncluded: Boolean` on the row so the editor has it for re-resolution.

Add thin field resolvers on the relevant GraphQL types — delegate to the existing model methods, no business logic in the resolver layer.

**Editor path (live re-resolve resolvers):**

Add two new query resolvers for the editor to call when the user changes catalog inputs on a structured row:

- `resolveLaborBillableRate(tradeLevelId: ID!, employeeAgreementId: ID, rateLabelId: ID): Float` — wraps `TradeLevelRate.billableValue ?? baseValue`.
- `resolveEquipmentBillableRate(equipmentId: ID!, rateLabelId: ID!, per: String!, operatorIncluded: Boolean!, jobId: ID, date: String): Float` — wraps `resolveEquipmentRate()`.

Both follow the thin-resolver convention (`apps/api/src/graphql/models/`); register in `apps/api/src/graphql/schema.ts`. Run `pnpm run codegen` so the frontend gets generated hooks.

### 3.2 · Type updates — `packages/ui/src/components/WorkOrder/types.ts`

Add to `ILaborTimeRowData`:

```ts
billableRate?: number; // resolved fresh on load; not stored on the WO
```

Add to `IStructuredEquipmentRowData`:

```ts
billableRate?: number;
operatorIncluded?: boolean;
```

(No change to `IMaterialRowData` — `unitPrice` already carries the sell price.)

The mapper in `packages/ui/src/components/WorkOrder/mappers.ts` populates `billableRate` from the extended GraphQL response.

### 3.3 · Files

Six shared-UI components, all in `packages/ui/src/components/WorkOrder/`:

Read-only display components:

1. `LaborItemDisplay.tsx`
2. `MaterialItemDisplay.tsx`
3. `EquipmentItemDisplay.tsx`

Editor components (introduced in WO-3b):

4. `LaborItemEditor.tsx`
5. `MaterialItemEditor.tsx`
6. `EquipmentItemEditor.tsx`

Plus:

- `types.ts` — type updates per 3.2.
- `mappers.ts` — populate `billableRate` on Labor / Equipment rows from the GraphQL response.

### 3.4 · Material naming cleanup (cascade)

Rename `showCost` → `showPrice` and the header text "Unit Cost" → "Unit Price" through the entire caller chain. The displayed value is unchanged (still `MaterialAttributePrice.value` / `unitPrice`), only the names change:

- `MaterialItemDisplay.tsx` — prop name + header text.
- `MaterialItemEditor.tsx` — new prop added in 3.8 is `showPrice`, not `showCost`.
- `apps/frontend/src/components/WorkOrder/WOMaterialDisplay.tsx` — wrapper prop.
- `apps/mobile/src/components/WorkOrders/MobileWOMaterialDisplay.tsx` — wrapper prop.
- `apps/frontend/src/components/DetailsPage/WorkOrderDetailsPage/Tabs/Overview/index.tsx` — caller (`showPrice={canViewPricing}`).
- `apps/mobile/src/components/WorkOrders/WODetail.tsx` — caller.
- The desktop and mobile WO form hosts — pass `showPrice={canViewPricing}` to `MaterialItemEditor`.
- `apps/frontend/src/components/DownloadablePDF/WorkOrderSectionPDF.tsx` — `showMaterialCost` → `showMaterialPrice` on both the inner section component (lines 110–112) and the `renderWorkOrderSectionsHTML` argument type.
- `apps/frontend/src/pages/api/pdf-export.ts` — pass `showMaterialPrice: canViewPricing`.

### 3.5 · `LaborItemDisplay.tsx`

- **Structured rows** (`dateGroups[].rows[]` of `ILaborTimeRowData`):
  - **NEW**: render a billable-rate column showing `$X.XX/hr` from `row.billableRate`.
  - **NEW**: render a row-level dollar total = `Σ hours × billableRate`.
  - Both new column / cell render only when `showRates === true`. When `showRates === false` structured rows render no pricing (current behaviour — there's nothing to render today).
- **Blank rows** (`blankItems[]` of `IBlankLaborRowData`): today the `rate` / total cells are gated by `showRates`. Move that gate so it applies to structured rows only — render blank-row `rate` / total unconditionally. Update the type comment on `IBlankLaborRowData.rate` to reflect "always rendered (user input)".
- **Subtotal footer.** Today renders only an hours total (no $ subtotal). Replace with three rows:
  - (a) Hours subtotal — always renders (existing behaviour).
  - (b) Structured $ subtotal = `Σ rows hours × row.billableRate` — gated by `showRates`.
  - (c) Blank $ subtotal = `Σ blanks duration × rate` — never gated.

### 3.6 · `MaterialItemDisplay.tsx` (with naming cleanup)

- **Prop**: rename `showCost` → `showPrice` (default `true`).
- **Header**: "Unit Cost" → "Unit Price".
- The items array is a flat list of `IMaterialRowData` with discriminator `type: "structured" | "blank"`:
  - `type === "structured"` — `unitPrice` and `total` come from the LEM-3 sell-price cascade (`priceFromCatalog === true`). Continue to gate the unit price + total cells on `showPrice`.
  - `type === "blank"` — `unitPrice`, `description`, `quantity`, and derived `total = quantity * unitPrice` are user-typed. Render `unitPrice` + `total` unconditionally on these rows; remove the `showCost &&` (now `showPrice &&`) guard from the blank branch.
- **Subtotal.** Today the entire subtotal is gated by `showCost`. Split into two rows: structured subtotal gated by `showPrice`; blank subtotal never gated. When `showPrice === false` only the blank subtotal renders.
- **Column headers.** Render the price columns when `showPrice === true` OR at least one blank row exists. Acceptable to simplify by always rendering the columns to avoid layout shift.

### 3.7 · `EquipmentItemDisplay.tsx`

Mirror Labor exactly:

- **Structured rows** (`dateGroups[].rows[]` of `IStructuredEquipmentRowData`):
  - **NEW**: render a billable-rate column showing `$X.XX / <per>` from `row.billableRate`.
  - **NEW**: render a row-level dollar total = `duration × billableRate`.
  - Both gated by `showRates === true`.
- **Blank rows** (`blankItems[]` of `IBlankEquipmentRowData`): user-typed `unitRate` + derived total. Move the gate so it applies to structured rows only; render blank-row rate + total unconditionally. Update the type comment on `IBlankEquipmentRowData.unitRate` to reflect "always rendered (user input)".
- **Subtotal footer.** Today renders only a duration summary. Replace with three rows: duration summary always; structured $ subtotal = `Σ rows duration × row.billableRate` gated by `showRates`; blank $ subtotal never gated.

### 3.8 · Editor components

Editors today do **not** accept any price-toggle prop, structured-row rate displays do **not** exist, and live rate re-resolution does **not** exist. All three are new.

**Default values when adding the prop**: match the displays — `showRates` defaults to `false` (Labor / Equipment), `showPrice` defaults to `true` (Material).

**`LaborItemEditor.tsx`:**

- **Add prop**: `showRates?: boolean` (default `false`).
- **Structured rows** (`ILaborTimeRowData`): render a billable-rate display showing `$X.XX/hr` from `row.billableRate`, gated by `{showRates && …}`. Also render a per-row derived total (`Σ hours × billableRate`) under the same gate.
- **Live re-resolution**: when the user changes `tradeLevelId`, `employeeAgreementId`, or `rateLabelId` on a structured row, fire the new `resolveLaborBillableRate` query and update `row.billableRate` in-place. Show a brief loading state on the rate cell while the request is in flight.
- **Blank rows** (`IBlankLaborRowData`): "Rate ($/hr)" input is already always rendered with no wrapper — leave as-is. Per-card derived total (`hours * rate * qtyOfWorkers`) likewise.

**`MaterialItemEditor.tsx`:**

- **Add prop**: `showPrice?: boolean` (default `true`).
- **Structured rows** (`item.type === "structured"`): wrap the existing `unitPrice` display + any "override unit price" input in `{showPrice && …}` — NEW gate. Existing material catalog selection re-resolves `unitPrice` via `resolveMaterialAttributePrice()` already; no new query needed.
- **Blank rows** (`item.type === "blank"`): manual "Unit Price" input + derived "Total" — already always rendered — leave as-is.

**`EquipmentItemEditor.tsx`:**

- **Add prop**: `showRates?: boolean` (default `false`).
- **Structured rows** (`IStructuredEquipmentRowData`): render a billable-rate display showing `$X.XX / <per>` from `row.billableRate`, gated by `{showRates && …}`. Also render a derived row total (`duration × billableRate`) under the same gate.
- **Live re-resolution**: when the user changes `equipmentRateLabelId`, `per`, or `operatorIncluded` on a structured row, fire `resolveEquipmentBillableRate` and update `row.billableRate` in-place.
- **Blank rows** (`IBlankEquipmentRowData`): "Rate" input + derived "Total" already always render — leave as-is.

**Add-row dropdowns are not gated.** "Log Time / Blank Line" (labor), "Structured Line / Blank Line" (material), "Log Equipment / Blank Line" (equipment) — every user with edit access keeps these. The permission only hides catalog-sourced rate values, not the ability to add or describe rows.

### 3.9 · Verification

Render each component in a scratch harness with a mix of structured + blank rows and confirm:

1. **Labor + Equipment displays**:
   - With `showRates === true`: structured rows render billable rate + row total; blank rows render rate + total; hours/duration subtotal + structured $ subtotal + blank $ subtotal all render.
   - With `showRates === false`: structured rows render no pricing; blank rows still render rate + total; only hours/duration subtotal + blank $ subtotal render.
2. **Material display**:
   - With `showPrice === true`: structured rows render unit price + total; blank rows render unit price + total; both subtotals render. Header reads "Unit Price".
   - With `showPrice === false`: structured rows render no price; blank rows still render price + total; only blank subtotal renders.
3. **Editors**:
   - With prop set to `false`: structured-row rate displays hidden; blank-row rate inputs remain present, focusable, accept input.
   - With prop set to `true`: structured rows show resolved billable rate + derived row total. Changing trade level / rate label / equipment / `per` / `operatorIncluded` re-resolves the rate via the new GraphQL query and updates the row.
4. Hours / qty / duration / unit-of-measure render in all states on every row.

### 4.2 · Overview tab — add the permission lookup

Add to the imports:

```tsx

import { hasPermissions } from "~root/lib";
```

(`useAuth` may already be imported via another hook elsewhere in the file — check before adding.)

The wrapper components already forward these props — no changes needed in `WO*Display.tsx` themselves.

### 4.3 · WO create/edit form — wire the editors

Locate the form host (the file that mounts `LaborItemEditor` / `MaterialItemEditor` / `EquipmentItemEditor` on the WO create/edit page — per WO-3b this is the desktop form's `customFormControl` for the three line-item DAA positions). Compute `canViewPricing` the same way:

```tsx

const canViewPricing = hasPermissions({ workOrder: { viewPricing: true } }, permissions);
```

Pass through to each editor:

```tsx
<LaborItemEditor     {...laborProps}     showRates={canViewPricing} />
<MaterialItemEditor  {...materialProps}  showPrice={canViewPricing} />
<EquipmentItemEditor {...equipmentProps} showRates={canViewPricing} />
```

The editors accept `showRates` (Labor / Equipment) / `showPrice` (Material) after Part 3.8 (defaults `false` / `true`). No additional changes inside the editor files at this step — Part 4.3 is purely wiring `canViewPricing` from the form host through to each editor's prop.

### 4.4 · Why this is safe

- `WO*Display.tsx` forwards `showRates` (Labor / Equipment) / `showPrice` (Material — renamed in Part 3.4) to the shared display components — Part 3 changed the meaning of those props inside the shared components and renamed the Material prop, but otherwise the wrapper signatures stay structurally the same.
- `useAuth().permissions` is the authoritative source on every desktop page; `hasPermissions()` is the standard reader (used by every other gate in the app, e.g. `JobDetailsPage` for safetyForm and equipment).
- The underlying display + editor components hide structured-row pricing only — no resolver / GraphQL changes; the data still arrives, the UI omits it.

1. As an admin, open `/work-orders/<wo-id>`. Confirm pricing columns + structured subtotal render on Labor, Materials, and Equipment line items. Add a blank row to each section in the editor (open the create form for a fresh WO if needed) — confirm pricing inputs are present in the editor.
2. Edit a non-admin role; toggle OFF "Operations → Work Orders → View Pricing"; save.
3. Log out / log in as a user with that role. Open the same WO detail page:
   - Structured rows: rate / cost / total columns absent.
   - Blank rows: rate / cost / total columns **present** (user-typed values).
   - Hours / qty / duration / units columns remain everywhere.

## Out of scope — do NOT do these

- **No banner / stamp / watermark anywhere.** Silent hide per Appello convention.
- **No backend resolver changes** to strip pricing fields. Resolvers continue returning pricing; the UI hides the columns.
- **No new GraphQL types / queries / mutations.** Part 6 reuses `useAuth()` on the client; the server endpoint just reads a boolean from the request — no server-side permission lookup.
- **No mid-session live-revocation UX.** Page reload picks up new state.
- **No editor-surface gating beyond rate visibility on look-up rows.** The "Add blank line" affordance is not gated; users without the permission can still add blank rows. Any tighter editor gating (block creation, hide structured-row editing entirely) is a separate follow-up if a customer asks.
- **No WO list page changes.** The list page does not currently expose pricing per row; if it gains a Total column later, it inherits this gate at that time.
- **No `ReferenceModel` row.** `WorkOrder` is a `Job.classification` value, not a model.
- **No "—" or "$ ---" placeholders.** Hide entire columns on structured rows; blank rows render their own values.
- **Do not gate blank-row pricing on any surface.** Blank-row rate / unit price / total are user-typed input. Hiding user-typed input from the user who typed it is nonsensical and breaks editor usability.
- **Do not modify the underlying `LaborItemDisplay` / `MaterialItemDisplay` / `EquipmentItemDisplay` row-rendering schema** beyond the structured-vs-blank gate split in Part 3 — column layout and styling stay as-is.
