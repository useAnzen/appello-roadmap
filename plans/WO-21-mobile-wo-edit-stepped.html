# WO-21: Mobile WO Edit · Stepped Form (Free Navigation) — Implementation Plan

## Overview

Mobile WO edit today opens `MobileWODataModelForm` with `steppedForm={false}` (`apps/mobile/src/components/WorkOrders/WODetail.tsx:89`) — a single flat scroll. WO-8a already shipped the stepped wizard for WO *create*, including the section-by-section flow, `StepIndicator`, `StepNavigation`, and Summary step inside `apps/mobile/src/components/Forms/DataModelForm/DataModelForm.tsx`. This plan flips edit onto that same wizard and adds a **free-navigation mode** so techs can jump straight to any section instead of walking sequentially. Three new props on `DataModelForm` carry the difference:

- `steppedFormMode: "sequential" | "free"` — sequential (default) preserves create's gated-Next behavior; free unlocks every step dot, surfaces Save on every step, and moves required-field enforcement from "Next gate" to "Save gate."
- `initialStep: number` — lets the WO detail page open the flyout pointed straight at a specific section's step (deep-link-equivalent, since edit opens as a flyout, not a separate route).
- `saveOnEveryStep: boolean` — exposes Save on every step's action bar (not only Summary).

> **Architecture decision — implement the deep-link via flyout prop, not URL routing.** The spec describes "deep-link into that section's step." Mobile edit opens as a `useFlyout()` flyout (not a separate `/edit` route), so the natural plumbing is to forward `initialStep` as a flyout prop. The result is identical from the user's perspective: tap a section on the detail page, the wizard opens at that step. URL routing would require a flyout-to-page rewrite that's well outside this ticket's 1–1.5d estimate.

> **Architecture decision — keep `validateAndAdvance` for sequential mode; add `validateAllSections` for free mode's Save.** `DataModelForm.validateAndAdvance` (`DataModelForm.tsx:417–447`) currently checks the *current* section only and is wired to the Next button. Sequential create depends on that. For free mode's Save, we add a sibling `validateAllSections` that runs `validateDataModelForm` (lines 75–128) across every section's fields and returns `{ field, message, stepIndex }[]` — same validators, broader scope, plus the step-index pointer the spec needs for the "tap to fix" error message.

> **Architecture decision — the existing tabs in `WODetail.tsx` are the deep-link affordance.** `WODetail.tsx` already renders a tab list for Overview / Notes / Forms / Files / Equipment / line-item sections (lines 105–203). Rather than rebuild that into vertical section rows (the spec mockup), reuse the existing tabs: add an **"Edit this section"** affordance within each tab's content that opens the edit flyout with `initialStep` set to that section's step index. The top-of-page **"Edit"** button stays — it opens the flyout at step 0. This keeps the read-view tabs (which are already polished and permission-gated at line 86) intact; the deep-link is layered on top.

**Estimated effort:** 1–1.5 days
**Risk:** Low — sequential mode default keeps all create flows untouched. The new free-mode behavior is additive, gated by a prop.
**Spec:** `tm-work-orders-uis/wo-21-mobile-wo-edit-stepped.html`
**Requires:** WO-8a (stepped wizard, `StepIndicator`, `StepNavigation`), WO-3 (DataModelForm field rendering + validators)

## Step 1: Extend `DataModelForm` Props for Free-Navigation Mode

**File:** `apps/mobile/src/components/Forms/DataModelForm/DataModelForm.tsx`

### 1a. Add three optional props to `IDataModelFormProps`

The interface lives at lines 32–62. After the existing `steppedForm?: boolean` at line 44, add:

```typescript
interface IDataModelFormProps {
    // ... existing props
    steppedForm?: boolean;
    steppedFormMode?: "sequential" | "free"; // defaults "sequential"
    initialStep?: number;                     // defaults 0; clamped to [0, totalSteps - 1]
    saveOnEveryStep?: boolean;                // defaults false; when true, Save on every step's action bar
}
```

Defaults preserve every current call site — `steppedFormMode` defaults to `"sequential"`, `initialStep` to `0`, `saveOnEveryStep` to `false`. WO-8a's create flow continues to behave exactly as today.

### 1b. Honor `initialStep` in the `activeStep` initial state

The stepped-form state lives at lines 220–222:

```typescript
const [activeStep, setActiveStep] = useState<number>(0);
```

Change to:

```typescript
const [activeStep, setActiveStep] = useState<number>(() => {
    if (!steppedForm) return 0;
    const totalSteps = sections.length + 1; // +1 for Summary
    return Math.max(0, Math.min(initialStep ?? 0, totalSteps - 1));
});
```

The clamp guards against a stale `initialStep` carried over from a record with a different section count.

### 1c. Pass mode + saveOnEveryStep down

Forward the new props into `StepIndicator` (Step 2) and `StepNavigation` (Step 3) at the existing render sites (lines 463–474 and 510–521).

## Step 2: `StepIndicator` — Free-Navigation Tappable Dots

**File:** `apps/mobile/src/components/Forms/DataModelForm/StepIndicator.tsx`

### 2a. Accept `mode` prop

The current props (lines 5–11):

```typescript
interface IStepIndicatorProps {
    totalSteps: number;
    activeStep: number;
    sectionLabels: string[];
    onStepTap: (stepIndex: number) => void;
}
```

Add:

```typescript
mode?: "sequential" | "free"; // defaults "sequential"
```

### 2b. Make every dot tappable in free mode

Line 45 currently gates the tap by completion:

```typescript
if (isCompleted) onStepTap(index);
```

Change to:

```typescript
if (mode === "free" || isCompleted) onStepTap(index);
```

### 2c. Tappable visual treatment for pending dots

Pending dots in sequential mode render greyed out. In free mode, render with the blue-outline tappable styling (`border-info text-info` per CLAUDE.md semantic colors, matching the spec mockup at `wo-21-mobile-wo-edit-stepped.html` Mockup 2). Use `ClassNames`:

```tsx
className={new ClassNames("step-dot")
    .if(isCompleted, "step-dot-done")
    .if(isActive, "step-dot-active")
    .if(isPending && mode === "free", "step-dot-pending border-info text-info cursor-pointer")
    .if(isPending && mode !== "free", "step-dot-pending")
    .list()}
```

(Adjust class names to match whatever `StepIndicator.tsx` already uses — the existing `step-dot-pending` class likely exists; the addition is the free-mode override.)

### 2d. Sequential mode unchanged

When `mode === "sequential"` (default), the component behaves exactly as today: only completed dots are tappable, pending dots are greyed. No regression for create.

## Step 3: `StepNavigation` — Save on Every Step in Free Mode

**File:** `apps/mobile/src/components/Forms/DataModelForm/StepNavigation.tsx`

### 3a. Accept new props

Current props (lines 5–13) include `activeStep`, `totalSteps`, `onPrevious`, `onNext`, `onCancel`. Add:

```typescript
mode?: "sequential" | "free"; // defaults "sequential"
saveOnEveryStep?: boolean;     // defaults false
onSave?: () => void;            // free-mode Save handler; required when saveOnEveryStep is true
```

### 3b. Render Save button when `saveOnEveryStep`

Current render (lines 27–45) shows Cancel + Previous + Next/Review. In free mode with `saveOnEveryStep=true`, render the trio Previous + **Save** + Next:

```tsx
<div className="flex gap-2">
    <Button color="secondary" onClick={onCancel}>Cancel</Button>
    {activeStep > 0 && (
        <Button color="secondary" onClick={onPrevious}>Previous</Button>
    )}
    {saveOnEveryStep && (
        <Button color="success" onClick={onSave}>Save</Button>
    )}
    {activeStep < totalSteps - 1 && (
        <Button color="primary" onClick={onNext}>Next</Button>
    )}
</div>
```

Use `Button` from `@useanzen/ui` per CLAUDE.md (no raw `<button>`). Match the existing button styling from this file.

### 3c. Sequential mode unchanged

When `saveOnEveryStep` is `false`/undefined, the action bar renders exactly as today — Cancel / Previous / Next, with Save reachable only via the Summary step's submit. WO-8a create flow is untouched.

## Step 4: Validation Routing — Save Gate with Step-Index Pointers

**File:** `apps/mobile/src/components/Forms/DataModelForm/DataModelForm.tsx`

### 4a. Add `validateAllSections` helper

Sibling to `validateAndAdvance` (lines 417–447). Runs `validateDataModelForm` (lines 75–128) across every section's fields and tags each error with its source step index:

```typescript
interface ISectionValidationError {
    field: string;
    message: string;
    stepIndex: number;
    sectionLabel: string;
}

const validateAllSections = (): ISectionValidationError[] => {
    const errors: ISectionValidationError[] = [];
    sections.forEach((section, stepIndex) => {
        const sectionErrors = validateDataModelForm(formData, section.fields);
        sectionErrors.forEach((err) => {
            errors.push({ ...err, stepIndex, sectionLabel: section.label });
        });
    });
    return errors;
};
```

### 4b. Wire the free-mode Save handler

At the stepped-form render branch (lines 457–525), pass `onSave` to `StepNavigation` only when `steppedFormMode === "free"` and `saveOnEveryStep === true`:

```typescript
const handleFreeSave = async () => {
    const allErrors = validateAllSections();
    if (allErrors.length > 0) {
        const first = allErrors[0];
        showError(
            `${first.sectionLabel}: ${first.message}. Tap step ${first.stepIndex + 1} to fix.`,
            { onTap: () => setActiveStep(first.stepIndex) }
        );
        return;
    }
    await handleSubmit(); // existing submit handler at line 292
};
```

`showError` should use the existing toast/snackbar utility on mobile (locate it via `useToast` / `useNotification` — confirm in `apps/mobile/src/components/Notifications/` or similar before use; do not introduce a new mechanism).

### 4c. Sequential mode keeps current behavior

`validateAndAdvance` stays untouched. Sequential create still gates Next on per-section validation. The new free-mode path is parallel; nothing reroutes.

### 4d. Summary step Save in free mode

The Summary step (lines 476–486) already calls `handleSubmit`. In free mode the same Save-gate validation should apply — wrap the Summary step's submit through `handleFreeSave` when `steppedFormMode === "free"` so the user gets the same step-pointer error UX whether they tap Save from a section step or the Summary step.

## Step 6: `WODetail.tsx` — Stepped Edit + Per-Section Deep-Link

**File:** `apps/mobile/src/components/WorkOrders/WODetail.tsx`

### 6a. Flip the existing edit flyout to stepped mode

Line 89 currently passes `steppedForm={false}` to `MobileWODataModelForm` inside the flyout. Change to `steppedForm={true}`. The wrapper from Step 5 will pick up the edit-mode defaults (`steppedFormMode="free"`, `saveOnEveryStep=true`). The top-of-page "Edit" button (line 84–101) keeps its current handler — opens the flyout with no `initialStep`, so the user lands on Step 1.

### 6b. Build a tab-id → step-index map

The detail page's tabs (lines 105–203) include both static sections (Overview / Notes / Forms / Files / Equipment) and the line-item sections (`wo-labor-items`, `wo-material-items`, `wo-equipment-items`, `wo-signatures` at lines 117–122). The DataModelForm's section ordering is sourced from the form definition (`formType`). Build a small lookup that maps each tab id to its corresponding step index in that form definition.

The most reliable place to build this mapping is alongside the `tabs` array. Either:

1. Query the same form definition the DataModelForm uses (e.g., via the existing `getDataModelForm` query) and walk its `sections[]` array to derive `{ [sectionId]: stepIndex }`, **or**
2. Hard-code the map for the WO form types since the section ordering is stable per form type.

Option 1 is more robust to schema changes; option 2 is faster to ship. **Recommend option 1** — the cost is one query the page already runs (or near-runs) and it auto-corrects if a section is added or reordered.

### 6c. Add an "Edit this section" affordance per tab

Inside each tab's content (where the read-view sits today), render a subtle action button — `Button` from `@useanzen/ui` with a small edit icon (`IconEdit`) — that opens the edit flyout passing `initialStep` for that tab's mapped step:

```tsx
<Button
    color="secondary"
    size="sm"
    onClick={() => openEditFlyout({ initialStep: tabIdToStepIndex[tab.id] })}
>
    <IconEdit /> Edit this section
</Button>
```

`openEditFlyout` is the existing `useFlyout()` open-handler used by the top-of-page Edit button (line 85). Extend its signature to accept `{ initialStep?: number }` and forward into the rendered `MobileWODataModelForm`.

### 6d. Permission gating

The existing tabs are already permission-gated via the `permission` field on each tab entry (line 86). Reuse the same gate for the Edit-this-section button — if a user can read the tab but not edit, hide the button. Use `hasPermissions()` per CLAUDE.md (never raw boolean comparison on permission values).

## Step 7: Verification & Manual Testing

### 7a. Manual test plan

Run the mobile dev server (`pnpm run dev:mobile`) and exercise:

1. **Create flow regression** — Create a new WO. Step indicator gates on Next, pending dots greyed, Save only on Summary. Confirm sequential behavior unchanged.
2. **Edit from "Edit" button** — Open an existing WO, tap top-of-page Edit. Wizard opens at Step 1. All step dots tappable (blue outline on pending). Save button visible on every step.
3. **Edit from section deep-link** — Open the same WO, tap a tab (e.g., Materials), tap "Edit this section." Wizard opens at the Materials step directly. All other steps still tappable.
4. **Free-mode jump-around** — From edit Step 1, tap step 4 directly. Form jumps without validating step 1. Tap step 2. Edit a field. Tap step 5. Edit a field. Tap Save. Confirm both edits persist.
5. **Save-gate validation** — Open edit. Tap Customer step. Clear a required field. Tap Save (from any step). Toast/error names the offending step ("Customer & Site: Customer name is required. Tap step 2 to fix."). Tap the toast. Wizard jumps to that step.
6. **Summary step in edit** — Tap Summary step (last). Confirm same overview layout as create's Summary. Save from Summary runs the same Save-gate validation as Save from any other step.

### 7b. Things that must still work

- Create flow on mobile (sequential, gated Next, Save on Summary only) — no regression
- WO detail page tab navigation for read view — tabs still display read content
- Permission gating on tabs and on the Edit-this-section affordance
- Line-item save callback (`saveLineItems` in `MobileWODataModelForm.tsx`) — fires on submit regardless of which step was last active
- Existing `submitDataModelForm` mutation — unchanged; same payload shape

| §6 Mobile WO detail page section list — replace the section list | Reuse tabs (above) | Same reason. |
